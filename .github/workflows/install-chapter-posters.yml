name: Install approved chapter posters
on:
  push:
    branches: [main]
    paths:
      - 'assets/posters-bundle.zip'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack approved chapter posters
        run: |
          mkdir -p assets/chapter-posters
          unzip -o assets/posters-bundle.zip -d assets/chapter-posters
          rm assets/posters-bundle.zip
          rm .github/workflows/install-chapter-posters.yml
      - name: Commit poster files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Install approved chapter-specific poster images"
          git push
