<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Frames of Reference — the same car from two perspectives</title>
  <desc id="desc">A split illustration shows a passenger inside a moving car and a sidewalk observer watching the same car pass. The passenger is stationary relative to the car but moving relative to the sidewalk.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#dff4ff"/><stop offset="1" stop-color="#f8fcff"/></linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#555d6b"/><stop offset="1" stop-color="#323946"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".15"/></filter>
    <marker id="redArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12Z" fill="#e63946"/></marker>
    <marker id="blueArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12Z" fill="#1982c4"/></marker>
    <style>
      text{font-family:'Poppins',Arial,sans-serif;fill:#1b1f2a}.title{font-size:30px;font-weight:800}.panel{font-size:20px;font-weight:800}.label{font-size:18px;font-weight:700}.note{font-size:17px;font-weight:600;fill:#4a5063}.pill{font-size:16px;font-weight:800}
    </style>
  </defs>
  <rect width="1200" height="680" rx="28" fill="#f6f8fc"/>
  <text x="600" y="52" text-anchor="middle" class="title">Same event — two different frames of reference</text>

  <!-- left panel: passenger frame -->
  <g filter="url(#shadow)">
    <rect x="50" y="90" width="525" height="510" rx="28" fill="#fff"/>
    <rect x="625" y="90" width="525" height="510" rx="28" fill="#fff"/>
  </g>
  <text x="312" y="132" text-anchor="middle" class="panel">VIEW 1 · INSIDE THE CAR</text>
  <text x="887" y="132" text-anchor="middle" class="panel">VIEW 2 · FROM THE SIDEWALK</text>

  <g transform="translate(86 168)">
    <!-- windshield and dashboard -->
    <path d="M24 40 H430 L386 208 H68Z" fill="#dff4ff" stroke="#bfd9e8" stroke-width="4"/>
    <rect x="44" y="205" width="370" height="86" rx="24" fill="#2f3542"/>
    <rect x="258" y="222" width="108" height="26" rx="8" fill="#6d778a"/>
    <circle cx="322" cy="302" r="54" fill="none" stroke="#1b1f2a" stroke-width="14"/>
    <path d="M322 250 V354 M270 302 H374" stroke="#1b1f2a" stroke-width="9"/>
    <!-- passenger -->
    <circle cx="116" cy="224" r="34" fill="#efc29d"/>
    <path d="M79 270 Q116 236 153 270 L166 365 H66Z" fill="#4361ee"/>
    <path d="M130 286 L218 317" stroke="#efc29d" stroke-width="17" stroke-linecap="round"/>
    <!-- outside scenery motion -->
    <g opacity=".85"><rect x="88" y="72" width="20" height="70" rx="4" fill="#6f7c8c"/><circle cx="98" cy="56" r="34" fill="#52b788"/><rect x="330" y="68" width="18" height="76" rx="4" fill="#6f7c8c"/><circle cx="338" cy="50" r="30" fill="#80c99f"/></g>
    <path d="M360 104 H218" stroke="#1982c4" stroke-width="9" marker-end="url(#blueArrow)"/>
    <text x="286" y="91" text-anchor="middle" class="label" fill="#1982c4">outside scenery appears to move left</text>
    <rect x="58" y="392" width="350" height="62" rx="18" fill="#eef1fd"/>
    <text x="233" y="418" text-anchor="middle" class="pill">Relative to the car:</text>
    <text x="233" y="442" text-anchor="middle" class="note">passenger + dashboard stay in the same positions</text>
  </g>

  <g transform="translate(656 168)">
    <rect x="0" y="284" width="466" height="120" rx="18" fill="url(#road)"/>
    <rect x="0" y="329" width="466" height="8" fill="#fff" opacity=".8"/>
    <rect x="0" y="404" width="466" height="18" fill="#a5bd86"/>
    <!-- moving car -->
    <g transform="translate(35 180)">
      <rect x="0" y="48" width="230" height="74" rx="20" fill="#e63946"/>
      <path d="M44 48 L84 8 H165 L202 48Z" fill="#f06a74"/>
      <rect x="96" y="18" width="55" height="28" rx="5" fill="#dff4ff"/>
      <circle cx="54" cy="124" r="24" fill="#202630"/><circle cx="180" cy="124" r="24" fill="#202630"/>
      <circle cx="54" cy="124" r="10" fill="#a9b3c8"/><circle cx="180" cy="124" r="10" fill="#a9b3c8"/>
      <circle cx="116" cy="72" r="12" fill="#efc29d"/>
    </g>
    <!-- observer -->
    <g transform="translate(352 176)">
      <circle cx="0" cy="0" r="28" fill="#efc29d"/>
      <path d="M-30 38 H30 L44 125 H-44Z" fill="#ffd166"/>
      <path d="M-20 124 L-30 205 M20 124 L34 205" stroke="#263149" stroke-width="14" stroke-linecap="round"/>
    </g>
    <path d="M72 158 H298" stroke="#e63946" stroke-width="10" marker-end="url(#redArrow)"/>
    <text x="185" y="142" text-anchor="middle" class="label" fill="#e63946">car + passenger move right</text>
    <rect x="36" y="432" width="390" height="62" rx="18" fill="#fdeced"/>
    <text x="231" y="458" text-anchor="middle" class="pill">Relative to the sidewalk:</text>
    <text x="231" y="482" text-anchor="middle" class="note">the car and passenger change position together</text>
  </g>

  <rect x="285" y="620" width="630" height="42" rx="20" fill="#172033"/>
  <text x="600" y="647" text-anchor="middle" font-family="Poppins,Arial,sans-serif" font-size="18" font-weight="700" fill="#fff">Motion depends on what you choose as your reference point.</text>
</svg>