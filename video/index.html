<!DOCTYPE html>
<html>
<head>
<script>window.VIDEO_CHECK_FRONT_DOOR = true;   /* the front door: see FRONT in the page script */</script>
<title>Video Check</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="strict-origin-when-cross-origin">
<base target="_blank">
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root { --green:#d9ead3; --yellow:#fff2cc; --red:#f4cccc; --strip:#c9daf8; --q:#d9d9d9; --blue:#1b4587;
          --gd:#38761d; --yd:#bf9000; --rd:#cc0000; --focus:#3c78d8; }
  * { box-sizing: border-box; }
  body { margin:0; background:#f3f3f3; font-family:Poppins, Arial, sans-serif; color:#111; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 16px 16px 120px; }
  body.teacher .wrap { max-width: 1500px; }
  h1 { font-size: 24px; font-weight: 700; margin: 8px 0 4px; }
  .who { font-size: 13px; color:#555; margin-bottom: 8px; }
  .intro { font-style: italic; color:#555; font-size: 14px; margin: 6px 0 12px; }
  .strip { background: var(--strip); font-weight:700; font-size: 17px; padding: 10px 12px; margin: 18px 0 12px;
           border-top: 2px solid #111; border-bottom: 2px solid #111; }
  .banner { background:#111; color:#fff; padding:10px 12px; border-radius:6px; font-size:14px; margin: 10px 0; }
  .banner.error { background:#cc0000; }
  .banner.blue { background: var(--blue); }
  #loading { padding: 60px 0; text-align:center; font-weight:600; }
  button { font-family:Poppins, Arial, sans-serif; font-weight:700; font-size:14px; border:2px solid #111; border-radius:6px;
           background:#111; color:#fff; padding: 7px 16px; cursor:pointer; }
  button.secondary { background:#fff; color:#111; }
  button.blue { background: var(--blue); border-color: var(--blue); }
  button:disabled { opacity:.5; cursor: default; }
  button:focus-visible, .choice:focus-visible, .mk:focus-visible, .qchip:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  /* ---------- video ---------- */
  .stage { position:relative; width:100%; aspect-ratio: 16 / 9; background:#000; border:2px solid #111; border-radius:8px; overflow:hidden; }
  .stage iframe, .stage video { position:absolute; inset:0; width:100%; height:100%; border:0; background:#000; }
  .stage .vmsg { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; color:#fff; padding:20px; font-weight:600; }
  .overlay { position:absolute; inset:0; z-index:3; background: rgba(0,0,0,.6); overflow:auto; display:flex; justify-content:center; padding: 14px; }
  .ocard { width:100%; max-width: 760px; margin: auto 0; background:#fff; border:2px solid #111; border-radius:8px; overflow:hidden; }
  .obtns { display:flex; flex-wrap:wrap; gap:8px; justify-content:flex-end; padding: 10px 12px; border-top:1px solid #bbb; background:#fafafa; }
  .obtns .spacer { flex:1; }
  @media (max-width: 640px) { .stage.qopen { aspect-ratio: auto; min-height: 560px; } }
  .skipnote { font-size:12px; color:#555; margin-top:6px; }

  /* timeline of questions under the video */
  .tl { position:relative; height: 28px; margin: 12px 9px 2px; }
  .tl .track { position:absolute; left:0; right:0; top:11px; height:6px; background:#c8c8c8; border-radius:3px; }
  .tl .seen { position:absolute; left:0; top:11px; height:6px; background:#8fa9d6; border-radius:3px; width:0; }
  .tl .now { position:absolute; top:6px; width:3px; height:16px; margin-left:-1px; background:#111; border-radius:2px; left:0; }
  .mk { position:absolute; top:4px; width:20px; height:20px; margin-left:-10px; padding:0; border-radius:50%; border:2px solid #111;
        background:#fff; color:#111; font-size:10px; line-height:1; display:grid; place-items:center; }
  .mk.note { border-radius:4px; width:15px; height:15px; margin-left:-7px; top:6px; font-size:9px; }
  .times { display:flex; justify-content:space-between; font-size:12px; color:#555; margin: 0 2px; }

  .qchips { display:flex; flex-wrap:wrap; gap:6px; margin: 12px 0 4px; }
  .qchip { border:2px solid #111; border-radius:6px; background:#fff; color:#111; padding:4px 10px; font-size:13px; }
  .qchip small { font-weight:400; }
  .correct-bg { background: var(--green) !important; } .partial-bg { background: var(--yellow) !important; } .incorrect-bg { background: var(--red) !important; }
  .locked { opacity:.45; }

  /* progress (same as Self-Check) */
  .progress { position: sticky; top: 0; z-index: 5; background:#fff; border:2px solid #111; border-radius:8px;
              padding: 10px 12px; margin: 14px 0; display:flex; flex-wrap:wrap; gap: 10px 16px; align-items:center; font-size:14px; font-weight:600; }
  .bar { flex: 1 1 220px; height: 14px; display:flex; border:1px solid #111; border-radius: 7px; overflow:hidden; background:#fff; }
  .bar span { height:100%; transition: width .3s; }
  .chip { display:inline-flex; align-items:center; gap:5px; }
  .dot { width:12px; height:12px; border:1px solid #111; border-radius:3px; display:inline-block; }
  .grade { margin-left:auto; font-size:16px; }

  /* question card (same look as Self-Check) */
  .item { border: 1px solid #bbb; background:#fff; }
  .qtext { background: var(--q); font-weight:700; font-size: 15px; padding: 10px 12px; line-height:1.45; }
  .qnum { display:inline-block; background:#111; color:#fff; border-radius:4px; padding:0 7px; margin-right:6px; font-size:13px; }
  .qnum.note { background: var(--blue); }
  .qat { font-weight:400; font-size:12px; color:#333; margin-left:6px; }
  .multi { font-weight:400; font-style:italic; font-size:13px; margin-top:4px; }
  .qimg { margin: 10px 0 2px; }
  .qimg img { display:block; max-width:100%; max-height:320px; border:2px solid #111; border-radius:4px; background:#fff; }
  .qimg figcaption { font-weight:400; font-style:italic; font-size:13px; color:#333; margin-top:4px; }
  textarea { display:block; width:100%; min-height: 96px; border:0; border-top:3px solid #111; border-bottom:3px solid #111;
             font-family:Poppins, Arial, sans-serif; font-size:15px; padding:10px 12px; resize: vertical; outline:none; background:#fff;
             transition: background .25s; }
  textarea:focus { box-shadow: inset 0 0 0 2px var(--focus); }
  textarea.correct { background: var(--green); } textarea.partial { background: var(--yellow); } textarea.incorrect { background: var(--red); }
  .choices { display:grid; gap:8px; padding: 12px; border-top:3px solid #111; }
  .choice { position:relative; display:flex; gap:10px; align-items:center; width:100%; text-align:left; background:#fff; color:#111;
            border:2px solid #111; border-radius:6px; padding: 9px 12px; font-weight:600; font-size:15px; overflow:hidden; }
  .choice .let { flex:none; width:28px; height:28px; border-radius:50%; border:2px solid #111; display:grid; place-items:center; font-weight:700; font-size:14px; background:#fff; position:relative; }
  .choice .ctext { position:relative; flex:1; }
  .choice.sel { border-color: var(--focus); box-shadow: inset 0 0 0 1px var(--focus); }
  .choice.sel .let { background: var(--focus); border-color: var(--focus); color:#fff; }
  .choice.sel.correct { background: var(--green); border-color: var(--gd); box-shadow:none; } .choice.sel.correct .let { background: var(--gd); border-color: var(--gd); }
  .choice.sel.partial { background: var(--yellow); border-color: var(--yd); box-shadow:none; } .choice.sel.partial .let { background: var(--yd); border-color: var(--yd); }
  .choice.sel.incorrect { background: var(--red); border-color: var(--rd); box-shadow:none; } .choice.sel.incorrect .let { background: var(--rd); border-color: var(--rd); }
  .fb { background:#000; color:#fff; font-style: italic; font-size: 14px; padding: 9px 12px; min-height: 38px; line-height:1.45; }
  .row { display:flex; align-items:center; justify-content: space-between; gap: 8px; padding: 8px 12px; background:#fff; }
  .meta { font-size: 12px; color:#666; }
  .finish { text-align:center; margin: 26px 0; }
  .finish button { font-size: 16px; padding: 12px 26px; }
  .card-note { padding: 12px; font-size:14px; }

  /* summary at the end of the video */
  .sum { padding: 16px; }
  .sum h2 { margin: 0 0 6px; font-size: 20px; }
  .sum p { margin: 6px 0; font-size: 14px; }

  /* live lesson: students */
  .livebox { background:#fff; border:2px solid #111; border-radius:8px; padding: 22px 18px; text-align:center; margin: 12px 0; }
  .livebox h2 { margin: 0 0 6px; font-size: 22px; }
  .pulse { display:inline-block; width:12px; height:12px; border-radius:50%; background:#cc0000; margin-right:8px; vertical-align:middle; animation: pulse 1.4s infinite; }
  @keyframes pulse { 0% { opacity:1 } 50% { opacity:.25 } 100% { opacity:1 } }
  @media (prefers-reduced-motion: reduce) { .pulse { animation:none; } }
  .waitnote { font-size: 13px; color:#555; margin-top: 12px; }

  /* live lesson: teacher screen */
  .tbar { display:flex; flex-wrap:wrap; gap:10px 14px; align-items:center; background:#111; color:#fff; border-radius:8px; padding:10px 14px; margin: 8px 0 12px; font-weight:600; }
  .tbar .live { color:#fff; font-weight:700; }
  .tbar .grow { flex:1; }
  .tbar button { background:#fff; color:#111; border-color:#fff; }
  .tbar button.danger { background:#cc0000; border-color:#cc0000; color:#fff; }
  table.periods { width:100%; border-collapse: collapse; background:#fff; border:2px solid #111; }
  table.periods th, table.periods td { padding: 10px 12px; border-bottom:1px solid #ccc; text-align:left; font-size:14px; vertical-align: middle; }
  table.periods th { background: var(--strip); }
  table.periods td.btns { text-align:right; white-space:nowrap; }
  table.periods td.btns button { margin-left:6px; }
  .tag { display:inline-block; font-size:12px; font-weight:700; padding: 2px 8px; border-radius: 10px; border:1px solid #111; }
  .tag.open { background: var(--green); } .tag.wait { background: var(--yellow); } .tag.live { background:#cc0000; color:#fff; border-color:#cc0000; }
  .linkbox { font-size:13px; background:#fff; border:1px dashed #888; padding:8px 10px; border-radius:6px; word-break: break-all; margin-top:10px; }
  body.teacher .ocard { max-width: 1100px; }
  body.teacher .ocard .qtext { font-size: clamp(18px, 2.3vw, 30px); padding: 14px 18px; }
  body.teacher .ocard .qnum { font-size: clamp(14px, 1.6vw, 20px); }
  body.teacher .ocard .choice { font-size: clamp(16px, 2vw, 26px); padding: 10px 16px; cursor: default; }
  body.teacher .ocard .choice .let { width: 1.6em; height: 1.6em; }
  .choice .tbarfill { position:absolute; left:0; top:0; bottom:0; width:0; background: rgba(27,69,135,.18); transition: width .4s; }
  .choice .tcount { position:relative; font-size: .8em; font-weight:700; white-space:nowrap; }
  .choice.right { border-color: var(--gd); background: var(--green); }
  .choice.right .let { background: var(--gd); border-color: var(--gd); color:#fff; }
  .tstats { display:flex; flex-wrap:wrap; gap: 8px 24px; align-items:center; padding: 12px 18px; border-top:1px solid #bbb; font-size: clamp(15px, 1.7vw, 22px); font-weight:700; }
  .tstats .big { font-size: 1.6em; }
  .tcolors { display:flex; gap: 12px; font-size:.8em; }
  .missing { padding: 8px 18px 12px; font-size: 14px; }
  .answers { padding: 4px 18px 14px; display:grid; gap:8px; max-height: 40vh; overflow:auto; }
  .answers div { border:1px solid #bbb; border-left-width: 8px; padding: 8px 10px; font-size: clamp(14px, 1.4vw, 18px); background:#fff; }
  .answers .correct { border-left-color: var(--gd); } .answers .partial { border-left-color: var(--yd); } .answers .incorrect { border-left-color: var(--rd); }

  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 50; background:#111; color:#fff; padding: 10px 16px;
           border-radius: 8px; font-size: 14px; font-weight:600; max-width: min(92vw, 560px); text-align:center; box-shadow: 0 4px 14px rgba(0,0,0,.3); }

  /* sign in with an emailed code (browsers where another Google account is signed in first; same as Self-Check) */
  .signin { background:#fff; border:2px solid #111; border-radius:8px; padding:16px; margin:14px 0; }
  .signin h2 { font-size:18px; margin:0 0 6px; }
  .signin p { font-size:14px; line-height:1.5; margin:6px 0 12px; }
  .signin label { display:block; font-size:13px; font-weight:600; margin-bottom:10px; }
  .signin input { display:block; width:100%; max-width:360px; margin-top:4px; padding:8px 10px; border:2px solid #111; border-radius:6px;
                  font-family:Poppins, Arial, sans-serif; font-size:16px; background:#fff; outline:none; }
  .signin input:focus { box-shadow: 0 0 0 3px rgba(60,120,216,.45); }
  .signin input.si-code { max-width:200px; font-size:22px; letter-spacing:4px; }
  .si-buttons { display:flex; flex-wrap:wrap; gap:8px; }
  .si-status { font-weight:600; min-height:1.5em; }
  .si-status.bad { color:#cc0000; }
  .si-alt { font-size:13px; color:#555; font-style:italic; border-top:1px solid #ddd; padding-top:10px; margin-bottom:0 !important; }
  button.linkbtn { background:none; border:0; border-radius:0; padding:0; color:#1b4587; text-decoration:underline; font-weight:600; font-size:inherit; }
  /* the front door (this page on the class website): Sign in with Google, then the emailed code */
  button.si-google { display:inline-flex; align-items:center; gap:10px; background:#fff; color:#111; border:2px solid #111; font-size:15px; padding:9px 18px; }
  button.si-google svg { width:20px; height:20px; flex:none; }
  .si-or { font-size:13px; font-weight:600; color:#555; border-top:1px solid #ddd; padding-top:12px; margin-top:16px !important; }
  .probewait { margin-top:14px; font-weight:400; font-size:14px; }
  /* in-page OK/Cancel box (same as Self-Check): the browser's own pop-up box adds "An embedded page at ... says" */
  .modal { position:fixed; inset:0; z-index:60; background:rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center; padding:16px; }
  .modal[hidden] { display:none; }
  .modal-card { background:#fff; border:2px solid #111; border-radius:8px; max-width:440px; width:100%; padding:20px; }
  .modal-card p { margin:0 0 18px; font-size:16px; font-weight:600; line-height:1.45; white-space:pre-line; }
  .modal-btns { display:flex; justify-content:flex-end; gap:10px; }
  /* every question, open to fix, after the video has been watched once */
  .fixlist .item { margin: 0 0 18px; }
  .fixlist .slot.flash .item { box-shadow: 0 0 0 4px var(--focus); transition: box-shadow .2s; }
  .slotnote { font-size:13px; color:#555; font-style:italic; padding: 10px 12px; border:1px dashed #999; margin: 0 0 18px; background:#fff; }
  .notjoined { background:#fff; color:#111; border:2px solid #111; border-radius:8px; padding:10px 14px; margin: -4px 0 12px; font-size:15px; }
</style>
</head>
<body>
<div class="wrap">
  <div id="loading">Loading the video…</div>
  <div id="app" hidden></div>
</div>
<div id="toast" class="toast" hidden></div>
<div class="modal" id="confirmBox" hidden role="dialog" aria-modal="true" aria-labelledby="confirmText">
  <div class="modal-card">
    <p id="confirmText"></p>
    <div class="modal-btns"><button class="secondary" id="confirmNo" type="button">Cancel</button><button id="confirmYes" type="button">Submit</button></div>
  </div>
</div>

<script>
/* ============================== BASICS ============================== */
var LETTERS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
var S = null;              // student state from the server
var T = null;              // teacher state (live lesson screen)
var cur = [];              // what's in each answer right now (MC: "0,2" = A and C)
var saved = [];            // last answer the server checked for each question
var draftSaved = [];       // last text the server has (checked OR autosaved)
var pending = {}, draftTimer = {}, saving = {}, saveWant = {};
var AUTOSAVE_MS = 8000;

/** Student calls that carry this browser's sign-in token, and how many arguments come before it.
    Missing arguments are filled with null so the token always lands in the same place. */
var TOKEN_ARGS = { getStudentState: 0, gradeAnswer: 3, checkAnswer: 3, saveDraft: 2, saveProgress: 2, turnIn: 0, livePoll: 0, signOut: 0, revealQuestion: 3, getVideoChunk: 1 };

/* ---------- The FRONT DOOR: this same page on the class website, as the link students get ----------
   (window.VIDEO_CHECK_FRONT_DOOR is set there, and ?app= is the web app's deployment ID.) Google won't open the web
   app itself in a browser where another Google account is signed in before the school one, whatever the setting.
   So the front door first loads it out of sight (probeGoogle). If Google says who the student is, they go on to the
   plain link, exactly as before. If not, this page runs the video right here, talking to the script's doPost with
   fetch (no Google sign-in rides along, so nothing can mix up), and the student signs in with Google or a code. */
var FRONT = !!window.VIDEO_CHECK_FRONT_DOOR;
var GOOGLE_BACK = FRONT ? takeGoogleReturn() : null;   // just back from Google's sign-in page
var FRONT_APP = FRONT ? (new URLSearchParams(location.search).get("app") || (GOOGLE_BACK && GOOGLE_BACK.app) || "") : "";
var FRONT_URL = /^AKfycb[\w-]{20,}$/.test(FRONT_APP) ? "https://script.google.com/macros/s/" + FRONT_APP + "/exec" : "";
function frontRun(fn, args, ok, fail) {
  fetch(FRONT_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },   // text/plain: no CORS preflight
                     body: JSON.stringify({ fn: fn, args: args, token: getToken() }) })   // the server puts the token in place
    .then(function (r) {
      if (!r.ok) throw new Error("NETWORK: The video's server didn't answer (" + r.status + "). Wait a minute and try again.");
      return r.text();
    })
    .then(function (text) {
      var out = null;
      try { out = JSON.parse(text); } catch (e) { out = null; }
      if (!out) {
        if (/doPost/.test(text)) throw new Error("This video isn't ready for this link yet. Please tell your teacher: the video's sheet needs the newest Video Check version.");
        throw new Error("NETWORK: The video's server sent something unexpected. Wait a minute and try again.");
      }
      return out;
    })
    .then(function (out) {
      if (out.ok) { if (ok) ok(out.result); }
      else fail(new Error(out.error || "Something went wrong. Reload the page."));
    }, function (err) {
      var m = String((err && err.message) || "");
      fail(/^NETWORK|isn't ready/.test(m) ? err : new Error("NETWORK: Couldn't reach the video's server. Check your internet connection."));
    });
}
/** Leaves this page: replace = the Back button skips the front door (so it can't send the student straight back). */
function goTo(url, replace) {
  if (window.__frontDoorGo) return window.__frontDoorGo(url, replace);   // local tests only
  if (replace) location.replace(url); else location.assign(url);
}

var api = {
  run: function (fn, args, ok, fail) {
    if (FRONT) return frontRun(fn, (args || []).slice(), ok, fail || showError);
    var r = google.script.run.withSuccessHandler(ok).withFailureHandler(fail || showError);
    var a = (args || []).slice();
    if (TOKEN_ARGS.hasOwnProperty(fn)) { while (a.length < TOKEN_ARGS[fn]) a.push(null); a.push(getToken()); }
    r[fn].apply(r, a);
  }
};
function call(fn, args) { return function (ok, fail) { api.run(fn, args || [], ok, fail); }; }

function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function btn(label, cls, onClick) { var b = el("button", cls || "", label); b.type = "button"; if (onClick) b.addEventListener("click", onClick); return b; }
function fmt(sec) {
  sec = Math.max(0, Math.floor(Number(sec) || 0));
  var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  return (h ? h + ":" + (m < 10 ? "0" : "") : "") + m + ":" + (s < 10 ? "0" : "") + s;
}
function stamp() { return new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }); }
function Q(i) { return (S || T).questions[i]; }
function answerOf(i) { return String(cur[i] == null ? "" : cur[i]).trim(); }
/** "Question number style" setting: "Q1" -> Q7, "1." -> 7. (Same as Self-Check.) */
function qLabel(n) {
  var p = String((S || T) && (S || T).numberStyle != null ? (S || T).numberStyle : "1").trim() || "1";
  var at = p.indexOf("1");
  return at === -1 ? (p + " " + n) : (p.slice(0, at) + n + p.slice(at + 1));
}
var toastTimer = null;
function toast(msg, ms) {
  var t = document.getElementById("toast");
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.hidden = true; }, ms || 3500);
}
function showError(err) {
  var msg = (err && err.message) ? err.message : String(err);
  msg = msg.replace(/^(NOT OPEN|NOT YET|BUSY|LIVE|NETWORK): /, "");
  var app = document.getElementById("app");
  document.getElementById("loading").textContent = msg;
  if (!app.hidden) { var b = el("div", "banner error", msg); app.insertBefore(b, app.firstChild); window.scrollTo(0, 0); }
}
/** In-page OK/Cancel box. This page never uses the browser's own pop-up boxes (they add "An embedded page at ... says"). */
function askConfirm(text, onYes, yesLabel) {
  var box = document.getElementById("confirmBox"), yes = document.getElementById("confirmYes"), no = document.getElementById("confirmNo");
  document.getElementById("confirmText").textContent = text;
  yes.textContent = yesLabel || "Submit";
  box.hidden = false; yes.focus();
  function close(go) {
    box.hidden = true; yes.onclick = no.onclick = box.onclick = null; document.removeEventListener("keydown", key);
    if (go) onYes();
  }
  function key(e) { if (e.key === "Escape") close(false); }
  yes.onclick = function () { close(true); };
  no.onclick = function () { close(false); };
  box.onclick = function (e) { if (e.target === box) close(false); };
  document.addEventListener("keydown", key);
}
function clearApp() {
  document.getElementById("loading").hidden = true;
  var app = document.getElementById("app");
  app.hidden = false; app.innerHTML = "";
  return app;
}
function header(app, title, sub) {
  document.title = title;
  app.appendChild(el("h1", null, title));
  if (sub) {
    var who = el("div", "who", sub);
    if (S && S.via === "code") {   // signed in with an emailed code: let a different student sign out on a shared computer
      who.appendChild(document.createTextNode(" Not you? "));
      who.appendChild(btn("Sign out", "linkbtn", signOutHere));
    }
    app.appendChild(who);
  }
}

/* ---------- Signing in with an emailed code (same as Self-Check) ----------
   Google tells the server who you are only when your school account is the FIRST Google account
   signed in to this browser. When it isn't (a family or personal account came first), the page
   asks for your school email and emails you a 6-digit code. The sign-in token is kept in this
   browser, so the code is only needed once per browser. */

/* ---------- Sign in with Google (front door only) ----------
   Google's own sign-in page, so the student can pick their school account even when another account is signed
   in first. It sends the browser back here with an ID token after the # (never to any server), and the
   script checks that token with Google before signing this browser in. The nonce ties the answer to this tab. */
var NONCE_KEY = "videocheck-google-nonce";
function startGoogleSignIn(client, say) {

  try { sessionStorage.setItem(NONCE_KEY, nonce); } catch (e) { nonce = ""; }
  if (!nonce) { say("This browser blocks the step Google sign-in needs. Get a code by email instead.", true); return; }
  // Google only returns to the exact address registered with the client ID: .../video/ (never .../video/index.html)
  var q = new URLSearchParams({ client_id: client, redirect_uri: location.origin + location.pathname.replace(/index\.html$/, ""), response_type: "id_token",
                                scope: "openid email", nonce: nonce, state: FRONT_APP, prompt: "select_account", hd: "*" });

}

    takes the answer out of the address bar and the history, or returns null. */
function takeGoogleReturn() {
  var h = location.hash.length > 1 ? new URLSearchParams(location.hash.slice(1)) : null;
  if (!h || !(h.get("id_token") || h.get("error"))) return null;
  var out = { app: String(h.get("state") || ""), idToken: h.get("id_token") || "", error: h.get("error") || "" };
  var app = new URLSearchParams(location.search).get("app") || out.app;
  try { history.replaceState(null, "", location.pathname + (/^AKfycb[\w-]{20,}$/.test(app) ? "?app=" + app : "")); } catch (e) {}
  return out;
}
function tokenClaims(t) {
  try {
    var p = String(t).split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
    while (p.length % 4) p += "=";
    return JSON.parse(decodeURIComponent(escape(atob(p))));
  } catch (e) { return null; }
}

  var want = null;
  try { want = sessionStorage.getItem(NONCE_KEY); sessionStorage.removeItem(NONCE_KEY); } catch (e) { want = null; }
  var claims = back.idToken ? tokenClaims(back.idToken) : null;
  if (back.error) {
    signInNote = back.error === "access_denied" ? "Google sign-in was canceled. Try again, or get a code by email."
               : "Google sign-in didn't work here (" + back.error + "). Get a code by email instead.";
  } else if (!claims || !want || claims.nonce !== want) {
    signInNote = "That Google sign-in didn't start on this page. Press Sign in with Google again.";
  }
  if (signInNote) return studentBoot();
  document.getElementById("loading").textContent = "Signing you in…";
  withRetry(call("signInWithGoogle", [back.idToken]), function (r) { setToken(r.token); studentBoot(); },
            function (err) { signInNote = signInText(err); studentBoot(); });
}

/* ---------- The front door's out-of-sight check ----------
   Loads the web app itself in a hidden frame. Its tiny probe page (doGet with ?probe=1) tells this page whether
   Google said who is signed in. Google's error page says nothing, so no answer in time means "sign in here". */
var IS_CROS = /\bCrOS\b/.test(navigator.userAgent);
// Chromebooks wait longer for the answer: at school it's almost always "yes", and a slow start on Google's side
// shouldn't send a whole class to the sign-in card.
var PROBE_MAX_MS = 15000, PROBE_AFTER_LOAD_MS = IS_CROS ? 8000 : 4000, PROBE_SKIP_MS = 5000;
function probeGoogle(done) {
  var over = false, f = document.createElement("iframe"), t1 = 0, t2 = 0, t3 = 0;
  function end(known) {
    if (over) return;
    over = true;
    clearTimeout(t1); clearTimeout(t2); clearTimeout(t3);
    window.removeEventListener("message", onMsg);
    f.remove();
    var sk = document.getElementById("probeSkip"); if (sk) sk.remove();
    done(known);
  }
  function onMsg(e) {
    if (!e.data || typeof e.data !== "object" || !("videoCheckProbe" in e.data)) return;
    if (!/^https:\/\/[\w-]+\.googleusercontent\.com$/.test(e.origin) && e.origin !== location.origin) return;
    end(e.data.videoCheckProbe === 1 ? 1 : 0);
  }

  f.setAttribute("aria-hidden", "true"); f.tabIndex = -1;
  f.style.cssText = "position:absolute;left:-9999px;top:0;width:10px;height:10px;border:0";
  f.addEventListener("load", function () { clearTimeout(t2); t2 = setTimeout(function () { end(null); }, PROBE_AFTER_LOAD_MS); });
  f.src = window.VIDEO_CHECK_PROBE_URL ? window.VIDEO_CHECK_PROBE_URL(FRONT_APP, location.origin)   // local tests only
        : FRONT_URL + "?probe=1&from=" + encodeURIComponent(location.origin);
  document.body.appendChild(f);
  t1 = setTimeout(function () { end(null); }, PROBE_MAX_MS);
  t3 = setTimeout(function () {   // taking a while (a slow start on Google's side): let the student skip ahead to signing in
    var ld = document.getElementById("loading"), b = btn("Sign in on this page instead", "secondary", function () { end(null); });
    var box = el("div", "probewait", "Still checking your school sign-in… ");
    box.id = "probeSkip"; box.appendChild(b); ld.appendChild(box);
  }, PROBE_SKIP_MS);
}

/** The front door's start: straight to the video if this device signed in here before, else the check above.
    Google knows the student (school Chromebooks): go on to the plain link. A Chromebook where the check came
    back empty-handed (the district may block the check's cookies) goes on too: it has only the school account. */
var WENT_KEY = "videocheck-went:" + FRONT_APP;
function frontDoorBoot() {
  document.title = "Video Check";
  if (!FRONT_URL) { showError(new Error("This link is missing part of its address. Open it again from Google Classroom.")); return; }
  if (GOOGLE_BACK) return finishGoogleSignIn(GOOGLE_BACK);
  if (getToken() || new URLSearchParams(location.search).get("signin") === "1") return studentBoot();   // ?signin=1: skip the check
  document.getElementById("loading").textContent = "Opening the video…";
  probeGoogle(function (known) {
    if (known === 1) return goTo(FRONT_URL, true);
    if (known === 0 && IS_CROS) {
      // A Chromebook the check couldn't see into. Almost always a school one (only the school account), so go on.
      // But if this device was just sent on the same way and is back, the video may not have opened: let the student choose.
      var last = 0;
      try { last = Number(localStorage.getItem(WENT_KEY)) || 0; } catch (e) {}
      if (Date.now() - last > 600000) {
        try { localStorage.setItem(WENT_KEY, String(Date.now())); } catch (e) {}
        return goTo(FRONT_URL, true);
      }
      try { localStorage.removeItem(WENT_KEY); } catch (e) {}
      var app = clearApp();
      header(app, "Video Check");
      var box = el("div", "signin");
      box.appendChild(el("h2", null, "Open the video"));
      box.appendChild(el("p", null, "If the video didn't open a minute ago (Google said \"Sorry, unable to open the file\"), sign in here instead."));
      var row = el("div", "si-buttons");
      row.appendChild(btn("Open the video", "", function () {
        try { localStorage.setItem(WENT_KEY, String(Date.now())); } catch (e) {}
        goTo(FRONT_URL, true);
      }));
      row.appendChild(btn("Sign in here instead", "secondary", function () { studentBoot(); }));
      box.appendChild(row);
      app.appendChild(box);
      return;
    }
    studentBoot();
  });
}

/* Busy server or a blip: try again quietly a few times before telling the student. */
var RETRY_DELAYS = [1500, 3500, 7000, 12000];
function isRetryable(err) {
  var m = String((err && err.message) || err || "");

    } else fail(err);

      setTimeout(function () { RETRY_FAST(c, ok, fail, onRetry, attempt + 1); }, delays[attempt] + Math.floor(Math.random() * 500));
    } else fail(err);
  });
}

/* ============================== VIDEO PLAYER ============================== */
/* One small interface for YouTube and for a plain video file:
   play() pause() seek(t) time() duration() state() -> "playing" | "paused" | "ended" | "buffering" | "cued" | "unstarted" */
var ytWaiters = null;
function loadYT(cb) {
  if (window.YT && window.YT.Player) { cb(); return; }
  if (!ytWaiters) {
    ytWaiters = [];
    var prev = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = function () {
      if (prev) prev();

    s.src = "https://www.youtube.com/iframe_api"; s.async = true;
    s.onerror = function () { showError("Couldn't load YouTube. Check the internet connection. (YouTube may be blocked on this network.)"); };
    document.head.appendChild(s);
  }

}
function ytError(code) {
  if (code === 101 || code === 150) return "The owner of this YouTube video doesn't allow it to play on other sites. (Teacher: pick a different video, or upload your own to YouTube as Unlisted.)";
  if (code === 100) return "This YouTube video was removed or made private.";
  if (code === 2) return "The YouTube link isn't valid. (Teacher: check the Video link in the Settings tab.)";
  if (code === 153) return "YouTube blocked the player (error 153). Reload the page; if it keeps happening, tell your teacher.";
  return "The video can't play right now (YouTube error " + code + "). Reload the page to try again.";
}
function makePlayer(host, v, opt) {

  P.state = function () { return P.st; };
  function setState(s) { P.st = s; if (opt.onState) opt.onState(s); }
  if (v.kind === "youtube") {
    var names = { "-1": "unstarted", "0": "ended", "1": "playing", "2": "paused", "3": "buffering", "5": "cued" };
    loadYT(function () {
      var f = document.createElement("iframe");
      var params = { enablejsapi: 1, rel: 0, playsinline: 1, modestbranding: 1, iv_load_policy: 3, fs: 0, controls: 1, origin: location.origin };
      if (opt.start > 0) params.start = Math.floor(opt.start);
      if (v.end > 0) params.end = Math.ceil(v.end);
      f.src = "https://www.youtube.com/embed/" + encodeURIComponent(v.id) + "?" +
        Object.keys(params).map(function (k) { return k + "=" + encodeURIComponent(params[k]); }).join("&");
      f.setAttribute("allow", "autoplay; encrypted-media; picture-in-picture");
      f.setAttribute("referrerpolicy", "strict-origin-when-cross-origin");   // YouTube refuses to play without a referrer

        onReady: function () { P.ready = true; if (opt.onReady) opt.onReady(); },
        onStateChange: function (e) { setState(names[String(e.data)] || "unstarted"); },
        onError: function (e) { if (opt.onError) opt.onError(ytError(e.data)); }
      } });
      P.play = function () { try { yp.playVideo(); } catch (e) {} };
      P.pause = function () { try { yp.pauseVideo(); } catch (e) {} };
      P.seek = function (t) { try { yp.seekTo(Math.max(0, t), true); } catch (e) {} };
      P.time = function () { try { return yp.getCurrentTime() || 0; } catch (e) { return 0; } };
      P.duration = function () { try { return yp.getDuration() || 0; } catch (e) { return 0; } };
      P.rate = function () { try { return yp.getPlaybackRate() || 1; } catch (e) { return 1; } };
      P.destroy = function () { try { yp.destroy(); } catch (e) {} };
    });

  }
  function playFile(src, isBlob, onFail) {
    var vd = document.createElement("video");

    // or Edge on an iPad) only starts when this is set BEFORE the video gets its source.

function paintCard(i) {

/** How far the student has watched, sent with each answer (self-paced only). */

/**
 * Check = two steps (same as Self-Check).
 *  1. FAST: the server grades only (no waiting in line) and the page shows the color + hint.
 *  2. BACKGROUND: save, retrying quietly if the server is busy.

function check(i, force) {
  var val = answerOf(i);
  if (S.locked || pending[i] || Q(i).type === "note") return;
  if (!val) { if (force) setMeta(i, Q(i).type === "mc" ? "Pick an answer first." : "Type your answer first.", "#cc0000"); return; }
  if (!force && val === saved[i]) return;
  pending[i] = true;
  clearTimeout(draftTimer[i]);
  setMeta(i, "Checking…", "#666"); setBtnBusy(i, true);
  var prior = (S.tries && S.tries[i]) || 0;
  RETRY_FAST(call("gradeAnswer", [i, val, prior]), function (resp) {
    pending[i] = false; setBtnBusy(i, false);
    var wasNew = val !== saved[i];
    saved[i] = val;
    if (Q(i).type === "mc" && wasNew && resp.result.status === "incorrect") S.tries[i] = prior + 1;
    setResult(i, resp.result);
    if (answerOf(i) !== val) setMeta(i, "Not checked yet", "#b45f06");
    else setMeta(i, "Checked. Saving…", "#666");
    queueSave(i, val);
  }, function (err) {
    pending[i] = false; setBtnBusy(i, false);
    setMeta(i, "Couldn't check yet, but your answer is still here. Wait a minute, then press Check again.", "#cc0000");
    if (isSignInError(err)) signedOutMidway();
    else if (err && err.message && /sign in|locked|NOT OPEN/i.test(err.message)) showError(err);
  }, function () { setMeta(i, "Checking… (lots of students are checking, so hang on)", "#666"); });
}

/** Saves the newest checked answer for a question, one save at a time, in order. */
function queueSave(i, val) {
  saveWant[i] = val;
  if (saving[i]) return;
  saving[i] = true;
  var v = saveWant[i];
  withRetry(call("checkAnswer", [i, v, watchedPos()]), function (resp) {
    saving[i] = false;
    draftSaved[i] = v;
    if (resp && typeof resp.tries === "number") S.tries[i] = resp.tries;
    if (resp && resp.result && v === saved[i]) setResult(i, resp.result);   // the server's copy (same grader, real try count)
    if (resp && typeof resp.grade === "number" && !savesRunning()) S.grade = resp.grade;
    updateProgress();
    if (saveWant[i] !== v) { queueSave(i, saveWant[i]); return; }
    if (answerOf(i) === v) setMeta(i, "Saved " + stamp(), "#666");
  }, function (err) {
    saving[i] = false;
    setMeta(i, "Checked, but not saved yet. Press Check again in a minute so your teacher gets it.", "#cc0000");
    if (isSignInError(err)) signedOutMidway();
    else if (err && err.message && /sign in|locked|NOT OPEN/i.test(err.message)) showError(err);
  }, 0, function () {
    if (answerOf(i) === v) setMeta(i, "Checked. Saving… (lots of students are saving, so hang on)", "#666");

function savesRunning() { return Object.keys(saving).some(function (k) { return saving[k]; }); }

  var val = answerOf(i);
  if (S.locked || pending[i] || saving[i] || val === draftSaved[i] || val === saved[i]) return;
  api.run("saveDraft", [i, val], function (resp) {
    if (resp && resp.saved) {

    }

  });
}

/* ============================== STUDENT: START ============================== */
function studentBoot() {

    S = state;

    if (S.mode === "wait") return renderWait();
    cur = []; saved = []; draftSaved = [];
    S.questions.forEach(function (q, i) {
      cur[i] = S.answers[i] || "";
      saved[i] = (S.checkedAnswers ? S.checkedAnswers[i] : S.answers[i]) || "";
      draftSaved[i] = S.answers[i] || "";

  }, function (err) {
    // The front door can't reach the sheet at all: most often the deployment isn't set to "Anyone" yet.
    if (FRONT && /^NETWORK/.test(String(err && err.message))) err = new Error(err.message + " If it still won't open, please tell your teacher.");
    showError(err);

}
var timers = [];

/* ---------- waiting for the live lesson ---------- */

}

/* ---------- live lesson (student) ---------- */
function renderStudentLive() {
  var app = clearApp();
  header(app, S.title, "Signed in as " + S.name + ". Your work saves automatically.");
  app.appendChild(progressBar());
  var host = el("div"); host.id = "livehost";
  app.appendChild(host);
  var chips = el("div", "qchips"); chips.id = "livechips";
  app.appendChild(chips);
  window.onResultHook = function () { drawLiveChips(); };
  showLiveQ();
  updateProgress();
  (function poll(ms) {
    timers.push(setTimeout(function () {
      var sent = Date.now();
      api.run("livePoll", [], function (r) {
        noteLiveClock(r, sent);
        if (!r || !r.on) {
          // The teacher ended the live lesson: open the video on this device right away.
          var q = S.live.q;
          if (q >= 0 && Q(q).type === "open" && answerOf(q) && answerOf(q) !== saved[q]) check(q, false);
          cameFromLive = true;
          setTimeout(studentBoot, savesRunning() ? 2500 : 600);
          return;
        }
        var changed = r.q !== S.live.q;
        S.live.opened = r.opened || [];
        if (r.question && r.q >= 0) S.questions[r.q] = r.question;   // the question the teacher just opened (never sooner)
        if (changed) {
          var old = S.live.q;
          if (old >= 0 && Q(old).type === "open" && answerOf(old) && answerOf(old) !== saved[old]) check(old, false);   // teacher moved on: keep what was typed
          S.live.q = r.q;
          showLiveQ();
        } else drawLiveChips();
        poll(livePollDelay(r));
      }, function (err) { if (isSignInError(err)) signedOutMidway(); poll(); });   // keeps polling: it works again once they sign back in
    }, ms != null ? ms : 2200 + Math.floor(Math.random() * 1200)));

}
/* The server's clock minus this device's, from the quickest check so far (the quickest gives the truest reading). */
var liveClock = { off: 0, rtt: 0 };
function noteLiveClock(r, sent) {
  if (!r || !r.now) return;
  var rtt = Date.now() - sent;
  if (liveClock.rtt && rtt > liveClock.rtt * 1.25) return;
  liveClock.off = r.now - (sent + rtt / 2);
  liveClock.rtt = liveClock.rtt ? Math.min(liveClock.rtt, rtt) : rtt;
}
/* Usually every few seconds. When the live screen has said when the video will stop (r.next), the next check is
   timed to reach the server just after that moment, spread over about half a second so the class doesn't all arrive
   at once (Google limits how many checks can run at the same time). */
function livePollDelay(r) {
  var normal = 2200 + Math.floor(Math.random() * 1200);
  if (!r || !r.next || r.q >= 0) return normal;
  var send = r.next - liveClock.off - liveClock.rtt / 2 + 60 + Math.floor(Math.random() * 600);
  return Math.max(150, Math.min(normal, send - Date.now()));
}
var liveShown = -1;
function showLiveQ(forced) {

    box.appendChild(h);

    host.appendChild(box);

    host.appendChild(el("div", "livebox", "Loading the question…"));
    api.run("revealQuestion", [q, 0, 0], function (data) { if (data) { S.questions[q] = data; if (liveShown === q) showLiveQ(forced); } }, function () {});
  } else {
    var tag = el("div", "strip", forced != null ? "Fixing an earlier question" : "Answer on your device, then press Check");
    host.appendChild(tag);

    note.style.textAlign = "center";

  if (!opened.length) return;

  opened.sort(function (a, b) { return a - b; }).forEach(function (i) {
    var s = (S.results[i] && S.results[i].status) || "blank";
    var c = btn(qLabel(Q(i).num), "qchip" + (s !== "blank" ? " " + s + "-bg" : ""), function () {

/* ============================== STUDENT: WATCH ON YOUR OWN ============================== */
var maxW = 0, lastT = null, armed = {}, openQ = -1, openFrom = "", endDone = false, noteSeen = {};
var progSaved = 0, progAt = 0, progBusy = false, endQueue = [], skipToastAt = 0, reachedEnd = false;
var cameFromLive = false;   // this page just switched over from a live lesson that ended
var cardEl = {};            // question index -> its one card, moved between the list under the video and the video
var fixList = false;        // the list under the video has at least one question in it

/** Puts question i's card into host (moving it if it's somewhere else). One card per question, so ids stay unique. */
function attachCard(i, host) {

/**
 * The list under the video. A question shows up here once it has come up in the video, and then it

function syncList(now) {

    if (document.getElementById("slot" + i)) return;

}

  var now = Date.now();
  if (want === -1) {
    if (TL.next.q !== -1) { TL.next = { q: -1, at: 0, sent: now }; sendNext(-1, 0); }
    return;
  }
  if (want === TL.next.q && Math.abs(now + ms - TL.next.at) < 400) return;   // the server already has the right moment
  if (now - TL.next.sent < 800) return;   // at most about one update a second
  TL.next = { q: want, at: now + ms, sent: now };
  sendNext(want, ms);
}
function sendNext(q, ms) {
  var sent = Date.now();
  // The server counts from when the call reaches it, so take off the trip there (half the quickest round trip so far).
  api.run("liveNext", [q, Math.max(0, Math.round(ms - TL.oneWay))], function (live) {
    TL.oneWay = Math.max(60, Math.min(TL.oneWay, (Date.now() - sent) / 2));
    // Cancelled just too late: the question had already opened on students' devices, so open it here too.
    if (q === -1 && live && live.q >= 0 && TL.open === -1 && T.questions[live.q]) {
      var i = live.q, at = qt(i);
      if (at != null) { P.seek(at); lastT = at; }
      P.pause(); armed[i] = false;
      openTeacherQ(i, true);
    }
  }, function () {
    if (q >= 0) { if (TL.next.q === q) TL.next.q = -1; return; }   // tried again on a later tick
    setTimeout(function () { if (TL.next.q === -1 && TL.open === -1) sendNext(-1, 0); }, 500);   // a cancel must get through
  });
}
function drawTeacherMarkers() {
  var tl = document.getElementById("tl"), E = endT();
  if (!tl || !E) return;
  Array.prototype.slice.call(tl.querySelectorAll(".mk")).forEach(function (m) { tl.removeChild(m); });
  var span = Math.max(1, E - VS);
  T.questions.forEach(function (q, i) {
    var at = qt(i), x = at == null ? 100 : Math.max(0, Math.min(100, 100 * (at - VS) / span));
    var m = btn(q.type === "note" ? "i" : String(q.num), "mk" + (q.type === "note" ? " note" : "") + ((T.live && T.live.opened || []).indexOf(i) !== -1 ? " correct-bg" : ""), function () {
      if (at != null) { P.seek(at); lastT = at; }
      P.pause(); armed[i] = false;
      openTeacherQ(i, true);
    });
    m.style.left = x + "%";
    m.title = (q.type === "note" ? "Note" : "Question " + q.num) + (at == null ? " (after the video)" : " at " + fmt(at));
    tl.appendChild(m);
  });
}
function teacherEndStep() {
  if (TL.endQueue.length) { openTeacherQ(TL.endQueue.shift(), true); return; }
  var wrap = el("div", "sum");
  wrap.appendChild(el("h2", null, "End of the video"));
  wrap.appendChild(el("p", null, TL.preview ? "That's every question." :
    "When you end the live lesson, Period " + T.live.period + " can watch on their own, rewatch any part, and fix answers until the due date."));
  var b = el("div", "obtns");
  b.appendChild(btn("Back to the video", "secondary", function () { TL.open = -1; closeOverlayEl(document.getElementById("stage")); }));
  b.appendChild(el("span", "spacer"));
  b.appendChild(btn(TL.preview ? "Exit preview" : "End live lesson", "blue", TL.preview ? function () { renderTeacherHome(); } : endLive));
  var box = el("div"); box.appendChild(wrap); box.appendChild(b);
  TL.open = -2;
  stageOverlay(document.getElementById("stage"), box);
}

function openTeacherQ(i, tellStudents) {
  TL.open = i; TL.results = false; TL.showMissing = false; TL.showAnswers = false; TL.status = null;
  var q = T.questions[i];
  var wrap = el("div");
  var card = el("div", "item");
  var qtx = el("div", "qtext");
  qtx.appendChild(el("span", "qnum" + (q.type === "note" ? " note" : ""), q.type === "note" ? "Note" : qLabel(q.num)));
  qtx.appendChild(document.createTextNode(q.text));
  if (q.type === "mc" && q.multi) qtx.appendChild(el("div", "multi", chooseText(q)));
  if (q.img) qtx.appendChild(figure(q, i));
  card.appendChild(qtx);
  if (q.type === "mc") {
    var ch = el("div", "choices"); ch.id = "tch";
    q.choices.forEach(function (c, k) {
      var b = el("div", "choice"); b.setAttribute("data-k", String(k));
      b.appendChild(el("span", "tbarfill"));
      b.appendChild(el("span", "let", LETTERS.charAt(k)));
      b.appendChild(el("span", "ctext", c));
      b.appendChild(el("span", "tcount", ""));
      ch.appendChild(b);
    });
    card.appendChild(ch);
  }
  wrap.appendChild(card);
  if (q.type !== "note" && !TL.preview) {
    var stats = el("div", "tstats"); stats.id = "tstats";
    stats.innerHTML = '<span><span class="big" id="tAns">0</span> / <span id="tTot">…</span> answered</span><span class="tcolors" id="tCol"></span>';
    wrap.appendChild(stats);
    var miss = el("div", "missing"); miss.id = "tMiss"; miss.hidden = true; wrap.appendChild(miss);
    var ans = el("div", "answers"); ans.id = "tAnswers"; ans.hidden = true; wrap.appendChild(ans);
  }
  var bar = el("div", "obtns");
  if (q.type !== "note") {
    bar.appendChild(btn(q.type === "mc" ? "Show results" : "Show colors", "secondary", function (e) {
      TL.results = !TL.results; e.target.textContent = TL.results ? "Hide results" : (q.type === "mc" ? "Show results" : "Show colors"); paintTeacherQ();
    }));
    if (!TL.preview) {
      bar.appendChild(btn("Who hasn't answered", "secondary", function (e) {
        TL.showMissing = !TL.showMissing; e.target.textContent = TL.showMissing ? "Hide names" : "Who hasn't answered"; paintTeacherQ();
      }));
      if (q.type === "open") bar.appendChild(btn("Show answers (no names)", "secondary", function (e) {
        TL.showAnswers = !TL.showAnswers; e.target.textContent = TL.showAnswers ? "Hide answers" : "Show answers (no names)";
        pollTeacherNow(); paintTeacherQ();
      }));
    }
  }
  bar.appendChild(el("span", "spacer"));
  bar.appendChild(btn("Continue ▶", "blue", teacherContinue));
  wrap.appendChild(bar);
  stageOverlay(document.getElementById("stage"), wrap);
  paintTeacherQ();
  if (tellStudents && !TL.preview) {
    withRetry(call("liveOpen", [i, Math.round(TL.reach)]), function (live) { T.live = live; drawTeacherMarkers(); pollTeacherNow(); }, showError);
  }
}
function paintTeacherQ() {
  var i = TL.open;
  if (i < 0) return;
  var q = T.questions[i], s = TL.status;
  var ch = document.getElementById("tch");
  if (ch) {
    var total = s && s.answered ? s.answered : 0;
    Array.prototype.forEach.call(ch.children, function (b) {
      var k = Number(b.getAttribute("data-k")), n = s && s.dist ? s.dist[k] || 0 : 0;
      var right = q.correct.indexOf(k) !== -1;
      b.className = "choice" + (TL.results && right ? " right" : "");
      b.querySelector(".tbarfill").style.width = TL.results && total ? (100 * n / total) + "%" : "0";
      b.querySelector(".tcount").textContent = TL.results && !TL.preview ? n + (n === 1 ? " student" : " students") : "";
    });
  }
  if (!s || TL.preview) return;
  var a = document.getElementById("tAns"), tt = document.getElementById("tTot"), col = document.getElementById("tCol");
  if (a) a.textContent = s.answered;
  if (tt) tt.textContent = s.total;
  if (col) {
    col.innerHTML = "";
    if (TL.results) [["correct", "green"], ["partial", "yellow"], ["incorrect", "red"]].forEach(function (p) {
      var c = el("span", "chip"); var d = el("i", "dot"); d.style.background = "var(--" + (p[0] === "correct" ? "green" : p[0] === "partial" ? "yellow" : "red") + ")";
      c.appendChild(d); c.appendChild(document.createTextNode(s.colors[p[0]] + " " + p[1])); col.appendChild(c);
    });
  }
  var m = document.getElementById("tMiss");
  if (m) { m.hidden = !TL.showMissing; m.textContent = s.missing.length ? "Not answered yet: " + s.missing.join(", ") : "Everyone has answered."; }
  var an = document.getElementById("tAnswers");
  if (an) {
    an.hidden = !TL.showAnswers;
    an.innerHTML = "";
    if (TL.showAnswers) (s.answers || []).forEach(function (x) { an.appendChild(el("div", TL.results ? x.s : "", x.a)); });
  }
}
function teacherContinue() {
  var from = TL.open;
  if (from === -1) return;
  TL.open = -1;
  closeOverlayEl(document.getElementById("stage"));
  if (!TL.preview) {
    var reach = Math.round(TL.reach);
    api.run("liveClose", [reach], function (live) { if (live) T.live = live; }, function () { api.run("liveClose", [reach], function () {}, function () {}); });
  }
  if (endDone) { teacherEndStep(); return; }
  lastT = P.time();
  P.play();
}
function endLive() {
  var p = T.live.period;
  askConfirm("End the live lesson for Period " + p + "?\n\nThe video opens on every Period " + p + " device right away. Students who joined get credit for everything the class watched together, and can fix answers until the due date.", function () {
    withRetry(call("liveEnd", [true, Math.round(TL.reach), Math.round(endT())]), function (periods) {
      T.live = null; T.periods = periods;
      renderTeacherHome("Live lesson ended. The video is now open for Period " + p + " to rewatch and fix answers.");
    }, showError);
  }, "End live lesson");
}
function paintNotJoined() {
  var box = document.getElementById("tNotJoined"), s = TL.lastStatus;
  if (!box) return;
  box.hidden = !TL.showNotJoined;
  if (!TL.showNotJoined) return;
  box.textContent = !s ? "Checking who's here…" :
    s.notJoined && s.notJoined.length ? "Not joined yet (" + s.notJoined.length + "): " + s.notJoined.join(", ") : "Everyone in Period " + T.live.period + " has joined.";
}
var tPollTimer = null;
function pollTeacher() {
  clearTimeout(tPollTimer);
  tPollTimer = setTimeout(function () {
    if (!T.live || TL.preview) return;
    api.run("liveStatus", [TL.showAnswers], function (s) { gotStatus(s); pollTeacher(); }, function () { pollTeacher(); });
  }, TL.open >= 0 ? 2000 : 5000);
  timers.push(tPollTimer);
}
function pollTeacherNow() {
  if (!T.live || TL.preview) return;
  api.run("liveStatus", [TL.showAnswers], gotStatus, function () {});
}
function gotStatus(s) {
  if (!s || !s.on) return;
  var j = document.getElementById("tJoined");
  if (j) j.textContent = "Joined: " + s.joined + " / " + s.total;
  TL.lastStatus = s;
  paintNotJoined();
  if (TL.open >= 0 && s.live && s.live.q === TL.open) { TL.status = s; paintTeacherQ(); }
}
document.addEventListener("keydown", function (e) {
  if (!T || !P || /TEXTAREA|INPUT/.test((e.target && e.target.tagName) || "")) return;
  if (!document.getElementById("confirmBox").hidden) return;   // the End live lesson box is open
  var k = e.key;
  if (TL.open !== -1 && TL.open !== -2 && (k === "Enter" || k === "PageDown" || k === "ArrowRight")) { e.preventDefault(); teacherContinue(); }
  else if (TL.open === -1 && (k === "PageDown" || k === " ")) { e.preventDefault(); if (P.state() === "playing") P.pause(); else { lastT = P.time(); P.play(); } }
});

/* ============================== START ============================== */
(function boot() {
  if (FRONT) return frontDoorBoot();   // the live lesson screen never opens from the class website
  function start(params) { if (params && params.mode === "live") teacherBoot(); else studentBoot(); }
  try {
    if (window.google && google.script && google.script.url) google.script.url.getLocation(function (loc) { start((loc && loc.parameter) || {}); });
    else start({});
  } catch (e) { start({}); }
})();
</script>
