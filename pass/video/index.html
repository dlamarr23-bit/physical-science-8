<!DOCTYPE html>
<html>
<head>
<script>window.CLASS_PASS_PAGE = "app";   /* on the class website, under Class Pass: see CLASS PASS in the page script */</script>
<title>Video Check</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="strict-origin-when-cross-origin">
<base target="_blank">
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root { --green:#d9ead3; --yellow:#fff2cc; --red:#f4cccc; --strip:#c9daf8; --q:#d9d9d9; --blue:#1b4587;
          --gd:#38761d; --yd:#bf9000; --rd:#cc0000; --focus:#3c78d8; }
  * { box-sizing: border-box; }
  body { margin:0; background:#f3f3f3; font-family:Poppins, Arial, sans-serif; color:#111; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 16px 16px 120px; }
  body.teacher .wrap { max-width: 1500px; }
  h1 { font-size: 24px; font-weight: 700; margin: 8px 0 4px; }
  .who { font-size: 13px; color:#555; margin-bottom: 8px; }
  .intro { font-style: italic; color:#555; font-size: 14px; margin: 6px 0 12px; }
  .strip { background: var(--strip); font-weight:700; font-size: 17px; padding: 10px 12px; margin: 18px 0 12px;
           border-top: 2px solid #111; border-bottom: 2px solid #111; }
  .banner { background:#111; color:#fff; padding:10px 12px; border-radius:6px; font-size:14px; margin: 10px 0; }
  .banner.error { background:#cc0000; }
  .banner.blue { background: var(--blue); }
  #loading { padding: 60px 0; text-align:center; font-weight:600; }
  button { font-family:Poppins, Arial, sans-serif; font-weight:700; font-size:14px; border:2px solid #111; border-radius:6px;
           background:#111; color:#fff; padding: 7px 16px; cursor:pointer; }
  button.secondary { background:#fff; color:#111; }
  button.blue { background: var(--blue); border-color: var(--blue); }
  button:disabled { opacity:.5; cursor: default; }
  button:focus-visible, .choice:focus-visible, .mk:focus-visible, .qchip:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  /* ---------- video ---------- */
  .stage { position:relative; width:100%; aspect-ratio: 16 / 9; background:#000; border:2px solid #111; border-radius:8px; overflow:hidden; }
  .stage iframe, .stage video { position:absolute; inset:0; width:100%; height:100%; border:0; background:#000; }
  .stage .vmsg { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; color:#fff; padding:20px; font-weight:600; }
  .overlay { position:absolute; inset:0; z-index:3; background: rgba(0,0,0,.6); overflow:auto; display:flex; justify-content:center; padding: 14px; }
  .ocard { width:100%; max-width: 760px; margin: auto 0; background:#fff; border:2px solid #111; border-radius:8px; overflow:hidden; }
  .obtns { display:flex; flex-wrap:wrap; gap:8px; justify-content:flex-end; padding: 10px 12px; border-top:1px solid #bbb; background:#fafafa; }
  .obtns .spacer { flex:1; }
  @media (max-width: 640px) { .stage.qopen { aspect-ratio: auto; min-height: 560px; } }
  .skipnote { font-size:12px; color:#555; margin-top:6px; }

  /* timeline of questions under the video */
  .tl { position:relative; height: 28px; margin: 12px 9px 2px; }
  .tl .track { position:absolute; left:0; right:0; top:11px; height:6px; background:#c8c8c8; border-radius:3px; }
  .tl .seen { position:absolute; left:0; top:11px; height:6px; background:#8fa9d6; border-radius:3px; width:0; }
  .tl .now { position:absolute; top:6px; width:3px; height:16px; margin-left:-1px; background:#111; border-radius:2px; left:0; }
  .mk { position:absolute; top:4px; width:20px; height:20px; margin-left:-10px; padding:0; border-radius:50%; border:2px solid #111;
        background:#fff; color:#111; font-size:10px; line-height:1; display:grid; place-items:center; }
  .mk.note { border-radius:4px; width:15px; height:15px; margin-left:-7px; top:6px; font-size:9px; }
  .times { display:flex; justify-content:space-between; font-size:12px; color:#555; margin: 0 2px; }

  .qchips { display:flex; flex-wrap:wrap; gap:6px; margin: 12px 0 4px; }
  .qchip { border:2px solid #111; border-radius:6px; background:#fff; color:#111; padding:4px 10px; font-size:13px; }
  .qchip small { font-weight:400; }
  .correct-bg { background: var(--green) !important; } .partial-bg { background: var(--yellow) !important; } .incorrect-bg { background: var(--red) !important; }
  .locked { opacity:.45; }

  /* progress (same as Self-Check) */
  .progress { position: sticky; top: 0; z-index: 5; background:#fff; border:2px solid #111; border-radius:8px;
              padding: 10px 12px; margin: 14px 0; display:flex; flex-wrap:wrap; gap: 10px 16px; align-items:center; font-size:14px; font-weight:600; }
  .bar { flex: 1 1 220px; height: 14px; display:flex; border:1px solid #111; border-radius: 7px; overflow:hidden; background:#fff; }
  .bar span { height:100%; transition: width .3s; }
  .chip { display:inline-flex; align-items:center; gap:5px; }
  .dot { width:12px; height:12px; border:1px solid #111; border-radius:3px; display:inline-block; }
  .grade { margin-left:auto; font-size:16px; }

  /* question card (same look as Self-Check) */
  .item { border: 1px solid #bbb; background:#fff; }
  .qtext { background: var(--q); font-weight:700; font-size: 15px; padding: 10px 12px; line-height:1.45; }
  .qnum { display:inline-block; background:#111; color:#fff; border-radius:4px; padding:0 7px; margin-right:6px; font-size:13px; }
  .qnum.note { background: var(--blue); }
  .qat { font-weight:400; font-size:12px; color:#333; margin-left:6px; }
  .multi { font-weight:400; font-style:italic; font-size:13px; margin-top:4px; }
  .qimg { margin: 10px 0 2px; }
  .qimg img { display:block; max-width:100%; max-height:320px; border:2px solid #111; border-radius:4px; background:#fff; }
  .qimg figcaption { font-weight:400; font-style:italic; font-size:13px; color:#333; margin-top:4px; }
  textarea { display:block; width:100%; min-height: 96px; border:0; border-top:3px solid #111; border-bottom:3px solid #111;
             font-family:Poppins, Arial, sans-serif; font-size:15px; padding:10px 12px; resize: vertical; outline:none; background:#fff;
             transition: background .25s; }
  textarea:focus { box-shadow: inset 0 0 0 2px var(--focus); }
  textarea.correct { background: var(--green); } textarea.partial { background: var(--yellow); } textarea.incorrect { background: var(--red); }
  .choices { display:grid; gap:8px; padding: 12px; border-top:3px solid #111; }
  .choice { position:relative; display:flex; gap:10px; align-items:center; width:100%; text-align:left; background:#fff; color:#111;
            border:2px solid #111; border-radius:6px; padding: 9px 12px; font-weight:600; font-size:15px; overflow:hidden; }
  .choice .let { flex:none; width:28px; height:28px; border-radius:50%; border:2px solid #111; display:grid; place-items:center; font-weight:700; font-size:14px; background:#fff; position:relative; }
  .choice .ctext { position:relative; flex:1; }
  .choice.sel { border-color: var(--focus); box-shadow: inset 0 0 0 1px var(--focus); }
  .choice.sel .let { background: var(--focus); border-color: var(--focus); color:#fff; }
  .choice.sel.correct { background: var(--green); border-color: var(--gd); box-shadow:none; } .choice.sel.correct .let { background: var(--gd); border-color: var(--gd); }
  .choice.sel.partial { background: var(--yellow); border-color: var(--yd); box-shadow:none; } .choice.sel.partial .let { background: var(--yd); border-color: var(--yd); }
  .choice.sel.incorrect { background: var(--red); border-color: var(--rd); box-shadow:none; } .choice.sel.incorrect .let { background: var(--rd); border-color: var(--rd); }
  .fb { background:#000; color:#fff; font-style: italic; font-size: 14px; padding: 9px 12px; min-height: 38px; line-height:1.45; }
  .row { display:flex; align-items:center; justify-content: space-between; gap: 8px; padding: 8px 12px; background:#fff; }
  .meta { font-size: 12px; color:#666; }
  .finish { text-align:center; margin: 26px 0; }
  .finish button { font-size: 16px; padding: 12px 26px; }
  .card-note { padding: 12px; font-size:14px; }

  /* summary at the end of the video */
  .sum { padding: 16px; }
  .sum h2 { margin: 0 0 6px; font-size: 20px; }
  .sum p { margin: 6px 0; font-size: 14px; }

  /* live lesson: students */
  .livebox { background:#fff; border:2px solid #111; border-radius:8px; padding: 22px 18px; text-align:center; margin: 12px 0; }
  .livebox h2 { margin: 0 0 6px; font-size: 22px; }
  .pulse { display:inline-block; width:12px; height:12px; border-radius:50%; background:#cc0000; margin-right:8px; vertical-align:middle; animation: pulse 1.4s infinite; }
  @keyframes pulse { 0% { opacity:1 } 50% { opacity:.25 } 100% { opacity:1 } }
  @media (prefers-reduced-motion: reduce) { .pulse { animation:none; } }
  .waitnote { font-size: 13px; color:#555; margin-top: 12px; }

  /* live lesson: teacher screen */
  .tbar { display:flex; flex-wrap:wrap; gap:10px 14px; align-items:center; background:#111; color:#fff; border-radius:8px; padding:10px 14px; margin: 8px 0 12px; font-weight:600; }
  .tbar .live { color:#fff; font-weight:700; }
  .tbar .grow { flex:1; }
  .tbar button { background:#fff; color:#111; border-color:#fff; }
  .tbar button.danger { background:#cc0000; border-color:#cc0000; color:#fff; }
  table.periods { width:100%; border-collapse: collapse; background:#fff; border:2px solid #111; }
  table.periods th, table.periods td { padding: 10px 12px; border-bottom:1px solid #ccc; text-align:left; font-size:14px; vertical-align: middle; }
  table.periods th { background: var(--strip); }
  table.periods td.btns { text-align:right; white-space:nowrap; }
  table.periods td.btns button { margin-left:6px; }
  .tag { display:inline-block; font-size:12px; font-weight:700; padding: 2px 8px; border-radius: 10px; border:1px solid #111; }
  .tag.open { background: var(--green); } .tag.wait { background: var(--yellow); } .tag.live { background:#cc0000; color:#fff; border-color:#cc0000; }
  .linkbox { font-size:13px; background:#fff; border:1px dashed #888; padding:8px 10px; border-radius:6px; word-break: break-all; margin-top:10px; }
  body.teacher .ocard { max-width: 1100px; }
  body.teacher .ocard .qtext { font-size: clamp(18px, 2.3vw, 30px); padding: 14px 18px; }
  body.teacher .ocard .qnum { font-size: clamp(14px, 1.6vw, 20px); }
  body.teacher .ocard .choice { font-size: clamp(16px, 2vw, 26px); padding: 10px 16px; cursor: default; }
  body.teacher .ocard .choice .let { width: 1.6em; height: 1.6em; }
  .choice .tbarfill { position:absolute; left:0; top:0; bottom:0; width:0; background: rgba(27,69,135,.18); transition: width .4s; }
  .choice .tcount { position:relative; font-size: .8em; font-weight:700; white-space:nowrap; }
  .choice.right { border-color: var(--gd); background: var(--green); }
  .choice.right .let { background: var(--gd); border-color: var(--gd); color:#fff; }
  .tstats { display:flex; flex-wrap:wrap; gap: 8px 24px; align-items:center; padding: 12px 18px; border-top:1px solid #bbb; font-size: clamp(15px, 1.7vw, 22px); font-weight:700; }
  .tstats .big { font-size: 1.6em; }
  .tcolors { display:flex; gap: 12px; font-size:.8em; }
  .missing { padding: 8px 18px 12px; font-size: 14px; }
  .answers { padding: 4px 18px 14px; display:grid; gap:8px; max-height: 40vh; overflow:auto; }
  .answers div { border:1px solid #bbb; border-left-width: 8px; padding: 8px 10px; font-size: clamp(14px, 1.4vw, 18px); background:#fff; }
  .answers .correct { border-left-color: var(--gd); } .answers .partial { border-left-color: var(--yd); } .answers .incorrect { border-left-color: var(--rd); }

  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 50; background:#111; color:#fff; padding: 10px 16px;
           border-radius: 8px; font-size: 14px; font-weight:600; max-width: min(92vw, 560px); text-align:center; box-shadow: 0 4px 14px rgba(0,0,0,.3); }

  /* @@CLASSPASS-CSS-BEGIN: Class Pass (the same in every page; change it in class-pass/classpass.css, then run class-pass/make-pass.ps1) */
  .signin { background:#fff; border:2px solid #111; border-radius:8px; padding:16px; margin:14px 0; }
  .signin h2 { font-size:18px; margin:0 0 6px; }
  .signin p { font-size:14px; line-height:1.5; margin:6px 0 12px; }
  .signin label { display:block; font-size:13px; font-weight:600; margin-bottom:10px; }
  .signin input { display:block; width:100%; max-width:360px; margin-top:4px; padding:8px 10px; border:2px solid #111; border-radius:6px;
                  font-family:Poppins, Arial, sans-serif; font-size:16px; background:#fff; outline:none; }
  .signin input:focus { box-shadow: 0 0 0 3px rgba(60,120,216,.45); }
  .signin input.si-code { max-width:200px; font-size:22px; letter-spacing:4px; }
  .si-buttons { display:flex; flex-wrap:wrap; gap:8px; }
  .si-status { font-weight:600; min-height:1.5em; }
  .si-status.bad { color:#cc0000; }
  .si-alt { font-size:13px; color:#555; font-style:italic; border-top:1px solid #ddd; padding-top:10px; margin-bottom:0 !important; }
  .si-or { font-size:13px; font-weight:600; color:#555; border-top:1px solid #ddd; padding-top:12px; margin-top:16px !important; }
  button.linkbtn { background:none; border:0; border-radius:0; padding:0; color:#1b4587; text-decoration:underline; font-weight:600; font-size:inherit; }
  button.si-google, a.si-pass { display:inline-flex; align-items:center; gap:10px; background:#fff; color:#111; border:2px solid #111; border-radius:6px;
                                font-family:Poppins, Arial, sans-serif; font-weight:700; font-size:15px; padding:9px 18px; text-decoration:none; cursor:pointer; }
  button.si-google svg { width:20px; height:20px; flex:none; }
  a.si-pass { background:#1b4587; border-color:#1b4587; color:#fff; }
  .cp-brand { display:inline-block; font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:#fff; background:#1b4587;
              border-radius:4px; padding:2px 8px; margin:8px 0 2px; }
  .probewait { margin-top:14px; font-weight:400; font-size:14px; }
  /* @@CLASSPASS-CSS-END */
  /* in-page OK/Cancel box (same as Self-Check): the browser's own pop-up box adds "An embedded page at ... says" */
  .modal { position:fixed; inset:0; z-index:60; background:rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center; padding:16px; }
  .modal[hidden] { display:none; }
  .modal-card { background:#fff; border:2px solid #111; border-radius:8px; max-width:440px; width:100%; padding:20px; }
  .modal-card p { margin:0 0 18px; font-size:16px; font-weight:600; line-height:1.45; white-space:pre-line; }
  .modal-btns { display:flex; justify-content:flex-end; gap:10px; }
  /* every question, open to fix, after the video has been watched once */
  .fixlist .item { margin: 0 0 18px; }
  .fixlist .slot.flash .item { box-shadow: 0 0 0 4px var(--focus); transition: box-shadow .2s; }
  .slotnote { font-size:13px; color:#555; font-style:italic; padding: 10px 12px; border:1px dashed #999; margin: 0 0 18px; background:#fff; }
  .notjoined { background:#fff; color:#111; border:2px solid #111; border-radius:8px; padding:10px 14px; margin: -4px 0 12px; font-size:15px; }
</style>
</head>
<body>
<div class="wrap">
  <div id="loading">Loading the video…</div>
  <div id="app" hidden></div>
</div>
<div id="toast" class="toast" hidden></div>
<div class="modal" id="confirmBox" hidden role="dialog" aria-modal="true" aria-labelledby="confirmText">
  <div class="modal-card">
    <p id="confirmText"></p>
    <div class="modal-btns"><button class="secondary" id="confirmNo" type="button">Cancel</button><button id="confirmYes" type="button">Submit</button></div>
  </div>
</div>

<script>
/* ============================== BASICS ============================== */
var LETTERS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
var S = null;              // student state from the server
var T = null;              // teacher state (live lesson screen)
var cur = [];              // what's in each answer right now (MC: "0,2" = A and C)
var saved = [];            // last answer the server checked for each question
var draftSaved = [];       // last text the server has (checked OR autosaved)
var pending = {}, draftTimer = {}, saving = {}, saveWant = {};
var AUTOSAVE_MS = 8000;

/** Student calls that carry this browser's sign-in token, and how many arguments come before it.
    Missing arguments are filled with null so the token always lands in the same place. */
var TOKEN_ARGS = { getStudentState: 0, gradeAnswer: 3, checkAnswer: 3, saveDraft: 2, saveProgress: 2, turnIn: 0, livePoll: 0, signOut: 0,
                   revealQuestion: 3, getVideoChunk: 1, getPicture: 1 };

/* ============================== CLASS PASS (@@CLASSPASS-BEGIN) ==============================
   Class Pass signs a student in when Google can't tell this page who they are: a browser where a personal
   Google account is signed in before the school one (Google won't even open the web app there), or one with
   no Google account at all. The student signs in with Google (on the Class Pass page, where they can pick
   their school account) or, only if the teacher allows it in the Settings tab, with a 6-digit code emailed to
   their school address. Either one keeps that browser signed in to that assignment for 14 days.

   THE SAME BLOCK is in Video Check's and Self-Check's Index.html and in the Class Pass page on the class
   website. Change it only in class-pass/classpass.js, then run class-pass/make-pass.ps1, which copies it into
   every page (the tests fail if a copy is different).

   Where it runs (window.CLASS_PASS_PAGE, set by the page):
     (not set) "exec": the web app's own page, script.google.com/.../exec. Google usually says who it is.
     "pass": the Class Pass page, /pass/?app=<deployment ID>, the link students get. It checks out of sight
             whether Google will open the web app itself (school Chromebooks go straight there) and signs
             everyone else in, then opens the assignment's page under /pass/.
     "app":  an assignment's page on the class website (/pass/video/, /pass/check/). It talks to the sheet
             with fetch (see doPost in Code.gs), so no Google sign-in rides along and nothing can mix up.

   ONE SIGN-IN FOR EVERY ASSIGNMENT: each sheet keeps its own sign-ins, so a pass from one sheet means nothing
   to another. Instead, the device remembers which school account signed in with Google (classpass-me), and
   the next assignment asks Google for that account quietly (prompt=none): no box, just a quick trip through
   Google. That sheet checks Google's answer itself. An emailed code is only ever good for its own sheet.

   The host page sets CP_HOST before anything here runs:
     { tokenKey: where the /exec page keeps its sign-in, tokenArgs: { fn: arguments before the token },
       clear(title): empty the page and return the element to put a sign-in card in } */
var CP_WHERE = window.CLASS_PASS_PAGE || "exec";
var CP_SITE = CP_WHERE !== "exec";   // on the class website: every call to the sheet goes through fetch
var CP_DAYS = 14;
var CP_KINDS = { "video-check": "video", "auto-grading-activity": "check" };   // what the sheet says it is: its page under /pass/
var CP_BACK = CP_WHERE === "pass" ? cpTakeGoogleReturn() : null;          // just back from Google's sign-in page
var CP_APP = CP_SITE ? (new URLSearchParams(location.search).get("app") || (CP_BACK && CP_BACK.app) || "") : "";
var CP_EXEC = /^AKfycb[\w-]{20,}$/.test(CP_APP) ? "https://script.google.com/macros/s/" + CP_APP + "/exec" : "";

function cpEl(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function cpBtn(label, cls, onClick) { var b = cpEl("button", cls || "", label); b.type = "button"; if (onClick) b.addEventListener("click", onClick); return b; }
function cpIsSignInError(err) { return /SIGNIN/.test(String((err && err.message) || err || "")); }
function cpSignInText(err) { return String((err && err.message) || err || "").replace(/^[\s\S]*?SIGNIN:\s*/, "").replace(/^(BUSY|NETWORK): /, ""); }
/** Leaves this page. replace = the Back button skips it (so it can't send the student straight back). */
function cpGo(url, replace) {
  if (window.__classPassGo) return window.__classPassGo(url, replace);   // local tests only
  if (replace) location.replace(url); else location.assign(url);
}
/** The Class Pass page for this assignment, from an assignment's page on the class website. */
function cpPassUrl(extra) { return new URL("../?app=" + encodeURIComponent(CP_APP) + (extra || ""), location.href).href; }
function cpStatus(text) { var ld = document.getElementById("loading"); if (ld) { ld.hidden = false; ld.textContent = text; } }
/* On the class website, whatever a sheet sends is untrusted: a ?app= link can name ANY web app, and a script that ran on
   this site could read every Class Pass sign-in on the device. So its text only ever goes in as text, and its links
   and pictures only as web addresses (never javascript: or data:). */
/** A link (a simulation button, say): http(s) only, or "". */
function cpLinkUrl(u) { u = String(u == null ? "" : u).trim(); return /^https?:\/\/[^\s"'<>\\]+$/i.test(u) ? u : ""; }
/** A picture to show or open: https, or a picture this page made from the sheet's answer (blob:, image types only). */
function cpImgUrl(u) { u = String(u == null ? "" : u).trim(); return /^https:\/\/[^\s"'<>\\]+$/i.test(u) || /^blob:/.test(u) ? u : ""; }
/** The page under /pass/ for what a sheet says it is, or "". */
function cpPageFor(kind) { return Object.prototype.hasOwnProperty.call(CP_KINDS, String(kind)) ? CP_KINDS[kind] : ""; }

/* ---------- what this device keeps (localStorage; memory only if the browser blocks it) ---------- */
var cpMem = {};
function cpGet(k) {
  var v = null;
  try { v = localStorage.getItem(k); } catch (e) { v = null; }
  return v != null ? v : (cpMem.hasOwnProperty(k) ? cpMem[k] : null);
}
function cpPut(k, v) {
  if (v == null) delete cpMem[k]; else cpMem[k] = String(v);
  try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, String(v)); } catch (e) { /* kept for this visit only */ }
}
function cpJSON(k) { try { return JSON.parse(cpGet(k) || "null"); } catch (e) { return null; } }

/** On the class website: this assignment's sign-in, { t: token, e: email, k: what the sheet is, x: when it runs out }, or null. */
function cpPass() {
  var k = "classpass:" + CP_APP, r = cpJSON(k);
  if (!r) {   // signed in on the old Video Check front door (/video/) before Class Pass: keep that sign-in
    var old = cpGet("videocheck-signin:" + CP_APP);
    if (old && /^[0-9a-f]{64}$/.test(old)) {
      r = { t: old, e: "", k: "video-check", x: Date.now() + CP_DAYS * 86400000 };
      cpPut(k, JSON.stringify(r));
      cpPut("videocheck-signin:" + CP_APP, null);
    }
  }
  return r && typeof r.t === "string" && r.t && !(r.x && r.x < Date.now()) ? r : null;
}

function b64ToBytes(s) {

var P = null, VS = 0, VE = 0;

function qt(i) {

  var list = [];
  (S || T).questions.forEach(function (q, i) { if (qt(i) != null) list.push(i); });
  return list.sort(function (a, b) { return qt(a) - qt(b); });
}

  var list = [];

/* ============================== QUESTION CARD (students) ============================== */
function blockPaste(field, i) {
  if (!S.blockPaste) return;
  var stop = function (e) { e.preventDefault(); setMeta(i, "Pasting is turned off. Type your answer in your own words.", "#cc0000"); };
  field.addEventListener("paste", stop);
  field.addEventListener("drop", stop);
  field.addEventListener("beforeinput", function (e) { if (/insertFrom(Paste|Drop)/.test(e.inputType || "")) stop(e); });
}

function buildCard(i, host) {
  var q = Q(i), locked = S.locked;
  var card = el("div", "item");
  var qtx = el("div", "qtext");
  qtx.appendChild(el("span", "qnum" + (q.type === "note" ? " note" : ""), q.type === "note" ? "Note" : qLabel(q.num)));
  qtx.appendChild(document.createTextNode(q.text));
  if (q.type === "mc" && q.multi) qtx.appendChild(el("div", "multi", chooseText(q)));
  if (q.img) qtx.appendChild(figure(q, i));
  card.appendChild(qtx);
  if (q.type === "mc") {
    var ch = el("div", "choices"); ch.id = "a" + i;
    ch.setAttribute("role", "group"); ch.setAttribute("aria-label", "Answer choices");
    q.choices.forEach(function (c, k) {
      var b = btn("", "choice", function () { pick(i, k); });
      b.setAttribute("data-k", String(k)); b.disabled = locked;
      b.appendChild(el("span", "let", LETTERS.charAt(k)));
      b.appendChild(el("span", "ctext", c));
      ch.appendChild(b);
    });
    card.appendChild(ch);
  } else if (q.type === "open") {

    ta.placeholder = "Type your answer here…"; ta.setAttribute("aria-label", "Your answer");
    blockPaste(ta, i);
    ta.addEventListener("input", function () {
      cur[i] = ta.value;
      ta.className = "";
      setMeta(i, answerOf(i) !== saved[i] ? "Not checked yet" : "", "#b45f06");
      clearTimeout(draftTimer[i]);
      draftTimer[i] = setTimeout(function () { autosave(i); }, AUTOSAVE_MS);
    });
    ta.addEventListener("blur", function () { check(i, false); });
    card.appendChild(ta);
  }
  if (q.type !== "note") {

    row.appendChild(meta); row.appendChild(b2);

  }

/** Multiple-response questions always say how many answers are right. */
function chooseText(q) { return q.nRight > 1 ? "Choose " + q.nRight + " answers." : "Choose all that apply."; }

function pick(i, k) {
  if (S.locked) return;
  var q = Q(i), set = answerOf(i) ? answerOf(i).split(",").map(Number) : [];
  if (q.multi) { var at = set.indexOf(k); if (at === -1) set.push(k); else set.splice(at, 1); }
  else set = [k];
  set.sort(function (a, b) { return a - b; });
  cur[i] = set.join(",");
  paintCard(i);
  setMeta(i, cur[i] && cur[i] !== saved[i] ? "Press Check" : "", "#b45f06");
}

function paintCard(i) {
  var q = Q(i), res = (S.results && S.results[i]) || { status: "blank", message: "" };
  var box = document.getElementById("a" + i), checkedNow = answerOf(i) === saved[i];
  if (box && q.type === "mc") {
    var picks = answerOf(i) ? answerOf(i).split(",") : [];
    Array.prototype.forEach.call(box.children, function (b) {
      var on = picks.indexOf(b.getAttribute("data-k")) !== -1;
      b.className = "choice" + (on ? " sel" : "") + (on && checkedNow && res.status !== "blank" ? " " + res.status : "");
      b.setAttribute("aria-pressed", on ? "true" : "false");
    });
  } else if (box && q.type === "open") {
    box.className = checkedNow && res.status !== "blank" ? res.status : "";
  }
  var fb = document.getElementById("f" + i);
  if (fb) fb.textContent = res.message || "";

  m.textContent = text; m.style.color = color || "#666";
}

  paintCard(i);

}

/** How far the student has watched, sent with each answer (self-paced only). */
function watchedPos() { return S && S.mode === "self" ? Math.round(maxW * 10) / 10 : null; }

/**
 * Check = two steps (same as Self-Check).
 *  1. FAST: the server grades only (no waiting in line) and the page shows the color + hint.
 *  2. BACKGROUND: save, retrying quietly if the server is busy.
 */
function check(i, force) {
  var val = answerOf(i);
  if (S.locked || pending[i] || Q(i).type === "note") return;
  if (!val) { if (force) setMeta(i, Q(i).type === "mc" ? "Pick an answer first." : "Type your answer first.", "#cc0000"); return; }
  if (!force && val === saved[i]) return;
  pending[i] = true;
  clearTimeout(draftTimer[i]);
  setMeta(i, "Checking…", "#666"); setBtnBusy(i, true);
  var prior = (S.tries && S.tries[i]) || 0;
  RETRY_FAST(call("gradeAnswer", [i, val, prior]), function (resp) {
    pending[i] = false; setBtnBusy(i, false);
    var wasNew = val !== saved[i];
    saved[i] = val;
    if (Q(i).type === "mc" && wasNew && resp.result.status === "incorrect") S.tries[i] = prior + 1;
    setResult(i, resp.result);
    if (answerOf(i) !== val) setMeta(i, "Not checked yet", "#b45f06");
    else setMeta(i, "Checked. Saving…", "#666");
    queueSave(i, val);
  }, function (err) {
    pending[i] = false; setBtnBusy(i, false);
    setMeta(i, "Couldn't check yet, but your answer is still here. Wait a minute, then press Check again.", "#cc0000");
    if (isSignInError(err)) signedOutMidway();
    else if (err && err.message && /sign in|locked|NOT OPEN/i.test(err.message)) showError(err);
  }, function () { setMeta(i, "Checking… (lots of students are checking, so hang on)", "#666"); });
}

function queueSave(i, val) {
  saveWant[i] = val;

  saving[i] = true;
  var v = saveWant[i];
  withRetry(call("checkAnswer", [i, v, watchedPos()]), function (resp) {
    saving[i] = false;
    draftSaved[i] = v;
    if (resp && typeof resp.tries === "number") S.tries[i] = resp.tries;
    if (resp && resp.result && v === saved[i]) setResult(i, resp.result);   // the server's copy (same grader, real try count)
    if (resp && typeof resp.grade === "number" && !savesRunning()) S.grade = resp.grade;
    updateProgress();

    if (answerOf(i) === v) setMeta(i, "Saved " + stamp(), "#666");

    card.appendChild(ch);
  }
  wrap.appendChild(card);
  if (q.type !== "note" && !TL.preview) {
    var stats = el("div", "tstats"); stats.id = "tstats";
    stats.innerHTML = '<span><span class="big" id="tAns">0</span> / <span id="tTot">…</span> answered</span><span class="tcolors" id="tCol"></span>';
    wrap.appendChild(stats);
    var miss = el("div", "missing"); miss.id = "tMiss"; miss.hidden = true; wrap.appendChild(miss);
    var ans = el("div", "answers"); ans.id = "tAnswers"; ans.hidden = true; wrap.appendChild(ans);
  }
  var bar = el("div", "obtns");
  if (q.type !== "note") {
    bar.appendChild(btn(q.type === "mc" ? "Show results" : "Show colors", "secondary", function (e) {
      TL.results = !TL.results; e.target.textContent = TL.results ? "Hide results" : (q.type === "mc" ? "Show results" : "Show colors"); paintTeacherQ();
    }));
    if (!TL.preview) {
      bar.appendChild(btn("Who hasn't answered", "secondary", function (e) {
        TL.showMissing = !TL.showMissing; e.target.textContent = TL.showMissing ? "Hide names" : "Who hasn't answered"; paintTeacherQ();
      }));
      if (q.type === "open") bar.appendChild(btn("Show answers (no names)", "secondary", function (e) {
        TL.showAnswers = !TL.showAnswers; e.target.textContent = TL.showAnswers ? "Hide answers" : "Show answers (no names)";
        pollTeacherNow(); paintTeacherQ();
      }));
    }
  }
  bar.appendChild(el("span", "spacer"));
  bar.appendChild(btn("Continue ▶", "blue", teacherContinue));
  wrap.appendChild(bar);
  stageOverlay(document.getElementById("stage"), wrap);
  paintTeacherQ();
  if (tellStudents && !TL.preview) {
    withRetry(call("liveOpen", [i, Math.round(TL.reach)]), function (live) { T.live = live; drawTeacherMarkers(); pollTeacherNow(); }, showError);
  }
}
function paintTeacherQ() {
  var i = TL.open;
  if (i < 0) return;
  var q = T.questions[i], s = TL.status;
  var ch = document.getElementById("tch");
  if (ch) {
    var total = s && s.answered ? s.answered : 0;
    Array.prototype.forEach.call(ch.children, function (b) {
      var k = Number(b.getAttribute("data-k")), n = s && s.dist ? s.dist[k] || 0 : 0;
      var right = q.correct.indexOf(k) !== -1;
      b.className = "choice" + (TL.results && right ? " right" : "");
      b.querySelector(".tbarfill").style.width = TL.results && total ? (100 * n / total) + "%" : "0";
      b.querySelector(".tcount").textContent = TL.results && !TL.preview ? n + (n === 1 ? " student" : " students") : "";
    });
  }
  if (!s || TL.preview) return;
  var a = document.getElementById("tAns"), tt = document.getElementById("tTot"), col = document.getElementById("tCol");
  if (a) a.textContent = s.answered;
  if (tt) tt.textContent = s.total;
  if (col) {
    col.innerHTML = "";
    if (TL.results) [["correct", "green"], ["partial", "yellow"], ["incorrect", "red"]].forEach(function (p) {
      var c = el("span", "chip"); var d = el("i", "dot"); d.style.background = "var(--" + (p[0] === "correct" ? "green" : p[0] === "partial" ? "yellow" : "red") + ")";
      c.appendChild(d); c.appendChild(document.createTextNode(s.colors[p[0]] + " " + p[1])); col.appendChild(c);
    });
  }
  var m = document.getElementById("tMiss");
  if (m) { m.hidden = !TL.showMissing; m.textContent = s.missing.length ? "Not answered yet: " + s.missing.join(", ") : "Everyone has answered."; }
  var an = document.getElementById("tAnswers");
  if (an) {
    an.hidden = !TL.showAnswers;
    an.innerHTML = "";
    if (TL.showAnswers) (s.answers || []).forEach(function (x) { an.appendChild(el("div", TL.results ? x.s : "", x.a)); });
  }
}
function teacherContinue() {
  var from = TL.open;
  if (from === -1) return;
  TL.open = -1;
  closeOverlayEl(document.getElementById("stage"));
  if (!TL.preview) {
    var reach = Math.round(TL.reach);
    api.run("liveClose", [reach], function (live) { if (live) T.live = live; }, function () { api.run("liveClose", [reach], function () {}, function () {}); });
  }
  if (endDone) { teacherEndStep(); return; }
  lastT = P.time();
  P.play();
}
function endLive() {
  var p = T.live.period;
  askConfirm("End the live lesson for Period " + p + "?\n\nThe video opens on every Period " + p + " device right away. Students who joined get credit for everything the class watched together, and can fix answers until the due date.", function () {
    withRetry(call("liveEnd", [true, Math.round(TL.reach), Math.round(endT())]), function (periods) {
      T.live = null; T.periods = periods;
      renderTeacherHome("Live lesson ended. The video is now open for Period " + p + " to rewatch and fix answers.");
    }, showError);
  }, "End live lesson");
}
function paintNotJoined() {
  var box = document.getElementById("tNotJoined"), s = TL.lastStatus;
  if (!box) return;
  box.hidden = !TL.showNotJoined;
  if (!TL.showNotJoined) return;
  box.textContent = !s ? "Checking who's here…" :
    s.notJoined && s.notJoined.length ? "Not joined yet (" + s.notJoined.length + "): " + s.notJoined.join(", ") : "Everyone in Period " + T.live.period + " has joined.";
}
var tPollTimer = null;
function pollTeacher() {
  clearTimeout(tPollTimer);
  tPollTimer = setTimeout(function () {
    if (!T.live || TL.preview) return;
    api.run("liveStatus", [TL.showAnswers], function (s) { gotStatus(s); pollTeacher(); }, function () { pollTeacher(); });
  }, TL.open >= 0 ? 2000 : 5000);
  timers.push(tPollTimer);
}
function pollTeacherNow() {
  if (!T.live || TL.preview) return;
  api.run("liveStatus", [TL.showAnswers], gotStatus, function () {});
}
function gotStatus(s) {
  if (!s || !s.on) return;
  var j = document.getElementById("tJoined");
  if (j) j.textContent = "Joined: " + s.joined + " / " + s.total;
  TL.lastStatus = s;
  paintNotJoined();
  if (TL.open >= 0 && s.live && s.live.q === TL.open) { TL.status = s; paintTeacherQ(); }
}
document.addEventListener("keydown", function (e) {
  if (!T || !P || /TEXTAREA|INPUT/.test((e.target && e.target.tagName) || "")) return;
  if (!document.getElementById("confirmBox").hidden) return;   // the End live lesson box is open
  var k = e.key;
  if (TL.open !== -1 && TL.open !== -2 && (k === "Enter" || k === "PageDown" || k === "ArrowRight")) { e.preventDefault(); teacherContinue(); }
  else if (TL.open === -1 && (k === "PageDown" || k === " ")) { e.preventDefault(); if (P.state() === "playing") P.pause(); else { lastT = P.time(); P.play(); } }
});

/* ============================== START ============================== */
(function boot() {
  if (CP_SITE) return cpAppBoot(studentBoot);   // the live lesson screen never opens from the class website
  function start(params) { if (params && params.mode === "live") teacherBoot(); else studentBoot(); }
  try {
    if (window.google && google.script && google.script.url) google.script.url.getLocation(function (loc) { start((loc && loc.parameter) || {}); });
    else start({});
  } catch (e) { start({}); }
})();
</script>
