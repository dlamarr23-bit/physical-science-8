<!DOCTYPE html>
<html>
<head>
<script>window.CLASS_PASS_PAGE = "app";   /* on the class website, under Class Pass: see CLASS PASS in the page script */</script>
<title>Self-Check</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">

<!-- Poppins loads without holding up the page or its script (media="print" until it arrives; Arial until then) -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
  :root { --green:#d9ead3; --yellow:#fff2cc; --red:#f4cccc; --strip:#c9daf8; --q:#d9d9d9; }
  * { box-sizing: border-box; }
  body { margin:0; background:#f3f3f3; font-family:Poppins, Arial, sans-serif; color:#111; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 16px 16px 120px; }
  h1 { font-size: 24px; font-weight: 700; margin: 8px 0 4px; }
  .who { font-size: 13px; color:#555; margin-bottom: 8px; }
  .intro { font-style: italic; color:#555; font-size: 14px; margin: 6px 0 10px; }
  .links a { display:inline-block; margin: 4px 8px 4px 0; padding: 6px 12px; border:2px solid #111; border-radius: 6px;
             color:#111; text-decoration:none; font-weight:600; font-size:13px; background:#fff; }
  .progress { position: sticky; top: 0; z-index: 5; background:#fff; border:2px solid #111; border-radius:8px;
              padding: 10px 12px; margin: 14px 0; display:flex; flex-wrap:wrap; gap: 10px 16px; align-items:center; font-size:14px; font-weight:600; }
  .bar { flex: 1 1 220px; height: 14px; display:flex; border:1px solid #111; border-radius: 7px; overflow:hidden; background:#fff; }
  .bar span { height:100%; transition: width .3s; }
  .chip { display:inline-flex; align-items:center; gap:5px; }
  .dot { width:12px; height:12px; border:1px solid #111; border-radius:3px; display:inline-block; }
  .grade { margin-left:auto; font-size:16px; }
  .strip { background: var(--strip); font-weight:700; font-size: 17px; padding: 10px 12px; margin: 26px 0 12px;
           border-top: 2px solid #111; border-bottom: 2px solid #111; }
  .item { margin: 0 0 18px; border: 1px solid #bbb; background:#fff; }
  .qtext { background: var(--q); font-weight:700; font-size: 15px; padding: 10px 12px; line-height:1.45; }
  .qimg { margin: 10px 0 2px; }
  .qimg img { display:block; max-width:100%; max-height:420px; border:2px solid #111; border-radius:4px; background:#fff; cursor: zoom-in; }
  .qimg figcaption { font-weight:400; font-style:italic; font-size:13px; color:#333; margin-top:4px; }
  .qlinks { margin-top: 8px; }
  a.simbtn { display:inline-block; margin: 0 8px 8px 0; padding: 9px 16px; border:2px solid #1b4587; border-radius: 6px;
             background:#1b4587; color:#fff; text-decoration:none; font-weight:700; font-size:14px; }
  a.simbtn:hover, a.simbtn:focus { background:#133261; border-color:#133261; }
  .seclinks { margin: -4px 0 14px; }
  .qnum { display:inline-block; background:#111; color:#fff; border-radius:4px; padding:0 7px; margin-right:6px; font-size:13px; }
  textarea { display:block; width:100%; min-height: 84px; border:0; border-top:3px solid #111; border-bottom:3px solid #111;
             font-family:Poppins, Arial, sans-serif; font-size:15px; padding:10px 12px; resize: vertical; outline:none; background:#fff;
             transition: background .25s; }
  textarea:focus { box-shadow: inset 0 0 0 2px #3c78d8; }
  textarea.correct { background: var(--green); } textarea.partial { background: var(--yellow); } textarea.incorrect { background: var(--red); }
  .fb { background:#000; color:#fff; font-style: italic; font-size: 14px; padding: 9px 12px; min-height: 38px; line-height:1.45; }
  .row { display:flex; align-items:center; justify-content: space-between; gap: 8px; padding: 8px 12px; background:#fff; }
  .meta { font-size: 12px; color:#666; }
  button { font-family:Poppins, Arial, sans-serif; font-weight:700; font-size:14px; border:2px solid #111; border-radius:6px;
           background:#111; color:#fff; padding: 7px 16px; cursor:pointer; }
  button.secondary { background:#fff; color:#111; }
  button:disabled { opacity:.5; cursor: default; }
  .finish { text-align:center; margin: 30px 0; }
  .finish button { font-size: 16px; padding: 12px 26px; }
  .banner { background:#111; color:#fff; padding:10px 12px; border-radius:6px; font-size:14px; margin: 10px 0; }
  .error { background:#cc0000; }
  /* type-in boxes placed on a picture */
  .boxfig { margin: 10px 0 2px; }
  .boxwrap { position: relative; display: inline-block; max-width: 100%; line-height: 0; }
  .boxwrap img { display:block; max-width:100%; height:auto; border:2px solid #111; border-radius:4px; background:#fff; }
  .boxwrap input.pbox { position:absolute; margin:0; padding:0 4px; border:2px solid #3c78d8; border-radius:4px; background:#fff;
             font-family:Poppins, Arial, sans-serif; font-weight:600; font-size:clamp(10px, 1.9vw, 15px); line-height:1.1;
             text-align:center; color:#111; outline:none; transition: background .25s; }
  .boxwrap input.pbox:focus { box-shadow: 0 0 0 3px rgba(60,120,216,.45); }
  input.pbox.correct { background: var(--green); border-color:#38761d; }
  input.pbox.incorrect { background: var(--red); border-color:#cc0000; }
  .boxlist { display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px; margin-top: 10px; line-height:1.3; }
  .boxlist label { font-size: 13px; font-weight:600; }
  .boxlist input.pbox { display:block; width:100%; margin-top:3px; padding:7px 8px; border:2px solid #111; border-radius:4px;
             font-family:Poppins, Arial, sans-serif; font-size:15px; background:#fff; outline:none; }
  .boxhint { font-weight:400; font-style:italic; font-size:13px; color:#333; margin-top:6px; }
  .boxarea { border-top:3px solid #111; }
  .boxarea.correct { box-shadow: inset 6px 0 0 #38761d; } .boxarea.partial { box-shadow: inset 6px 0 0 #bf9000; } .boxarea.incorrect { box-shadow: inset 6px 0 0 #cc0000; }
  #loading { padding: 60px 0; text-align:center; font-weight:600; }
  /* "I'm finished" pop-up (built into the page so it doesn't show the browser's "An embedded page says..." box) */
  .modal { position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center; padding:16px; }
  .modal[hidden] { display:none; }
  .modal-card { background:#fff; border:2px solid #111; border-radius:8px; max-width:420px; width:100%; padding:20px; }
  .modal-card p { margin:0 0 18px; font-size:16px; font-weight:600; line-height:1.45; }
  .modal-btns { display:flex; justify-content:flex-end; gap:10px; }
  /* End of the quarter: "This assignment is closed" pop-up and the CLOSED bar (view only) */
  .closedbar { background:#111; color:#fff; border-radius:6px; padding:10px 12px; font-size:14px; font-weight:600; margin:10px 0;
               display:flex; gap:10px; align-items:center; }
  .closedbar[hidden] { display:none; }
  .closedbar .tag { background:#cc0000; border-radius:4px; padding:1px 8px; font-size:12px; letter-spacing:.06em; flex:none; }
  .modal-card.closed { max-width:440px; padding:0; overflow:hidden; }
  .closed .modal-head { background:var(--strip); border-bottom:2px solid #111; padding:12px 20px; font-weight:700; font-size:18px;
                        display:flex; align-items:center; gap:10px; }
  .closed .modal-head svg { width:26px; height:26px; flex:none; }
  .closed .modal-body { padding:18px 20px 20px; }
  .closed .modal-body p { margin:0 0 12px; font-size:15px; font-weight:400; line-height:1.5; }
  .closed .modal-body p.lead { font-weight:600; font-size:16px; }
  .closed .modal-body p.small { font-size:13px; color:#555; font-style:italic; }
  .item.viewonly textarea, .item.viewonly input.pbox { color:#111; opacity:.8; cursor:default; }
  /* picture upload questions (Answer type "upload") */
  .dropzone { border-top:3px solid #111; border-bottom:3px solid #111; padding:12px; background:#fff; outline:none; transition: background .25s; }
  .dropzone:focus { box-shadow: inset 0 0 0 3px #3c78d8; }
  .dropzone.over { background:#e8f0fe; box-shadow: inset 0 0 0 3px #1b4587; }
  .dropzone.correct { background: var(--green); }
  .dropzone .dzbox { border:2px dashed #555; border-radius:8px; padding:18px 12px; text-align:center; cursor:pointer; background:rgba(255,255,255,.6); }
  .dropzone .dzbox b { display:block; font-size:16px; margin-bottom:4px; }
  .dropzone .dzbox span { display:block; font-size:13px; color:#444; margin-bottom:10px; }
  .dropzone .dzprev { display:block; max-width:100%; max-height:360px; margin:0 auto 10px; border:2px solid #111; border-radius:4px; background:#fff; }
  .dropzone .dzprev[hidden] { display:none; }
  .dropzone button.dzpick { background:#1b4587; border-color:#1b4587; }
  .dropzone.viewonly .dzbox { cursor:default; }
  .remind { display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; background:var(--yellow); border-top:2px solid #bf9000;
            padding:9px 12px; font-size:14px; font-weight:600; }
  .remind[hidden] { display:none; }
  .remind button { font-size:13px; padding:4px 12px; }
  /* @@CLASSPASS-CSS-BEGIN: Class Pass (the same in every page; change it in class-pass/classpass.css, then run class-pass/make-pass.ps1) */
  .signin { background:#fff; border:2px solid #111; border-radius:8px; padding:16px; margin:14px 0; }
  .signin h2 { font-size:18px; margin:0 0 6px; }
  .signin p { font-size:14px; line-height:1.5; margin:6px 0 12px; }
  .signin label { display:block; font-size:13px; font-weight:600; margin-bottom:10px; }
  .signin input { display:block; width:100%; max-width:360px; margin-top:4px; padding:8px 10px; border:2px solid #111; border-radius:6px;
                  font-family:Poppins, Arial, sans-serif; font-size:16px; background:#fff; outline:none; }
  .signin input:focus { box-shadow: 0 0 0 3px rgba(60,120,216,.45); }
  .signin input.si-code { max-width:200px; font-size:22px; letter-spacing:4px; }
  .si-buttons { display:flex; flex-wrap:wrap; gap:8px; }
  .si-status { font-weight:600; min-height:1.5em; }
  .si-status.bad { color:#cc0000; }
  .si-alt { font-size:13px; color:#555; font-style:italic; border-top:1px solid #ddd; padding-top:10px; margin-bottom:0 !important; }
  .si-or { font-size:13px; font-weight:600; color:#555; border-top:1px solid #ddd; padding-top:12px; margin-top:16px !important; }
  button.linkbtn { background:none; border:0; border-radius:0; padding:0; color:#1b4587; text-decoration:underline; font-weight:600; font-size:inherit; }
  button.si-google, a.si-pass { display:inline-flex; align-items:center; gap:10px; background:#fff; color:#111; border:2px solid #111; border-radius:6px;
                                font-family:Poppins, Arial, sans-serif; font-weight:700; font-size:15px; padding:9px 18px; text-decoration:none; cursor:pointer; }
  button.si-google svg { width:20px; height:20px; flex:none; }
  a.si-pass { background:#1b4587; border-color:#1b4587; color:#fff; }
  .cp-brand { display:inline-block; font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:#fff; background:#1b4587;
              border-radius:4px; padding:2px 8px; margin:8px 0 2px; }
  .probewait { margin-top:14px; font-weight:400; font-size:14px; }
  /* the loading screen's progress bar (cpStep) */
  .cp-load { max-width:400px; margin:0 auto; font-family:Poppins, Arial, sans-serif; text-align:center; }
  .cp-step { font-size:16px; font-weight:600; color:#111; line-height:1.4; }
  .cp-bar { position:relative; height:6px; margin:14px auto 0; border-radius:3px; background:#d5deeb; overflow:hidden; }
  .cp-bar span { position:absolute; left:0; top:0; bottom:0; width:0; border-radius:3px; background:#1b4587; transition:width .5s linear; overflow:hidden; }
  .cp-bar span::after { content:""; position:absolute; top:0; bottom:0; left:0; width:60%;
                        background:linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.55), rgba(255,255,255,0)); animation:cp-sheen 1.3s linear infinite; }
  @keyframes cp-sheen { from { transform:translateX(-100%); } to { transform:translateX(170%); } }
  @media (prefers-reduced-motion: reduce) { .cp-bar span { transition:none; } .cp-bar span::after { animation:none; display:none; } }
  .cp-slow { font-size:14px; font-weight:400; color:#555; margin-top:12px; min-height:1.5em; }
  .cp-again { margin-top:10px; }
  .cp-again button { background:#1b4587; border-color:#1b4587; color:#fff; }
  .cp-detail { font-size:12px; font-weight:400; color:#777; margin-top:10px; }
  /* @@CLASSPASS-CSS-END */
</style>
</head>
<body>
<div class="wrap">
  <div id="loading">Loading your self-check…</div>
  <div id="signin" hidden></div>
  <div id="app" hidden>
    <h1 id="title"></h1>
    <div class="who" id="who"></div>
    <div class="intro" id="intro"></div>
    <div class="closedbar" id="closedBar" hidden><span class="tag">CLOSED</span><span id="closedBarText"></span></div>
    <div class="links" id="links"></div>
    <div id="msg"></div>
    <div class="progress" id="progress">
      <div class="bar" id="bar"><span id="bG" style="background:var(--green)"></span><span id="bY" style="background:var(--yellow)"></span><span id="bR" style="background:var(--red)"></span></div>
      <span class="chip"><i class="dot" style="background:var(--green)"></i><b id="nG">0</b></span>
      <span class="chip"><i class="dot" style="background:var(--yellow)"></i><b id="nY">0</b></span>
      <span class="chip"><i class="dot" style="background:var(--red)"></i><b id="nR">0</b></span>
      <span class="chip"><i class="dot"></i><b id="nB">0</b> left</span>
      <span class="grade" id="grade"></span>
    </div>
    <div id="items"></div>
    <div class="finish">
      <button id="finishBtn">I'm finished</button>
      <div class="meta" id="finishMeta" style="margin-top:8px"></div>
    </div>
  </div>
</div>
<div class="modal" id="closedBox" hidden role="dialog" aria-modal="true" aria-labelledby="closedTitle">
  <div class="modal-card closed">
    <div class="modal-head" id="closedTitle">
      <svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      This assignment is closed
    </div>
    <div class="modal-body">
      <p class="lead" id="closedLead"></p>
      <p>You can still look at your answers and feedback, but you can't change them or earn more credit.</p>
      <p>Spend your time on this quarter's assignments instead.</p>
      <p class="small">Think this is a mistake? Talk to your teacher.</p>
      <div class="modal-btns"><button id="closedOk">View my work</button></div>
    </div>
  </div>
</div>
<div class="modal" id="confirmBox" hidden role="dialog" aria-modal="true" aria-labelledby="confirmText">
  <div class="modal-card">
    <p id="confirmText"></p>
    <div class="modal-btns"><button class="secondary" id="confirmNo">Cancel</button><button id="confirmYes">Submit</button></div>
  </div>
</div>

<script>
/** Student calls that carry this browser's sign-in token, and how many arguments come before it.
    Missing arguments are filled with null so the token always lands in the same place. */
var TOKEN_ARGS = { getStudentState: 0, gradeAnswer: 2, checkAnswer: 2, saveDraft: 2, turnIn: 0, signOut: 0, getPicture: 1,
                   uploadPicture: 3, getMyUpload: 1 };

/* ============================== CLASS PASS (@@CLASSPASS-BEGIN) ==============================
   Class Pass signs a student in when Google can't tell this page who they are: a browser where a personal
   Google account is signed in before the school one (Google won't even open the web app there), or one with
   no Google account at all. The student signs in with Google (on the Class Pass page, where they can pick
   their school account) or, only if the teacher allows it in the Settings tab, with a 6-digit code emailed to
   their school address. Either one keeps that browser signed in to that assignment for 14 days.

   THE SAME BLOCK is in Video Check's and Self-Check's Index.html and in the Class Pass page on the class
   website. Change it only in class-pass/classpass.js, then run class-pass/make-pass.ps1, which copies it into
   every page (the tests fail if a copy is different).

   Where it runs (window.CLASS_PASS_PAGE, set by the page):
     (not set) "exec": the web app's own page, script.google.com/.../exec. Google usually says who it is.
     "pass": the Class Pass page, /pass/?app=<deployment ID>, the link students get. It checks out of sight
             whether Google will open the web app itself (school Chromebooks go straight there) and signs
             everyone else in, then opens the assignment's page under /pass/.
     "app":  an assignment's page on the class website (/pass/video/, /pass/check/). It talks to the sheet
             with fetch (see doPost in Code.gs), so no Google sign-in rides along and nothing can mix up.

   ONE SIGN-IN FOR EVERY ASSIGNMENT: each sheet keeps its own sign-ins, so a pass from one sheet means nothing
   to another. Instead, the device remembers which school account signed in with Google (classpass-me), and
   the next assignment asks Google for that account quietly (prompt=none): no box, just a quick trip through
   Google. That sheet checks Google's answer itself. An emailed code is only ever good for its own sheet.

   The host page sets CP_HOST before anything here runs:
     { tokenKey: where the /exec page keeps its sign-in, tokenArgs: { fn: arguments before the token },
       clear(title): empty the page and return the element to put a sign-in card in } */
var CP_WHERE = window.CLASS_PASS_PAGE || "exec";
var CP_SITE = CP_WHERE !== "exec";   // on the class website: every call to the sheet goes through fetch
var CP_DAYS = 14;
var CP_KINDS = { "video-check": "video", "auto-grading-activity": "check",   // what the sheet says it is: its page under /pass/
                 "net-force-escape-room": "net-force-escape" };            // (a one-off page: self-check/custom/, built by make-pass.ps1)
var CP_PREFETCH = ["video", "check"];   // the pages the Class Pass page fetches ahead (not the one-offs: they're big and rare)
var CP_BACK = CP_WHERE === "pass" ? cpTakeGoogleReturn() : null;          // just back from Google's sign-in page
var CP_APP = CP_SITE ? (new URLSearchParams(location.search).get("app") || (CP_BACK && CP_BACK.app) || "") : "";
var CP_EXEC = /^AKfycb[\w-]{20,}$/.test(CP_APP) ? "https://script.google.com/macros/s/" + CP_APP + "/exec" : "";

function cpEl(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function cpBtn(label, cls, onClick) { var b = cpEl("button", cls || "", label); b.type = "button"; if (onClick) b.addEventListener("click", onClick); return b; }
function cpIsSignInError(err) { return /SIGNIN/.test(String((err && err.message) || err || "")); }
function cpSignInText(err) { return String((err && err.message) || err || "").replace(/^[\s\S]*?SIGNIN:\s*/, "").replace(/^(BUSY|NETWORK): /, ""); }
/** Leaves this page. replace = the Back button skips it (so it can't send the student straight back). */
function cpGo(url, replace) {
  if (window.__classPassGo) return window.__classPassGo(url, replace);   // local tests only
  if (replace) location.replace(url); else location.assign(url);
}
/** The Class Pass page for this assignment, from an assignment's page on the class website. */
function cpPassUrl(extra) { return new URL("../?app=" + encodeURIComponent(CP_APP) + (extra || ""), location.href).href; }
/** A Class Pass link that skips the out-of-sight check (?signin=1): the /exec page already knows Google can't say who this is. */
function cpSignInLink(u) { u = String(u || ""); return /[?&]signin=1(&|#|$)/.test(u) ? u : u + (u.indexOf("?") === -1 ? "?" : "&") + "signin=1"; }
/** A message in place of the loading screen (a problem, or a choice to make): no progress bar. */
function cpStatus(text) { var ld = document.getElementById("loading"); if (ld) { cpStepStop(); ld.hidden = false; ld.textContent = text; } }
/** What the browser's console shows (DevTools > Console), to find a slow step: seconds since this page started loading. */
function cpLog(what) { try { console.info("Class Pass " + (performance.now() / 1000).toFixed(1) + " s: " + what); } catch (e) {} }

/* ---------- the loading screen: a thin progress bar with the step in words ----------
   Every wait before the assignment is on the page says which step it's on:
     Step 1 of 3: Checking your school sign-in…  the out-of-sight check (the Class Pass page)
     Step 2 of 3: Signing you in…               Google's answer, checked by the sheet
     Step 3 of 3: Opening your assignment…      the Class Pass page, then the assignment's page
   The /exec page shows the bar with no step number. After CP_SLOW_MS on one step it adds "Still working", after
   CP_STUCK_MS a Try again button (reloads the page) and, in small print, what it's waiting for. A step's clock carries
   on to the next page in the same tab (sessionStorage classpass-step), so a slow step can't hide behind a page change. */
var CP_STEPS = 3, CP_SLOW_MS = 10000, CP_STUCK_MS = 25000, CP_STEP_CARRY_MS = 30000;
var cpStepNow = null, cpStepTimer = 0, cpCalls = {}, cpCallN = 0;
/** n = the step (1 to 3; 0 = no number), text = what's happening. The same step again only changes the words. */
function cpStep(n, text) {
  var ld = document.getElementById("loading");
  if (!ld) return;
  var box = document.getElementById("cpLoad");
  if (!box || !ld.contains(box)) {
    ld.textContent = ""; cpStepNow = null;
    box = cpEl("div", "cp-load"); box.id = "cpLoad";
    var line = cpEl("div", "cp-step"), bar = cpEl("div", "cp-bar"), slow = cpEl("div", "cp-slow"), again = cpEl("div", "cp-again");
    line.setAttribute("aria-live", "polite"); slow.setAttribute("aria-live", "polite");   // (not the small print: it counts seconds)
    bar.setAttribute("aria-hidden", "true"); bar.appendChild(cpEl("span"));
    again.hidden = true;
    again.appendChild(cpBtn("Try again", "", function () { cpStepForget(); location.reload(); }));
    again.appendChild(cpEl("div", "cp-detail"));
    box.appendChild(line); box.appendChild(bar); box.appendChild(slow); box.appendChild(again);
    ld.appendChild(box);
  }
  ld.hidden = false;
  cpSetText(box.querySelector(".cp-step"), (n ? "Step " + n + " of " + CP_STEPS + ": " : "") + text);
  if (cpStepNow && cpStepNow.n === n) return;
  var now = Date.now(), at = now, kept = null;
  try { kept = JSON.parse(sessionStorage.getItem("classpass-step") || "null"); } catch (e) { kept = null; }
  if (!cpStepNow && kept && kept.n === n && kept.a === CP_APP && now - kept.at >= 0 && now - kept.at < CP_STEP_CARRY_MS) at = kept.at;   // carried on from the last page
  cpStepNow = { n: n, at: at, note: "" };

/**

 *   3. This device signed in with Class Pass before (or ?signin=1): skip the check; ask Google quietly for the
 *      account it used, or show the card.
 *   4. Otherwise the out-of-sight check: Google knows the student (school Chromebooks): the plain /exec link.
 *      Not: the card.
 * Meanwhile it asks the sheet what it is (Video Check or Self-Check), which picks the page that opens, and it
 * prefetches both assignment pages. With a Google sign-in the sheet sends the assignment too (2026.09.30 on); after
 * any other sign-in it asks for it (getStudentState). Either way it hands the answer to the assignment's page

  }
  function page(kind) { return cpPageFor(kind) ? new URL(cpPageFor(kind) + "/?app=" + encodeURIComponent(CP_APP), location.href).href : ""; }
  function preload() {   // just signed in: ask for the assignment now (once, no retries), for its page

    function end(s) { if (p.over) return; p.over = true; p.state = s; p.then.splice(0).forEach(function (f) { f(); }); }

    setTimeout(function () { end(null); }, CP_PRELOAD_MS);   // too slow: the assignment's page asks for itself

    if (!tab && !pre && r && r.state && typeof r.state === "object" && !r.state.needSignIn) pre = { over: true, state: r.state, then: [] };

      var row = cpEl("div", "si-buttons");

/* ---------- the assignment, handed from the Class Pass page to the assignment's page ----------

/* ---------- pictures ----------
   On the class website a Google Drive picture comes through the sheet (getPicture): Drive only shows a picture shared
   with the district to a browser whose FIRST Google account is a school one. Two at a time, each once. */
var cpPics = {}, cpPicQ = [], cpPicBusy = 0;
function cpPicture(img, src, idx) {
  if (!CP_SITE || !/^https:\/\/drive\.google\.com\/thumbnail\?/.test(String(src))) { if (cpImgUrl(src)) img.src = cpImgUrl(src); return; }
  if (cpPics[idx]) { img.src = cpPics[idx]; return; }
  cpPicQ.push({ img: img, src: src, idx: idx });
  cpPicNext();
}
function cpPicNext() {
  while (cpPicBusy < 2 && cpPicQ.length) (function (job) {
    if (cpPics[job.idx]) { job.img.src = cpPics[job.idx]; return; }
    cpPicBusy++;
    cpRetry(cpCall("getPicture", [job.idx]), function (r) {
      cpPicBusy--;
      if (!r || !/^image\/(png|jpeg|gif|webp|bmp)$/.test(String(r.mime)) || typeof r.data !== "string") {   // never a page or a script
        job.img.alt = "The picture didn't load. Reload the page to try again."; cpPicNext(); return;
      }
      try {
        var bin = atob(r.data), bytes = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        cpPics[job.idx] = URL.createObjectURL(new Blob([bytes], { type: r.mime }));   // a blob: address also opens in a new tab
      } catch (e) { job.img.alt = "The picture didn't load. Reload the page to try again."; cpPicNext(); return; }
      job.img.src = cpPics[job.idx];

    }, function (err) {
      cpPicBusy--;

}

/* ---------- picture upload questions (Answer type "upload" in the Questions tab) ----------
   Drag a picture onto the box, click the box and paste (Ctrl+V, e.g. a screenshot or a Keep drawing copied with
   Copy image), or press Choose a picture. The picture is shrunk here (longest side UPLOAD_MAX_PX, JPEG) and sent to
   the sheet, which saves it in your Drive. Not graded. */
var UPLOAD_MAX_PX = 1600, uploading = {};
function uploadBox(i) {
  var zone = el("div", "dropzone"); zone.id = "a" + i; zone.tabIndex = 0;
  zone.setAttribute("role", "group"); zone.setAttribute("aria-label", "Picture for question " + (i + 1));
  var prev = el("img", "dzprev"); prev.id = "p" + i; prev.alt = "Your picture for question " + (i + 1); prev.hidden = true;
  var dz = el("div", "dzbox");
  dz.appendChild(el("b", null, "Add your picture here"));
  dz.appendChild(el("span", null, "Drag a picture onto this box, or click this box and press Ctrl+V to paste it. A photo or a screenshot works."));
  var pick = el("button", "dzpick", "Choose a picture"); pick.type = "button"; pick.id = "u" + i; pick.disabled = S.locked;
  var file = el("input"); file.type = "file"; file.accept = "image/*"; file.hidden = true;
  dz.appendChild(pick); dz.appendChild(file);
  zone.appendChild(prev); zone.appendChild(dz);
  pick.addEventListener("click", function (e) { e.stopPropagation(); if (!S.locked) file.click(); });
  file.addEventListener("change", function () { if (file.files && file.files[0]) sendPicture(i, file.files[0]); file.value = ""; });
  dz.addEventListener("click", function () { zone.focus(); if (!S.locked) setMeta(i, "Now press Ctrl+V to paste your picture, or drag one here.", "#666"); });
  ["dragenter", "dragover"].forEach(function (t) { zone.addEventListener(t, function (e) { e.preventDefault(); if (!S.locked) zone.classList.add("over"); }); });
  ["dragleave", "dragend"].forEach(function (t) { zone.addEventListener(t, function () { zone.classList.remove("over"); }); });
  zone.addEventListener("drop", function (e) {
    e.preventDefault(); zone.classList.remove("over");
    if (S.locked) return;
    var f = pictureFrom(e.dataTransfer);
    if (f) sendPicture(i, f); else setMeta(i, "That wasn't a picture. Drag in a picture file, or use Choose a picture.", "#cc0000");
  });
  zone.addEventListener("paste", function (e) {
    e.preventDefault();
    if (S.locked) return;
    var f = pictureFrom(e.clipboardData);
    if (f) sendPicture(i, f);
    else setMeta(i, "There's no picture to paste. Copy a picture first (a screenshot, or right-click a picture > Copy image), then press Ctrl+V here.", "#cc0000");
  });
  return zone;
}
/** The first picture in a drop or a paste, or null. */
function pictureFrom(dt) {
  if (!dt) return null;
  var k, list = dt.files || [];
  for (k = 0; k < list.length; k++) if (/^image\//.test(list[k].type)) return list[k];
  var items = dt.items || [];
  for (k = 0; k < items.length; k++) if (items[k].kind === "file" && /^image\//.test(items[k].type)) { var f = items[k].getAsFile(); if (f) return f; }
  return null;
}
/** A picture file -> { data (base64 JPEG), mime, url (for the preview) }, longest side UPLOAD_MAX_PX. */
function shrinkPicture(file, done, fail) {
  var src = URL.createObjectURL(file), img = new Image();
  img.onload = function () {
    try {
      var w = img.naturalWidth, h = img.naturalHeight, k = Math.min(1, UPLOAD_MAX_PX / Math.max(w, h, 1));
      var c = document.createElement("canvas"); c.width = Math.max(1, Math.round(w * k)); c.height = Math.max(1, Math.round(h * k));
      var g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height);   // see-through PNGs get a white background
      g.drawImage(img, 0, 0, c.width, c.height);
      var url = c.toDataURL("image/jpeg", 0.85);
      URL.revokeObjectURL(src);
      done({ data: url.split(",")[1], mime: "image/jpeg", url: url });
    } catch (e) { URL.revokeObjectURL(src); fail(); }
  };
  img.onerror = function () { URL.revokeObjectURL(src); fail(); };
  img.src = src;
}
function sendPicture(i, file) {
  if (S.locked || uploading[i]) return;
  if (!/^image\//.test(file.type || "")) { setMeta(i, "That file isn't a picture. Use a photo or a screenshot (JPG or PNG).", "#cc0000"); return; }
  setMeta(i, "Getting your picture ready…", "#666");
  shrinkPicture(file, function (pic) {
    var prev = document.getElementById("p" + i), oldSrc = prev.src, hadOld = !prev.hidden;
    prev.src = pic.url; prev.hidden = false;
    uploading[i] = true; saving["u" + i] = true;   // I'm finished and leaving the page wait for it
    var pick = document.getElementById("u" + i); pick.disabled = true;
    setMeta(i, "Uploading your picture…", "#666");
    withRetry(function (ok, fail) { api.upload(i, pic.data, pic.mime, ok, fail); }, function (resp) {
      uploading[i] = false; saving["u" + i] = false; pick.disabled = S.locked;
      saved[i] = draftSaved[i] = resp.url || "uploaded";
      paint(i, resp.result);
      if (typeof resp.grade === "number") S.grade = resp.grade;
      pick.textContent = "Choose a different picture"; markHasPicture(i);
      updateProgress(); updateReminders();
      setMeta(i, "Picture saved " + stamp() + ". To change it, add a different one.", "#38761d");
    }, function (err) {
      uploading[i] = false; saving["u" + i] = false; pick.disabled = S.locked;
      if (hadOld) prev.src = oldSrc; else prev.hidden = true;
      if (cpIsSignInError(err)) { signedOutMidway(); setMeta(i, "Not saved: sign in again, then add your picture again.", "#cc0000"); return; }
      if (closedMidway(err)) { setMeta(i, "Not saved: this assignment is closed.", "#cc0000"); return; }
      setMeta(i, String((err && err.message) || err || "").replace(/^(UPLOAD|BUSY|NETWORK): /, "") ||
                 "Your picture didn't upload. Wait a minute and try again.", "#cc0000");
    }, 0, function () { setMeta(i, "Uploading your picture… (lots of students saving, so hang on)", "#666"); });
  }, function () {
    setMeta(i, "This picture can't be opened here. Take a screenshot of it, or save it as a JPG or PNG, then try again.", "#cc0000");
  });
}
/** After a reload: show the picture the student already added (it's only in your Drive, so it comes through the sheet). */
function showMyUpload(i) {
  var pick = document.getElementById("u" + i); pick.textContent = "Choose a different picture"; markHasPicture(i);
  if (!api.myUpload) return;
  setMeta(i, "Loading your picture…", "#666");
  api.myUpload(i, function (r) {
    var prev = document.getElementById("p" + i);
    if (!r || !/^image\/(png|jpeg|gif|webp)$/.test(String(r.mime)) || typeof r.data !== "string") { setMeta(i, "Your picture is saved.", "#38761d"); return; }
    try {
      var bin = atob(r.data), bytes = new Uint8Array(bin.length);
      for (var k = 0; k < bin.length; k++) bytes[k] = bin.charCodeAt(k);
      prev.src = URL.createObjectURL(new Blob([bytes], { type: r.mime })); prev.hidden = false;
      setMeta(i, "Your picture is saved. To change it, add a different one.", "#38761d");
    } catch (e) { setMeta(i, "Your picture is saved.", "#38761d"); }
  }, function () { setMeta(i, "Your picture is saved. (It couldn't be shown right now.)", "#38761d"); });
}
function hasUpload(i) { return !!saved[i]; }
function markHasPicture(i) { var b = document.querySelector("#a" + i + " .dzbox b"); if (b) b.textContent = "Picture added. Want to use a different one?"; }
function missingUploads() { var out = []; S.questions.forEach(function (q, i) { if (q.upload && !hasUpload(i)) out.push(i); }); return out; }
function goToUpload(i) {
  var z = document.getElementById("a" + i);
  if (!z) return;
  z.scrollIntoView({ behavior: "smooth", block: "center" });
  setTimeout(function () { z.focus({ preventScroll: true }); }, 400);
}
/** The question right after an upload question reminds the student (once they click into it) if the picture is missing. */
function reminderFor(up, item) {
  var r = el("div", "remind"); r.hidden = true; r.setAttribute("data-up", up); r.setAttribute("role", "status");
  r.appendChild(el("span", null, "Reminder: you haven't added your picture for question " + (up + 1) + " yet."));
  var go = el("button", "secondary", "Go to question " + (up + 1)); go.type = "button";
  go.addEventListener("click", function () { goToUpload(up); });
  r.appendChild(go);
  item.addEventListener("focusin", function () { if (!S.locked && !hasUpload(up)) { r.hidden = false; r.setAttribute("data-shown", "1"); } });
  return r;
}
function updateReminders() {
  document.querySelectorAll(".remind").forEach(function (r) {
    var up = Number(r.getAttribute("data-up"));
    r.hidden = hasUpload(up) || !r.getAttribute("data-shown");
  });
}

/* ---------- end of the quarter (view only) ---------- */
function isClosedNow() { return !!(S && S.close && S.close.closed); }
/** Closed already: view-only page + pop-up. Closing later while the page is open: switch over at that moment. */
function setUpClose() {
  var c = S.close;
  if (!c) return;
  if (c.closed) { showClosed(); return; }
  var wait = c.at - (S.now || Date.now()) + 1000;   // the sheet's clock, not this device's
  if (wait > 0 && wait < 86400000) setTimeout(function () { c.closed = true; showClosed(); }, wait);
}
function showClosed() {
  var c = S.close;
  S.locked = true;
  S.questions.forEach(function (_, i) { clearTimeout(draftTimer[i]); });
  document.querySelectorAll("textarea, input.pbox, .row button, .dropzone button, #finishBtn").forEach(function (x) { x.disabled = true; });
  document.querySelectorAll(".item").forEach(function (x) { x.classList.add("viewonly"); });
  if (c.base != null) document.getElementById("intro").textContent = c.base;   // drop the "closes soon" / closed sentence (the bar says it)
  document.getElementById("closedBarText").textContent = c.note;
  document.getElementById("closedBar").hidden = false;
  updateFinish(); updateProgress();
  showClosedPopup();
}
function showClosedPopup() {
  var box = document.getElementById("closedBox"), ok = document.getElementById("closedOk");
  document.getElementById("closedLead").textContent = S.close.quarter + " ended on " + S.close.ended + ".";
  box.hidden = false; ok.focus();
  function close() { box.hidden = true; ok.onclick = box.onclick = null; document.removeEventListener("keydown", key); }
  function key(e) { if (e.key === "Escape" || e.key === "Enter") close(); }
  ok.onclick = close;
  box.onclick = function (e) { if (e.target === box) close(); };
  document.addEventListener("keydown", key);
}
/** A check or save the sheet refused because the quarter ended (the page was opened before closing time). */
function closedMidway(err) {
  if (!(S && S.close && /ended/i.test(String(err && err.message)))) return false;
  if (!S.close.closed) { S.close.closed = true; showClosed(); }
  return true;
}

function setMeta(i, text, color) {
  var m = document.getElementById("m" + i);
  m.textContent = text; m.style.color = color || "#666";
}

function autosave(i) {
  if (isUploadQ(i)) return;
  var val = answerOf(i);
  if (S.locked || pending[i] || saving[i] || val === draftSaved[i] || val === saved[i]) return;
  if (!api.saveDraft) return;
  api.saveDraft(i, val, function (resp) {
    if (resp && resp.saved) {
      draftSaved[i] = val;
      if (answerOf(i) === val && val !== saved[i]) {
        setMeta(i, "Draft saved " + new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) + ". Press Check for feedback.", "#b45f06");
      }
    } else if (!(resp && resp.locked)) {
      clearTimeout(draftTimer[i]);
      draftTimer[i] = setTimeout(function () { autosave(i); }, AUTOSAVE_MS * 2);   // server busy: try again shortly
    }
  }, function (err) {
    if (cpIsSignInError(err)) { signedOutMidway(); return; }
    // Quietly try again later; Check still saves right away.
    clearTimeout(draftTimer[i]);
    draftTimer[i] = setTimeout(function () { autosave(i); }, AUTOSAVE_MS * 2);
  });
}

function paint(i, res) {
  var ta = document.getElementById("a" + i), fb = document.getElementById("f" + i);
  if (isUploadQ(i)) {
    ta.className = "dropzone" + (res && res.status === "correct" ? " correct" : "") + (S.locked ? " viewonly" : "");
  } else if (isBoxQ(i)) {
    ta.className = "boxarea" + (res && res.status !== "blank" ? " " + res.status : "");
    boxInputs(i).forEach(function (b, k) {
      var m = res && res.parts ? res.parts[k] : "";
      b.className = "pbox" + (m && m !== "blank" ? " " + m : "");
    });
  } else {
    ta.className = res && res.status !== "blank" ? res.status : "";
  }
  fb.textContent = res ? res.message : "";
  S.results[i] = res;
}

/** Busy server or a blip: try again quietly a few times before telling the student. */
var RETRY_DELAYS = [1500, 3500, 7000, 12000];
function isRetryable(err) {
  var m = String((err && err.message) || err || "");
  return !/SIGNIN|sign in|locked|turned this in|Unknown question|Unknown request|doesn't have any questions|isn't ready/i.test(m);
}
function withRetry(call, ok, fail, attempt, onRetry) {
  attempt = attempt || 0;
  call(ok, function (err) {
    if (attempt < RETRY_DELAYS.length && isRetryable(err)) {
      if (onRetry) onRetry(attempt);
      var wait = RETRY_DELAYS[attempt] + Math.floor(Math.random() * 1500);   // spread students out
      setTimeout(function () { withRetry(call, ok, fail, attempt + 1, onRetry); }, wait);
    } else fail(err);
  });
}

/** Running grade from the colors on the page (same formula as the server). */
function localGrade() {
  if (!S.credit) return S.grade;
  var earned = 0, n = 0;
  S.results.forEach(function (r, i) { if (isUploadQ(i)) return; n++; earned += S.credit[(r && r.status) || "blank"] || 0; });
  if (!n) return 0;
  var pts = Math.min(1, (earned / n) / S.fullCreditAt) * S.maxPoints;
  return Math.round(pts / S.roundTo) * S.roundTo;
}
function stamp() { return new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }); }

/**
 * Check = two steps.
 *  1. FAST: ask the server to grade only (no waiting in line) and show the color + hint.
 *  2. BACKGROUND: save to the spreadsheet, retrying quietly if the server is busy.
 */
function check(i, force) {
  if (isUploadQ(i)) return;   // pictures save through the upload box
  var val = answerOf(i);
  if (S.locked || pending[i]) return;
  if (!force && val === saved[i]) return;
  pending[i] = true;
  clearTimeout(draftTimer[i]);
  var meta = document.getElementById("m" + i), btn = document.getElementById("b" + i);
  meta.style.color = "#666"; meta.textContent = "Checking…"; btn.disabled = true;
  var gradeCall = api.grade ? function (ok, fail) { api.grade(i, val, ok, fail); }
                            : function (ok, fail) { api.check(i, val, ok, fail); };
  RETRY_FAST(gradeCall, function (resp) {
    pending[i] = false; btn.disabled = false;
    saved[i] = val;
    paint(i, resp.result);
    S.grade = localGrade();
    updateProgress();
    if (answerOf(i) !== val) { setMeta(i, "Not checked yet", "#b45f06"); }
    else setMeta(i, "Checked. Saving…", "#666");
    queueSave(i, val);
  }, function (err) {
    pending[i] = false; btn.disabled = false;
    setMeta(i, "Couldn't check yet. Your answer is still here. Wait a minute, then press Check again.", "#cc0000");
    if (cpIsSignInError(err)) signedOutMidway();
    else if (closedMidway(err)) setMeta(i, "Not saved: this assignment is closed.", "#cc0000");
    else if (err && err.message && /locked/i.test(err.message)) showError(err);
  }, function () { setMeta(i, "Checking… (lots of students checking, so hang on)", "#666"); });
}
/** Grading retries quickly (it doesn't wait in line, so a retry usually works at once). */
function RETRY_FAST(call, ok, fail, onRetry, attempt) {
  attempt = attempt || 0;
  var delays = [600, 1500, 3000, 6000];
  call(ok, function (err) {
    if (attempt < delays.length && isRetryable(err)) {
      if (onRetry) onRetry(attempt);
      setTimeout(function () { RETRY_FAST(call, ok, fail, onRetry, attempt + 1); }, delays[attempt] + Math.floor(Math.random() * 500));
    } else fail(err);
  });
}

/** Saves the newest checked answer for a question, one save at a time, in order. */
function queueSave(i, val) {
  saveWant[i] = val;
  if (saving[i]) return;               // the running save will pick up the newest text when it finishes
  saving[i] = true;
  var v = saveWant[i];
  withRetry(function (ok, fail) { api.check(i, v, ok, fail); }, function (resp) {
    saving[i] = false;
    draftSaved[i] = v;
    if (resp && resp.result && v === saved[i]) paint(i, resp.result);   // server's copy (same grader)
    if (resp && typeof resp.grade === "number" && !Object.keys(saving).some(function (k) { return saving[k]; })) S.grade = resp.grade;
    updateProgress();
    if (saveWant[i] !== v) { queueSave(i, saveWant[i]); return; }
    if (answerOf(i) === v) setMeta(i, "Saved " + stamp(), "#666");
  }, function (err) {
    saving[i] = false;
    setMeta(i, "Checked, but not saved yet. Press Check again in a minute so your teacher gets it.", "#cc0000");
    if (cpIsSignInError(err)) signedOutMidway();
    else if (closedMidway(err)) setMeta(i, "Not saved: this assignment is closed.", "#cc0000");
    else if (err && err.message && /locked/i.test(err.message)) showError(err);
  }, 0, function () {
    if (answerOf(i) === v) setMeta(i, "Checked. Saving… (lots of students saving, so hang on)", "#666");
  });
}
function savesRunning() { return Object.keys(saving).some(function (k) { return saving[k]; }); }

function updateProgress() {
  var c = { correct: 0, partial: 0, incorrect: 0, blank: 0 };
  S.results.forEach(function (r, i) { if (!isUploadQ(i)) c[(r && r.status) || "blank"]++; });   // picture uploads aren't graded
  var n = Math.max(1, S.questions.filter(function (q) { return !q.upload; }).length);
  document.getElementById("nG").textContent = c.correct;
  document.getElementById("nY").textContent = c.partial;
  document.getElementById("nR").textContent = c.incorrect;
  document.getElementById("nB").textContent = c.blank;
  document.getElementById("bG").style.width = (100 * c.correct / n) + "%";
  document.getElementById("bY").style.width = (100 * c.partial / n) + "%";
  document.getElementById("bR").style.width = (100 * c.incorrect / n) + "%";
  document.getElementById("grade").textContent = S.showGrade ? ((isClosedNow() ? "Final grade: " : "Grade: ") + S.grade + " / " + S.maxPoints) : "";
}

function updateFinish() {
  var meta = document.getElementById("finishMeta"), fin = document.getElementById("finishBtn");
  if (isClosedNow()) {
    fin.textContent = "Closed"; fin.disabled = true;
    meta.textContent = "This assignment closed when " + S.close.quarter + " ended." +
      (S.turnedIn ? " You turned it in " + new Date(S.turnedIn).toLocaleString([], { month: "numeric", day: "numeric", hour: "numeric", minute: "2-digit" }) + "." : "");
  } else if (S.turnedIn) {
    meta.textContent = "Turned in " + new Date(S.turnedIn).toLocaleString([], { month: "numeric", day: "numeric", hour: "numeric", minute: "2-digit" }) +
      (S.locked ? ". Your answers are locked." : ". You can still improve answers: your teacher sees your latest work.") +
      " Don't forget to click Mark as done in Google Classroom.";
    fin.textContent = S.locked ? "Turned in" : "Turn in again";
    fin.disabled = S.locked;
  } else {
    meta.textContent = "Click when you've answered everything. Then click Mark as done in Google Classroom.";
  }
}

var FINISH_MESSAGE = "This will submit your assignment. Click Mark as done in Google Classroom.";

/* In-page OK/Cancel box (replaces the browser's built-in confirm box, which adds "An embedded page at ... says"). */
function askConfirm(text, onYes, yesLabel, noLabel, onNo) {
  var box = document.getElementById("confirmBox"), yes = document.getElementById("confirmYes"), no = document.getElementById("confirmNo");
  document.getElementById("confirmText").textContent = text;
  yes.textContent = yesLabel || "Submit";
  no.textContent = noLabel || "Cancel";
  box.hidden = false; yes.focus();
  function close(go) {
    box.hidden = true; yes.onclick = no.onclick = box.onclick = null; document.removeEventListener("keydown", key);
    if (go) onYes(); else if (onNo) onNo();
  }
  function key(e) { if (e.key === "Escape") close(false); }
  yes.onclick = function () { close(true); };
  no.onclick = function () { close(false); };
  box.onclick = function (e) { if (e.target === box) close(false); };
  document.addEventListener("keydown", key);
}

function finish() {
  var missing = missingUploads();
  if (missing.length) {
    var which = missing.map(function (k) { return k + 1; }), many = which.length > 1;
    askConfirm("You haven't added your picture for question" + (many ? "s " + which.join(" and ") : " " + which[0]) + " yet. " +
               "Go back and add " + (many ? "them" : "it") + ", or submit without " + (many ? "them" : "it") + ". (Then click Mark as done in Google Classroom.)",
               submitNow, "Submit anyway", "Go back", function () { goToUpload(missing[0]); });
    return;
  }
  askConfirm(FINISH_MESSAGE, submitNow);
}
function submitNow() {
  var fin = document.getElementById("finishBtn"); fin.disabled = true;
  // Anything typed but not checked yet gets checked and saved first, so no work is lost.
  S.questions.forEach(function (_, i) { if (answerOf(i) !== saved[i]) check(i, true); });
  var waited = 0;
  (function whenSaved() {
    var busy = savesRunning() || Object.keys(pending).some(function (k) { return pending[k]; });
    if (busy && waited < 90000) { waited += 500; fin.textContent = "Saving your answers…"; return setTimeout(whenSaved, 500); }
    fin.textContent = "I'm finished";
    doTurnIn(fin);
  })();
}
function doTurnIn(fin) {
  withRetry(function (ok, fail) { api.turnIn(ok, fail); }, function (resp) {
    S.turnedIn = resp.turnedIn; S.grade = resp.grade;
    if (resp.locked) {
      S.locked = true;
      document.querySelectorAll("textarea, input.pbox, .row button, .dropzone button").forEach(function (x) { x.disabled = true; });
    }
    fin.disabled = S.locked;
    updateFinish(); updateProgress();
  }, function (err) { fin.disabled = false; if (cpIsSignInError(err)) signedOutMidway(); else if (!closedMidway(err)) showError(err); });
}

/* ---------- signing in (Class Pass) ---------- */
function signInInfo(s) { return { title: s.title, domain: s.domain, googleClient: s.googleClient, code: s.code, minutes: s.minutes, passLink: s.passLink }; }
/** The Class Pass card: before the assignment is on the page (a whole-page card), or midway (a sign-in ran out while working). */
function showSignIn(info, midway) {
  var box;
  if (midway) { box = el("div"); var app = document.getElementById("app"); app.insertBefore(box, app.firstChild); window.scrollTo(0, 0); }
  else box = CP_HOST.clear(info.title);
  cpCard(box, info, { midway: midway, done: function (r, card) {
    if (!midway) { document.getElementById("signin").hidden = true; start(); return; }
    if (S && r.email === S.email) {
      if (card) card.remove();
      note("You're signed in again. Press Check on any answer that didn't save.");
      return;
    }
    // Someone else signed in on a page showing another student's work: don't mix the two.
    S.locked = true;
    document.querySelectorAll("textarea, input.pbox, .row button, .dropzone button, #finishBtn").forEach(function (x) { x.disabled = true; });
    if (card) { card.innerHTML = ""; card.appendChild(el("p", null, "You signed in as " + r.email + ". Reload this page to see that student's work.")); }
  } });
}
/** A check or save found this browser signed out (the sign-in ran out or was removed). */
function signedOutMidway() {
  if (cpCardOpen || !S) return;
  showSignIn(signInInfo(S), true);
}
/** "Not you? Sign out" (only shown for Class Pass sign-ins). */
function signOutHere() {
  if (savesRunning()) { note("Your answers are still saving. Try again in a few seconds."); return; }
  askConfirm(CP_SITE ? "Sign out of Class Pass on this device?" : "Sign out of this page on this browser?", function () {
    var title = S ? S.title : document.title;
    S = null;
    var box = CP_HOST.clear(title);
    var msg = el("div", "banner", "Signing out…");
    box.appendChild(msg);
    cpSignOut(function () {
      if (CP_SITE) return cpGo(cpPassUrl("&signin=1"), true);   // the next student can sign in right away
      msg.textContent = "You're signed out on this browser. Reload the page to sign in again.";
    });
  }, "Sign out");
}

window.addEventListener("beforeunload", function (e) {
  if (!S || !S.questions) return;
  // Only warn if something typed hasn't reached the server yet (autosave covers the rest).
  var dirty = savesRunning() || S.questions.some(function (_, i) { return answerOf(i) !== draftSaved[i]; });
  if (dirty) { e.preventDefault(); e.returnValue = ""; }
});

function start() {
  // the loading screen's progress bar (cpStep): on the class website it's the last step of Class Pass
  if (CP_SITE) cpStep(3, "Opening your assignment…"); else cpStep(0, "Loading your self-check…");
  var handed = cpTakeState();   // the Class Pass page already asked for it while signing in
  if (handed) return gotState(handed);
  withRetry(function (ok, fail) { api.getState(ok, fail); }, gotState, function (err) {
    // The class website can't reach the sheet at all: most often the deployment isn't set to "Anyone" yet.
    if (CP_SITE && /^NETWORK/.test(String(err && err.message))) err = new Error(err.message + " If it still won't open, please tell your teacher.");
    showError(err);
  }, 0, function () { cpStepNote("Lots of students are opening this, so hang on."); });
}
function gotState(state) {
  if (state && state.needSignIn) { S = null; if (!cpNeedSignIn(state)) showSignIn(state, false); return; }
  S = state; render();
}
if (window.MOCK_API) start();
else if (CP_SITE) cpAppBoot(start);   // on the class website: signed in to this assignment on this device? else Class Pass
else start();
</script>
