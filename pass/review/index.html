<!DOCTYPE html>
<html>
<head>
<script>window.CLASS_PASS_PAGE = "app";   /* on the class website, under Class Pass: see CLASS PASS in the page script */</script>
<title>Review Game</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<base target="_blank">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Poppins loads without holding up the page or its script (media="print" until it arrives; Arial until then) -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
  /* REVIEW GAME (self-check\custom\review-game\): a Wayground-style game on a Self-Check sheet. Multiple choice, one try per
     question, points, streaks, power-ups and a leaderboard. Built by class-pass\make-pass.ps1 into /pass/review/. */
  :root { --bg1:#160726; --bg2:#3a0c44; --glow:#c2185b; --card:rgba(255,255,255,.07); --line:rgba(255,255,255,.16);
          --ink:#fff; --muted:#dccbe8; --green:#13b866; --green-dk:#0b8a4b; --red:#d93a4a; --red-dk:#a51f2e; --gold:#ffc83d;
          --t0:#6b8a0e; --t1:#8a3fd1; --t2:#c8580f; --t3:#0f8a78; --t4:#c42d63; --t5:#2a62c4; }
  * { box-sizing:border-box; }
  html, body { min-height:100%; }
  body { margin:0; color:var(--ink); font-family:Poppins, Arial, sans-serif;
         background: radial-gradient(ellipse 70% 38% at 50% 92%, rgba(194,24,91,.55), rgba(194,24,91,0) 70%),
                     radial-gradient(ellipse 30% 45% at 50% 0%, rgba(160,110,255,.35), rgba(160,110,255,0) 70%),
                     linear-gradient(180deg, var(--bg1), var(--bg2)) fixed; background-color:var(--bg1); }
  button { font-family:inherit; cursor:pointer; }
  button:disabled { cursor:default; }
  .wrap { max-width:1180px; margin:0 auto; padding:12px 16px 110px; }
  [hidden] { display:none !important; }
  /* loading and sign-in: light cards on the dark stage (the Class Pass block is styled for a light page) */
  #loading { background:#fff; color:#111; border-radius:16px; max-width:520px; margin:18vh auto 0; padding:26px 20px; text-align:center; font-weight:600; }
  #signin { background:#fff; color:#111; border-radius:16px; max-width:620px; margin:6vh auto 0; padding:16px 18px; }
  #signin h1 { font-size:22px; margin:6px 0; }
  #signin button:not(.linkbtn):not(.si-google) { background:#1b4587; color:#fff; border:2px solid #1b4587; border-radius:6px; padding:9px 16px; font-weight:700; }

  /* ---------- the start screen ---------- */
  .lobby { max-width:560px; margin:4vh auto 0; text-align:center; }
  .lobby h1 { font-size:26px; line-height:1.25; margin:6px 0 4px; font-weight:800; }
  .hello { color:var(--muted); font-size:15px; margin-bottom:14px; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; margin:12px 0; backdrop-filter:blur(4px); }
  .track { position:relative; height:10px; border-radius:5px; background:rgba(255,255,255,.18); margin:22px 6px 6px; }
  .track span { position:absolute; left:0; top:0; bottom:0; border-radius:5px; background:#fff; transition:width .6s ease; }
  .track svg { position:absolute; top:-22px; width:18px; height:18px; fill:#fff; }
  .track .tstart { left:-4px; } .track .tend { right:-4px; }
  .tlabels { display:flex; justify-content:space-between; font-size:11px; color:var(--muted); margin:0 2px; }
  .remain { font-weight:700; font-size:17px; margin:10px 0 14px; }
  .bigbtns { display:flex; gap:10px; }
  .bigbtns button { flex:1; min-height:58px; border-radius:12px; font-size:19px; font-weight:800; border:0; border-bottom:5px solid rgba(0,0,0,.25); }
  .go { background:var(--green); color:#fff; }
  .go:hover:not(:disabled) { filter:brightness(1.08); }
  .soft { background:#f1eef4; color:#4a3b57; }
  .soft:hover:not(:disabled) { background:#fff; }
  .go:disabled, .soft:disabled { opacity:.5; }
  .stats { display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin-top:12px; }
  .stat { background:rgba(0,0,0,.25); border:1px solid var(--line); border-radius:10px; padding:6px 12px; font-size:13px; color:var(--muted); }
  .stat b { color:#fff; font-size:15px; margin-left:4px; }
  .setTitle { text-align:left; color:var(--muted); font-size:13px; font-weight:600; margin:16px 2px 6px; }
  .setRow { display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:11px 14px; margin-bottom:8px; text-align:left; font-size:15px; }
  .setRow svg { width:20px; height:20px; fill:#fff; flex:none; }
  .setRow span { flex:1; }
  .switch { width:46px; height:26px; border-radius:13px; border:0; background:rgba(255,255,255,.3); position:relative; flex:none; padding:0; }
  .switch::after { content:""; position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:#fff; transition:left .15s; }
  .switch[aria-checked="true"] { background:var(--green); }
  .switch[aria-checked="true"]::after { left:23px; }
  .intro { color:var(--muted); font-size:13px; line-height:1.5; margin:14px 4px 0; }
  .whoLine { color:var(--muted); font-size:12px; margin-top:14px; }
  .whoLine button { background:none; border:0; color:#fff; text-decoration:underline; font-size:12px; padding:0; }
  .linkish { background:none; border:0; color:#fff; text-decoration:underline; font-weight:600; font-size:14px; padding:6px; }
  .closedNote { background:#fff3cd; color:#5c4400; border-radius:12px; padding:10px 14px; font-size:14px; margin:10px 0; text-align:left; }

  /* ---------- 3, 2, 1 ---------- */
  .count { position:fixed; inset:0; z-index:30; display:flex; flex-direction:column; align-items:center; justify-content:center; background:rgba(20,6,34,.92); }
  .count .num { width:100%; text-align:center; background:rgba(0,0,0,.35); padding:18px 0; font-size:110px; font-weight:800; line-height:1; animation:pop .9s ease; }
  .count .tip { margin-top:40px; width:100%; text-align:center; background:rgba(0,0,0,.45); padding:16px; }
  .count .tip b { display:block; font-size:22px; }
  @keyframes pop { from { transform:scale(.5); opacity:0; } 40% { transform:scale(1.1); opacity:1; } to { transform:scale(1); } }

  /* ---------- playing ---------- */
  .topbar { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
  .chip { display:inline-flex; align-items:center; gap:6px; background:rgba(0,0,0,.3); border:1px solid var(--line); border-radius:8px; padding:5px 10px; font-weight:700; font-size:14px; white-space:nowrap; }
  .chip svg { width:16px; height:16px; fill:currentColor; }
  .chip.rank { color:#ffd6ec; background:rgba(194,24,91,.35); }
  .chip.pts { color:var(--gold); }
  .chip.streak { color:#ffb36b; }
  .chip.streak.hot { color:#fff; background:linear-gradient(90deg,#ff7a18,#e8346c); border-color:transparent; }
  .spacer { flex:1; }
  .iconbtn { width:38px; height:34px; display:inline-flex; align-items:center; justify-content:center; border-radius:8px; border:1px solid var(--line); background:rgba(0,0,0,.3); color:#fff; padding:0; }
  .iconbtn svg { width:18px; height:18px; fill:currentColor; }
  .iconbtn:hover { background:rgba(255,255,255,.15); }
  .counter { display:block; width:max-content; margin:0 auto 10px; background:rgba(0,0,0,.4); border:1px solid var(--line); border-radius:14px; padding:3px 12px; font-weight:700; font-size:14px; color:var(--gold); }
  .qcard { display:flex; gap:18px; align-items:center; background:rgba(0,0,0,.28); border:1px solid var(--line); border-radius:14px; padding:16px; min-height:150px; }
  .qpic { flex:0 0 min(42%, 440px); position:relative; background:#fff; border-radius:10px; overflow:hidden; display:flex; align-items:center; justify-content:center; min-height:120px; border:0; padding:0; }
  .qpic img { display:block; max-width:100%; max-height:300px; object-fit:contain; }
  .qpic .zoom { position:absolute; left:8px; bottom:8px; width:30px; height:30px; border-radius:6px; background:rgba(0,0,0,.65); display:flex; align-items:center; justify-content:center; }
  .qpic .zoom svg { width:16px; height:16px; fill:#fff; }
  .qbody { flex:1; text-align:center; }
  .qsec { font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--gold); margin-bottom:6px; }
  .qtext { font-size:clamp(17px, 2.3vw, 24px); font-weight:600; line-height:1.4; overflow-wrap:anywhere; }
  .qcap { font-size:12px; color:#555; padding:4px 8px 6px; text-align:center; }
  .speak { margin-top:10px; }
  .multi { display:block; width:max-content; margin:12px auto 0; background:rgba(255,255,255,.18); border-radius:12px; padding:3px 12px; font-size:13px; font-weight:600; }
  .tiles { display:grid; gap:10px; margin-top:12px; grid-template-columns:repeat(var(--n), minmax(0, 1fr)); }
  .tile { position:relative; min-height:150px; border:0; border-radius:12px; color:#fff; font-size:clamp(15px, 1.7vw, 21px); font-weight:700; line-height:1.3;
          padding:30px 12px 18px; display:flex; align-items:center; justify-content:center; text-align:center; overflow-wrap:anywhere;
          box-shadow:inset 0 -6px 0 rgba(0,0,0,.22); transition:transform .12s, opacity .25s, filter .2s; }
  .tile:hover:not(:disabled) { transform:translateY(-3px); filter:brightness(1.1); }
  .tile:focus-visible { outline:3px solid #fff; outline-offset:3px; }
  .tile .key { position:absolute; top:8px; right:8px; min-width:22px; height:22px; border-radius:5px; background:rgba(0,0,0,.28); font-size:12px; display:flex; align-items:center; justify-content:center; }
  .tile .box { position:absolute; top:8px; left:8px; width:24px; height:24px; border-radius:6px; border:2px solid rgba(255,255,255,.85); background:rgba(0,0,0,.15); }
  .tile.sel .box { background:#fff; }
  .tile.sel .box::after { content:""; position:absolute; left:6px; top:1px; width:7px; height:13px; border:solid #2b1640; border-width:0 3px 3px 0; transform:rotate(45deg); }
  .tile.sel { box-shadow:inset 0 -6px 0 rgba(0,0,0,.22), 0 0 0 4px #fff; }
  .tile img { max-width:100%; max-height:200px; background:#fff; border-radius:8px; display:block; }
  .tile.picTile { padding:34px 10px 14px; }
  .c0 { background:linear-gradient(180deg,#8fb31a,var(--t0)); } .c1 { background:linear-gradient(180deg,#a865ea,var(--t1)); }
  .c2 { background:linear-gradient(180deg,#f0832e,var(--t2)); } .c3 { background:linear-gradient(180deg,#1fb7a0,var(--t3)); }
  .c4 { background:linear-gradient(180deg,#e9558a,var(--t4)); } .c5 { background:linear-gradient(180deg,#4f86e6,var(--t5)); }
  .tile.waiting { animation:pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { filter:brightness(1.25); transform:scale(1.02); } }
  .tile.right { background:linear-gradient(180deg,#2fd884,var(--green)); opacity:1; }
  .tile.wrong { background:linear-gradient(180deg,#f0606c,var(--red)); opacity:1; }
  .tile.dim { opacity:.28; }
  .tile .mark { position:absolute; top:8px; left:8px; width:26px; height:26px; border-radius:50%; background:#fff; display:flex; align-items:center; justify-content:center; }
  .tile .mark svg { width:16px; height:16px; }
  .tile .gain { position:absolute; left:50%; top:42%; transform:translate(-50%,-50%); font-size:34px; font-weight:800; text-shadow:0 3px 0 rgba(0,0,0,.35); animation:rise 1.4s ease forwards; pointer-events:none; }
  @keyframes rise { from { opacity:0; transform:translate(-50%,-20%) scale(.6); } 25% { opacity:1; transform:translate(-50%,-60%) scale(1.15); } to { opacity:0; transform:translate(-50%,-140%) scale(1); } }
  .submitRow { text-align:right; margin-top:10px; }
  .submitRow button { min-width:150px; min-height:46px; border-radius:10px; border:0; font-size:17px; font-weight:800; background:#fff; color:#2b1640; box-shadow:inset 0 -4px 0 rgba(0,0,0,.18); }
  .submitRow button:disabled { opacity:.45; }
  /* the result bar along the bottom after answering */
  .result { position:fixed; left:0; right:0; bottom:0; z-index:20; padding:12px 16px calc(12px + env(safe-area-inset-bottom)); animation:slideUp .25s ease; }
  .result.ok { background:var(--green-dk); } .result.no { background:var(--red-dk); }
  .result .in { max-width:1180px; margin:0 auto; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .result .verdict { font-size:22px; font-weight:800; display:flex; align-items:center; gap:8px; }
  .result .verdict svg { width:26px; height:26px; fill:#fff; }
  .result .extra { flex:1 1 300px; font-size:14px; line-height:1.45; }
  .result .extra b { color:#fff; }
  .result button { min-width:140px; min-height:48px; border-radius:10px; border:0; font-size:18px; font-weight:800; background:#fff; color:#2b1640; box-shadow:inset 0 -4px 0 rgba(0,0,0,.2); }
  .result .bar { position:absolute; left:0; top:0; height:4px; background:rgba(255,255,255,.7); }
  @keyframes slideUp { from { transform:translateY(100%); } to { transform:none; } }
  @keyframes drain { from { width:100%; } to { width:0; } }
  /* power-ups along the bottom */
  .powers { position:fixed; left:50%; bottom:12px; transform:translateX(-50%); z-index:10; display:flex; gap:8px; background:rgba(0,0,0,.45); border:1px solid var(--line); border-radius:14px; padding:6px; }
  .power { position:relative; width:52px; height:52px; border-radius:10px; border:2px solid transparent; color:#fff; padding:0; display:flex; align-items:center; justify-content:center; }
  .power svg { width:26px; height:26px; fill:#fff; }
  .power .n { position:absolute; right:-6px; top:-6px; min-width:20px; height:20px; border-radius:10px; background:var(--gold); color:#2b1640; font-size:12px; font-weight:800; display:flex; align-items:center; justify-content:center; padding:0 4px; }
  .power.p-double { background:linear-gradient(180deg,#7c6cff,#4b3cc9); }
  .power.p-saver { background:linear-gradient(180deg,#2ed06f,#139447); }
  .power.p-boost { background:linear-gradient(180deg,#ff9a3c,#e2551a); }
  .power:disabled { filter:grayscale(1); opacity:.35; }
  .power.armed { border-color:#fff; box-shadow:0 0 0 3px var(--gold), 0 0 18px var(--gold); transform:translateY(-4px); }
  .armedNote { text-align:center; color:var(--gold); font-weight:700; font-size:14px; margin-top:10px; min-height:1.4em; }
  .toast { position:fixed; left:50%; top:16px; transform:translateX(-50%); z-index:40; background:#fff; color:#2b1640; border-radius:12px; padding:10px 16px; font-weight:700; box-shadow:0 8px 24px rgba(0,0,0,.35); display:flex; gap:10px; align-items:center; max-width:calc(100% - 32px); animation:pop .4s ease; }
  .toast svg { width:24px; height:24px; flex:none; }
  /* a fun fact between questions */
  .fun { max-width:560px; margin:8vh auto 0; text-align:center; }
  .fun .card { background:#fff; color:#2b1640; border-radius:16px; padding:22px; font-size:18px; line-height:1.5; font-weight:600; }
  .fun .card small { display:block; color:#8a3fd1; font-size:13px; letter-spacing:.08em; text-transform:uppercase; margin-bottom:8px; font-weight:800; }
  .fun .rankLine { margin-top:14px; font-weight:700; color:var(--gold); }

  /* ---------- the end ---------- */
  .done { max-width:760px; margin:2vh auto 0; text-align:center; }
  .done h1 { font-size:28px; font-weight:800; margin:6px 0; }
  .ring { width:170px; height:170px; margin:10px auto; position:relative; }
  .ring svg { width:100%; height:100%; transform:rotate(-90deg); }
  .ring .pct { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:40px; font-weight:800; }
  .ring .pct small { font-size:13px; font-weight:600; color:var(--muted); }
  .gradeLine { font-size:18px; font-weight:700; margin:6px 0; }
  .bestLine { color:var(--muted); font-size:14px; margin:4px 0 8px; }
  .doneBtns { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin:14px 0; }
  .doneBtns button { min-width:180px; min-height:52px; border-radius:12px; border:0; font-size:17px; font-weight:800; border-bottom:5px solid rgba(0,0,0,.25); }
  .lastStep { font-size:14px; color:var(--muted); margin-top:4px; }
  details.review { text-align:left; margin-top:14px; }
  details.review summary { cursor:pointer; font-weight:700; font-size:16px; padding:8px 4px; }
  .rv { background:rgba(0,0,0,.25); border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin:8px 0; font-size:14px; line-height:1.45; }
  .rv .rq { font-weight:600; margin-bottom:4px; }
  .rv .ans { display:flex; gap:6px; align-items:flex-start; }
  .rv .ans svg { width:16px; height:16px; flex:none; margin-top:3px; }
  .rv .ok { color:#7ef0b0; } .rv .no { color:#ff9aa3; } .rv .key { color:#7ef0b0; } .rv .why { color:var(--muted); font-style:italic; }
  .rv img { max-height:60px; vertical-align:middle; background:#fff; border-radius:4px; }

  /* ---------- leaderboard ---------- */
  .board h2 { font-size:20px; margin:0 0 8px; }
  .tabs { display:flex; gap:6px; justify-content:center; margin-bottom:10px; }
  .tabs button { border:1px solid var(--line); background:rgba(0,0,0,.3); color:#fff; border-radius:16px; padding:5px 14px; font-weight:600; font-size:13px; }
  .tabs button[aria-pressed="true"] { background:#fff; color:#2b1640; }
  ol.rows { list-style:none; margin:0; padding:0; text-align:left; }
  ol.rows li { display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:10px; margin-bottom:5px; background:rgba(255,255,255,.07); font-size:15px; }
  ol.rows li.me { background:rgba(255,200,61,.22); outline:2px solid var(--gold); }
  ol.rows .place { width:30px; height:30px; border-radius:50%; background:rgba(0,0,0,.35); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; flex:none; }
  ol.rows li:nth-child(1) .place { background:#e8b21a; color:#2b1640; } ol.rows li:nth-child(2) .place { background:#c9ced6; color:#2b1640; } ol.rows li:nth-child(3) .place { background:#cd7f32; color:#fff; }
  ol.rows .nm { flex:1; font-weight:600; }
  ol.rows .pv { font-weight:800; color:var(--gold); }
  .gap { text-align:center; color:var(--muted); margin:2px 0; }
  .boardNote { font-size:12px; color:var(--muted); margin-top:10px; }

  /* ---------- pop-ups ---------- */
  .modal { position:fixed; inset:0; z-index:50; background:rgba(10,3,18,.75); display:flex; align-items:center; justify-content:center; padding:16px; }
  .modal-card { background:#2a1238; border:1px solid var(--line); border-radius:16px; padding:18px; width:min(560px, 100%); max-height:calc(100vh - 32px); overflow:auto; position:relative; }
  .modal-card.light { background:#fff; color:#111; }
  .modal-card p { line-height:1.5; }
  .modal-btns { display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap; margin-top:12px; }
  .modal-btns button { min-height:44px; padding:0 18px; border-radius:10px; border:0; font-weight:800; font-size:15px; }
  .modal-btns .yes { background:var(--green); color:#fff; } .modal-btns .no { background:#ece7f1; color:#2b1640; }
  .closeX { position:absolute; right:10px; top:10px; width:34px; height:34px; border-radius:8px; border:0; background:rgba(255,255,255,.12); color:#fff; font-size:20px; line-height:1; }
  .zoomBox img { max-width:100%; max-height:calc(100vh - 90px); display:block; margin:0 auto; background:#fff; border-radius:8px; }
  .zoomBox .modal-card { width:min(1100px, 100%); background:#111; }
  .confetti { position:fixed; inset:0; pointer-events:none; z-index:45; overflow:hidden; }
  .confetti i { position:absolute; top:-12px; width:9px; height:14px; border-radius:2px; animation:fall linear forwards; }
  @keyframes fall { to { transform:translateY(110vh) rotate(720deg); } }
  .ver { text-align:center; font-size:11px; color:rgba(255,255,255,.35); margin-top:28px; }
  .errorBox { background:#fff; color:#111; border-radius:12px; padding:12px 14px; margin:10px auto; max-width:620px; font-weight:600; }

  @media (max-width: 760px) {
    .qcard { flex-direction:column; align-items:stretch; }
    .qpic { flex:none; }
    .tiles { grid-template-columns:1fr !important; }
    .tile { min-height:64px; padding:12px 40px; font-size:16px; }
    .tile.picTile { padding:34px 10px 12px; }
    .count .num { font-size:80px; }
    .wrap { padding-bottom:140px; }
  }
  @media (min-width: 761px) and (max-width: 1000px) { .tiles.n4, .tiles.n5, .tiles.n6 { grid-template-columns:repeat(2, minmax(0, 1fr)); } .tile { min-height:110px; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; transition:none !important; }
  }
  /* @@CLASSPASS-CSS-BEGIN: Class Pass (the same in every page; change it in class-pass/classpass.css, then run class-pass/make-pass.ps1) */
  .signin { background:#fff; border:2px solid #111; border-radius:8px; padding:16px; margin:14px 0; }
  .signin h2 { font-size:18px; margin:0 0 6px; }
  .signin p { font-size:14px; line-height:1.5; margin:6px 0 12px; }
  .signin label { display:block; font-size:13px; font-weight:600; margin-bottom:10px; }

              border-radius:4px; padding:2px 8px; margin:8px 0 2px; }

  /* the loading screen's progress bar (cpStep) */

  .cp-step { font-size:16px; font-weight:600; color:#111; line-height:1.4; }
  .cp-bar { position:relative; height:6px; margin:14px auto 0; border-radius:3px; background:#d5deeb; overflow:hidden; }
  .cp-bar span { position:absolute; left:0; top:0; bottom:0; width:0; border-radius:3px; background:#1b4587; transition:width .5s linear; overflow:hidden; }
  .cp-bar span::after { content:""; position:absolute; top:0; bottom:0; left:0; width:60%;
                        background:linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.55), rgba(255,255,255,0)); animation:cp-sheen 1.3s linear infinite; }
  @keyframes cp-sheen { from { transform:translateX(-100%); } to { transform:translateX(170%); } }
  @media (prefers-reduced-motion: reduce) { .cp-bar span { transition:none; } .cp-bar span::after { animation:none; display:none; } }
  .cp-slow { font-size:14px; font-weight:400; color:#555; margin-top:12px; min-height:1.5em; }

<!-- No built-in pictures on this page: question and choice pictures come from the Questions tab (Drive share links or https addresses). -->
<script>
/** Student calls that carry this browser's sign-in token, and how many arguments come before it.
    Missing arguments are filled with null so the token always lands in the same place. */
var TOKEN_ARGS = { getStudentState: 0, answerChoice: 3, startOver: 0, getLeaderboard: 0, signOut: 0, getPicture: 1 };

/* ============================== CLASS PASS (@@CLASSPASS-BEGIN) ==============================
   Class Pass signs a student in when Google can't tell this page who they are: a browser where a personal
   Google account is signed in before the school one (Google won't even open the web app there), or one with
   no Google account at all. The student signs in with Google (on the Class Pass page, where they can pick
   their school account) or, only if the teacher allows it in the Settings tab, with a 6-digit code emailed to
   their school address. Either one keeps that browser signed in to that assignment for 14 days.

   THE SAME BLOCK is in Video Check's and Self-Check's Index.html and in the Class Pass page on the class
   website. Change it only in class-pass/classpass.js, then run class-pass/make-pass.ps1, which copies it into
   every page (the tests fail if a copy is different).

   Where it runs (window.CLASS_PASS_PAGE, set by the page):
     (not set) "exec": the web app's own page, script.google.com/.../exec. Google usually says who it is.
     "pass": the Class Pass page, /pass/?app=<deployment ID>, the link students get. It checks out of sight
             whether Google will open the web app itself (school Chromebooks go straight there) and signs
             everyone else in, then opens the assignment's page under /pass/.
     "app":  an assignment's page on the class website (/pass/video/, /pass/check/). It talks to the sheet
             with fetch (see doPost in Code.gs), so no Google sign-in rides along and nothing can mix up.

   ONE SIGN-IN FOR EVERY ASSIGNMENT: each sheet keeps its own sign-ins, so a pass from one sheet means nothing
   to another. Instead, the device remembers which school account signed in with Google (classpass-me), and
   the next assignment asks Google for that account quietly (prompt=none): no box, just a quick trip through
   Google. That sheet checks Google's answer itself. An emailed code is only ever good for its own sheet.

   The host page sets CP_HOST before anything here runs:
     { tokenKey: where the /exec page keeps its sign-in, tokenArgs: { fn: arguments before the token },
       clear(title): empty the page and return the element to put a sign-in card in } */
var CP_WHERE = window.CLASS_PASS_PAGE || "exec";
var CP_SITE = CP_WHERE !== "exec";   // on the class website: every call to the sheet goes through fetch
var CP_DAYS = 14;
var CP_KINDS = { "video-check": "video", "auto-grading-activity": "check",   // what the sheet says it is: its page under /pass/
                 "net-force-escape-room": "net-force-escape",              // (one-off pages: self-check/custom/, built by make-pass.ps1)
                 "reading-activity": "reading",                            // a side-by-side reading page whose article comes from a Google Doc
                 "friction-article": "friction",
                 "friction-speed-lab": "friction-lab",
                 "review-game": "review",                                   // a Wayground-style review game: multiple choice, one try each, points and a leaderboard
                 "friction-sim-lab": "friction-sim" };                      // the same lab with the ramp simulation live on the left (Directions / Simulation buttons)                    // the friction and speed lab: handout on the left, stopwatch + data table + graph, rubric-scored conclusion
var CP_PREFETCH = ["video", "check"];   // the pages the Class Pass page fetches ahead (not the one-offs: they're big and rare)
var CP_BACK = CP_WHERE === "pass" ? cpTakeGoogleReturn() : null;          // just back from Google's sign-in page
var CP_APP = CP_SITE ? (new URLSearchParams(location.search).get("app") || (CP_BACK && CP_BACK.app) || "") : "";
var CP_EXEC = /^AKfycb[\w-]{20,}$/.test(CP_APP) ? "https://script.google.com/macros/s/" + CP_APP + "/exec" : "";

function cpEl(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function cpBtn(label, cls, onClick) { var b = cpEl("button", cls || "", label); b.type = "button"; if (onClick) b.addEventListener("click", onClick); return b; }
function cpIsSignInError(err) { return /SIGNIN/.test(String((err && err.message) || err || "")); }
function cpSignInText(err) { return String((err && err.message) || err || "").replace(/^[\s\S]*?SIGNIN:\s*/, "").replace(/^(BUSY|NETWORK): /, ""); }
/** Leaves this page. replace = the Back button skips it (so it can't send the student straight back). */
function cpGo(url, replace) {
  if (window.__classPassGo) return window.__classPassGo(url, replace);   // local tests only
  if (replace) location.replace(url); else location.assign(url);
}
/** The Class Pass page for this assignment, from an assignment's page on the class website. */
function cpPassUrl(extra) { return new URL("../?app=" + encodeURIComponent(CP_APP) + (extra || ""), location.href).href; }
/** A Class Pass link that skips the out-of-sight check (?signin=1): the /exec page already knows Google can't say who this is. */
function cpSignInLink(u) { u = String(u || ""); return /[?&]signin=1(&|#|$)/.test(u) ? u : u + (u.indexOf("?") === -1 ? "?" : "&") + "signin=1"; }
/** A message in place of the loading screen (a problem, or a choice to make): no progress bar. */
function cpStatus(text) { var ld = document.getElementById("loading"); if (ld) { cpStepStop(); ld.hidden = false; ld.textContent = text; } }
/** What the browser's console shows (DevTools > Console), to find a slow step: seconds since this page started loading. */
function cpLog(what) { try { console.info("Class Pass " + (performance.now() / 1000).toFixed(1) + " s: " + what); } catch (e) {} }

/* ---------- the loading screen: a thin progress bar with the step in words ----------
   Every wait before the assignment is on the page says which step it's on:
     Step 1 of 3: Checking your school sign-in…  the out-of-sight check (the Class Pass page)
     Step 2 of 3: Signing you in…               Google's answer, checked by the sheet
     Step 3 of 3: Opening your assignment…      the Class Pass page, then the assignment's page
   The /exec page shows the bar with no step number. After CP_SLOW_MS on one step it adds "Still working", after
   CP_STUCK_MS a Try again button (reloads the page) and, in small print, what it's waiting for. A step's clock carries
   on to the next page in the same tab (sessionStorage classpass-step), so a slow step can't hide behind a page change. */
var CP_STEPS = 3, CP_SLOW_MS = 10000, CP_STUCK_MS = 25000, CP_STEP_CARRY_MS = 30000;
var cpStepNow = null, cpStepTimer = 0, cpCalls = {}, cpCallN = 0;
/** n = the step (1 to 3; 0 = no number), text = what's happening. The same step again only changes the words. */
function cpStep(n, text) {
  var ld = document.getElementById("loading");
  if (!ld) return;
  var box = document.getElementById("cpLoad");
  if (!box || !ld.contains(box)) {
    ld.textContent = ""; cpStepNow = null;
    box = cpEl("div", "cp-load"); box.id = "cpLoad";
    var line = cpEl("div", "cp-step"), bar = cpEl("div", "cp-bar"), slow = cpEl("div", "cp-slow"), again = cpEl("div", "cp-again");
    line.setAttribute("aria-live", "polite"); slow.setAttribute("aria-live", "polite");   // (not the small print: it counts seconds)
    bar.setAttribute("aria-hidden", "true"); bar.appendChild(cpEl("span"));
    again.hidden = true;
    again.appendChild(cpBtn("Try again", "", function () { cpStepForget(); location.reload(); }));
    again.appendChild(cpEl("div", "cp-detail"));
    box.appendChild(line); box.appendChild(bar); box.appendChild(slow); box.appendChild(again);
    ld.appendChild(box);
  }
  ld.hidden = false;
  cpSetText(box.querySelector(".cp-step"), (n ? "Step " + n + " of " + CP_STEPS + ": " : "") + text);
  if (cpStepNow && cpStepNow.n === n) return;
  var now = Date.now(), at = now, kept = null;
  try { kept = JSON.parse(sessionStorage.getItem("classpass-step") || "null"); } catch (e) { kept = null; }
  if (!cpStepNow && kept && kept.n === n && kept.a === CP_APP && now - kept.at >= 0 && now - kept.at < CP_STEP_CARRY_MS) at = kept.at;   // carried on from the last page
  cpStepNow = { n: n, at: at, note: "" };
  try { sessionStorage.setItem("classpass-step", JSON.stringify({ n: n, a: CP_APP, at: at })); } catch (e) {}
  box.querySelector(".cp-again").hidden = true;
  cpLog("step " + n + ", " + text + (at < now ? " (" + ((now - at) / 1000).toFixed(1) + " s so far)" : ""));
  clearInterval(cpStepTimer);
  cpStepTimer = setInterval(cpStepTick, 500);
  cpStepTick();
}
/** A line under the bar for this step (a retry, a busy sheet). */
function cpStepNote(text) { if (cpStepNow) { cpStepNow.note = text || ""; cpStepTick(); } }
function cpStepTick() {
  var ld = document.getElementById("loading"), box = document.getElementById("cpLoad");
  if (!cpStepNow || !ld || !box || ld.hidden || !ld.contains(box)) return cpStepStop();   // the card or the assignment took its place
  var t = Date.now() - cpStepNow.at, n = cpStepNow.n, from = n ? (n - 1) / CP_STEPS : 0, part = n ? 1 / CP_STEPS : 1;
  // this step's share of the bar, filling toward its end (and a little slower the longer it takes)
  box.querySelector(".cp-bar span").style.width = (100 * (from + part * (0.1 + 0.8 * (1 - Math.exp(-t / 8000))))).toFixed(1) + "%";
  cpSetText(box.querySelector(".cp-slow"), [t >= CP_SLOW_MS ? "Still working, this can take a moment." : "", cpStepNow.note].filter(Boolean).join(" "));
  var again = box.querySelector(".cp-again");
  if (t >= CP_STUCK_MS) {
    if (again.hidden) { again.hidden = false; cpLog("still on step " + n + " after " + Math.round(t / 1000) + " s. " + cpWaitingFor(t)); }
    again.querySelector(".cp-detail").textContent = cpWaitingFor(t);
  }
}
/** For the small print under Try again: the step, its time, and what it's waiting on. */
function cpWaitingFor(t) {
  var now = Date.now(), list = Object.keys(cpCalls).map(function (k) { return cpCalls[k].fn + " " + Math.round((now - cpCalls[k].at) / 1000) + " s"; });
  return "Step " + (cpStepNow ? cpStepNow.n : 0) + ", " + Math.round(t / 1000) + " s. " + (list.length ? "Waiting for the sheet: " + list.join(", ") + "." : "Not waiting for the sheet.");
}
/** Changes the words only when they change (a screen reader reads a live line again on every change). */
function cpSetText(e, s) { if (e.textContent !== s) e.textContent = s; }
function cpStepStop() { clearInterval(cpStepTimer); cpStepTimer = 0; if (cpStepNow) { cpStepNow = null; cpStepForget(); } }
function cpStepForget() { try { sessionStorage.removeItem("classpass-step"); } catch (e) {} }
/* On the class website, whatever a sheet sends is untrusted: a ?app= link can name ANY web app, and a script that ran on
   this site could read every Class Pass sign-in on the device. So its text only ever goes in as text, and its links
   and pictures only as web addresses (never javascript: or data:). */
/** A link (a simulation button, say): http(s) only, or "". */
function cpLinkUrl(u) { u = String(u == null ? "" : u).trim(); return /^https?:\/\/[^\s"'<>\\]+$/i.test(u) ? u : ""; }
/** A picture to show or open: https, or a picture this page made from the sheet's answer (blob:, image types only). */
function cpImgUrl(u) { u = String(u == null ? "" : u).trim(); return /^https:\/\/[^\s"'<>\\]+$/i.test(u) || /^blob:/.test(u) ? u : ""; }
/** The page under /pass/ for what a sheet says it is, or "". */
function cpPageFor(kind) { return Object.prototype.hasOwnProperty.call(CP_KINDS, String(kind)) ? CP_KINDS[kind] : ""; }

/* ---------- what this device keeps (localStorage; memory only if the browser blocks it) ---------- */
var cpMem = {};
function cpGet(k) {
  var v = null;
  try { v = localStorage.getItem(k); } catch (e) { v = null; }
  return v != null ? v : (cpMem.hasOwnProperty(k) ? cpMem[k] : null);
}
function cpPut(k, v) {
  if (v == null) delete cpMem[k]; else cpMem[k] = String(v);
  try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, String(v)); } catch (e) { /* kept for this visit only */ }
}
function cpJSON(k) { try { return JSON.parse(cpGet(k) || "null"); } catch (e) { return null; } }

/** On the class website: this assignment's sign-in, { t: token, e: email, k: what the sheet is, x: when it runs out }, or null. */
function cpPass() {
  var k = "classpass:" + CP_APP, r = cpJSON(k);
  if (!r) {   // signed in on the old Video Check front door (/video/) before Class Pass: keep that sign-in
    var old = cpGet("videocheck-signin:" + CP_APP);
    if (old && /^[0-9a-f]{64}$/.test(old)) {
      r = { t: old, e: "", k: "video-check", x: Date.now() + CP_DAYS * 86400000 };
      cpPut(k, JSON.stringify(r));
      cpPut("videocheck-signin:" + CP_APP, null);
    }
  }
  return r && typeof r.t === "string" && r.t && !(r.x && r.x < Date.now()) ? r : null;
}
/** This browser's sign-in token for this assignment, or "". */
function cpToken() {
  if (!CP_SITE) return cpGet(CP_HOST.tokenKey) || "";
  var r = cpPass();
  return r ? r.t : "";
}
function cpSetToken(t, email, kind) {
  if (!CP_SITE) { cpPut(CP_HOST.tokenKey, t || null); return; }
  var k = "classpass:" + CP_APP, old = cpJSON(k) || {};
  if (!t) { cpPut(k, null); return; }
  cpPut(k, JSON.stringify({ t: t, e: email || old.e || "", k: kind || old.k || "", x: Date.now() + CP_DAYS * 86400000 }));
}
/** The school account last signed in with Class Pass on this device (for 14 days): { e: email, g: with Google, at } or null. */
function cpMe() { var m = cpJSON("classpass-me"); return m && m.e && Date.now() - m.at < CP_DAYS * 86400000 ? m : null; }
function cpRemember(email, google) { if (CP_SITE && /^[^@\s"<>]+@[^@\s"<>]+\.[a-z]{2,}$/i.test(String(email || ""))) cpPut("classpass-me", JSON.stringify({ e: String(email).toLowerCase(), g: !!google, at: Date.now() })); }
/** "Not you? Sign out": ends this assignment's sign-in on the sheet, and forgets every Class Pass sign-in on this device.
    done() runs once the sheet has answered (or after 4 s), so leaving the page can't cut the request off. */
function cpSignOut(done) {
  var over = false;
  function end() { if (over) return; over = true; if (done) done(); }
  cpRun("signOut", [], end, end);   // sends the token now, before it's forgotten below
  setTimeout(end, 4000);

  var keys = [];
  try { for (var i = 0; i < localStorage.length; i++) keys.push(localStorage.key(i)); } catch (e) {}
  keys.concat(Object.keys(cpMem)).forEach(function (k) {

/* ---------- talking to the sheet ---------- */
/** From the class website: {fn, args, token} as text/plain (so the browser sends no CORS check first) to doPost. */
function cpFetch(fn, args, ok, fail) {
  fetch(CP_EXEC, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
                   body: JSON.stringify({ fn: fn, args: args, token: cpToken() }) })   // the server puts the token in place
    .then(function (r) {
      if (!r.ok) throw new Error("NETWORK: The assignment's sheet didn't answer (" + r.status + "). Wait a minute and try again.");
      return r.text();
    })
    .then(function (text) {
      var out = null;
      try { out = JSON.parse(text); } catch (e) { out = null; }
      if (!out) {
        if (/doPost/.test(text)) throw new Error("This assignment isn't ready for Class Pass yet. Please tell your teacher: its sheet needs the newest version.");
        throw new Error("NETWORK: The assignment's sheet sent something unexpected. Wait a minute and try again.");
      }
      return out;
    })
    .then(function (out) {
      if (out.ok) { if (ok) ok(out.result); }
      else fail(new Error(out.error || "Something went wrong. Reload the page."));
    }, function (err) {
      var m = String((err && err.message) || "");
      fail(/^NETWORK|isn't ready/.test(m) ? err : new Error("NETWORK: Couldn't reach the assignment's sheet. Check your internet connection."));
    });
}
/** Every call to the sheet. On the /exec page the token goes in as the last argument (missing ones are null).
    Calls on their way are listed in cpCalls (for the loading screen's small print) and timed in the console. */
function cpRun(fn, args, ok, fail) {
  fail = fail || function () {};
  var id = ++cpCallN, t0 = Date.now();
  cpCalls[id] = { fn: fn, at: t0 };
  function done(f, how) {
    return function (x) {
      delete cpCalls[id];
      if (cpStepNow) cpLog(fn + " " + how + " in " + ((Date.now() - t0) / 1000).toFixed(1) + " s");   // only while a loading screen shows
      if (f) f(x);

  }
  if (CP_SITE) return cpFetchHedged(fn, (args || []).slice(), done(ok, "answered"), done(fail, "failed"));
  var a = (args || []).slice(), n = CP_HOST.tokenArgs || {};
  if (n.hasOwnProperty(fn)) { while (a.length < n[fn]) a.push(null); a.push(cpToken()); }
  var r = google.script.run.withSuccessHandler(done(ok, "answered")).withFailureHandler(done(fail, "failed"));
  r[fn].apply(r, a);
}
/* Now and then one answer from the sheet takes far longer than the rest (seen on 2026-09-30: classPass 26.8 s while the
   same sheet answered the probe, sent at the same moment, in 1.9 s, and every call before and after in 1 to 4 s).
   So a call that is safe to repeat and hasn't answered in CP_HEDGE_MS is sent once more alongside, and whichever answers
   first wins. Saves are never sent twice this way (they have their own retries). */
var CP_HEDGE = { classPass: 1, getStudentState: 1, signInWithGoogle: 1 }, CP_HEDGE_MS = 6000;
function cpFetchHedged(fn, args, ok, fail) {
  var sent = 1, failed = 0, over = false, timer = 0;
  function win(x) { if (over) return; over = true; clearTimeout(timer); ok(x); }
  function lose(e) { failed++; if (over || failed < sent) return; over = true; clearTimeout(timer); fail(e); }   // only when every try failed
  cpFetch(fn, args, win, lose);
  if (CP_HEDGE[fn]) timer = setTimeout(function () {
    if (over) return;
    sent++;
    cpLog(fn + " is slow: asking once more alongside");
    cpFetch(fn, args, win, lose);
  }, CP_HEDGE_MS);
}
function cpCall(fn, args) { return function (ok, fail) { cpRun(fn, args || [], ok, fail); }; }
/** A busy server or a blip: try again quietly a few times. Sign-in answers are final. */
var CP_RETRY = [1500, 3500, 7000, 12000];
function cpRetry(c, ok, fail, attempt) {
  attempt = attempt || 0;
  c(ok, function (err) {
    var m = String((err && err.message) || err || "");
    if (attempt < CP_RETRY.length && !/SIGNIN|Unknown request|isn't ready|NOT OPEN|NOT YET|Unknown picture/.test(m)) {
      cpLog("trying again: " + m);
      cpStepNote("The assignment's sheet didn't answer. Trying again…");   // on a loading screen only
      setTimeout(function () { cpRetry(c, ok, fail, attempt + 1); }, CP_RETRY[attempt] + Math.floor(Math.random() * 1500));
    } else fail(err);
  });
}

/**

    });

    em = cpEl("input"); em.type = "text"; em.inputMode = "email"; em.autocomplete = "email"; em.spellcheck = false;
    em.setAttribute("autocapitalize", "none"); em.placeholder = "yourname@" + (info.domain || "school.org"); em.value = cpEmail;
    l1.appendChild(em); step1.appendChild(l1);
    sendBtn = cpEl("button", null, "Email me a code"); sendBtn.type = "submit";
    haveBtn = cpBtn("I already have a code", "secondary");
    var b1 = cpEl("div", "si-buttons"); b1.appendChild(sendBtn); b1.appendChild(haveBtn); step1.appendChild(b1);

}

/** Midway on an assignment's page: sign in with Google on a new tab. When it's done there, this tab carries on. */
function cpTabSignIn(say, done) {
  var before = cpToken(), w = null, timer = 0;
  try { w = window.open(cpPassUrl("&signin=1&tab=1"), "_blank"); } catch (e) { w = null; }
  if (!w) { say("Your browser blocked the new tab. Allow pop-ups for this page, or reload the page to sign in (answers that didn't save need to be typed again).", true); return; }
  say("Finish signing in on the new tab. This page carries on by itself when you're done.");
  function check() {
    var r = cpPass();
    if (!r || r.t === before) return;
    clearInterval(timer); window.removeEventListener("storage", check);
    cpCardOpen = false;
    if (done) done({ token: r.t, email: r.e });
  }
  timer = setInterval(check, 1500);
  window.addEventListener("storage", check);
}

/* ---------- Sign in with Google (the Class Pass page only) ----------

   first. It sends the browser back here with an ID token after the # (never to any server), and the sheet checks
   that token with Google before signing this browser in. The nonce ties the answer to this tab. */
function cpGoogle(client, opt, say) {

    // refuses a token made for a different deployment, so a link to some other web app can't collect a student's
    // Google sign-in and use it at a real assignment.
    nonce = Array.prototype.map.call(a, function (b) { return ("0" + b.toString(16)).slice(-2); }).join("") + "." + CP_APP;
    sessionStorage.setItem("classpass-google", JSON.stringify({ n: nonce, s: !!opt.silent, t: !!opt.tab, a: CP_APP }));
  } catch (e) { nonce = ""; }
  if (!nonce) { if (say) say("This browser blocks a step Google sign-in needs (a private window can do that). Try a regular window.", true); return false; }
  // Google only returns to the exact address registered with the client ID: .../pass/ (never .../pass/index.html)

  else p.prompt = "select_account";
  cpGo("https://accounts.google.com/o/oauth2/v2/auth?" + new URLSearchParams(p).toString());
  return true;
}
/** Back from Google's sign-in page? Its answer is after the # in the address. Returns { app, idToken, error } and takes
    the answer out of the address bar and the history, or returns null. */
function cpTakeGoogleReturn() {
  var h = location.hash.length > 1 ? new URLSearchParams(location.hash.slice(1)) : null;
  if (!h || !(h.get("id_token") || h.get("error"))) return null;
  var out = { app: String(h.get("state") || ""), idToken: h.get("id_token") || "", error: h.get("error") || "" };

  try { history.replaceState(null, "", location.pathname + (/^AKfycb[\w-]{20,}$/.test(app) ? "?app=" + app : "")); } catch (e) {}
  return out;
}
function cpClaims(t) {
  try {
    var p = String(t).split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
    while (p.length % 4) p += "=";
    return JSON.parse(decodeURIComponent(escape(atob(p))));
  } catch (e) { return null; }
}

    the quiet try just needs the student to pick). how = { s: quiet try, t: sign in for another tab }. */

    try { var old = sessionStorage.getItem("videocheck-google-nonce"); if (old) want = { n: old }; sessionStorage.removeItem("videocheck-google-nonce"); } catch (e) {}
  }

/* ---------- the out-of-sight check (the Class Pass page) ----------

// The probe page loads inside Google's page, so its answer usually comes before that page's load event: elsewhere
// 1.5 s after the load is plenty (it was 4 s). Chromebooks wait longer: at school it's almost always "yes", and a slow
// start on Google's side shouldn't send a whole class to the sign-in card.

    cpLog("the school sign-in check: " + (known === 1 ? "Google knows the student" : known === 0 ? "Google doesn't know the student" : "no answer (Google's error page, or too slow)"));
    done(known);

    if (!e.data || typeof e.data !== "object" || !("videoCheckProbe" in e.data)) return;
    if (!/^https:\/\/[\w-]+\.googleusercontent\.com$/.test(e.origin) && e.origin !== location.origin) return;
    if (!fromProbe(e.source)) return;   // only the hidden frame's own page (Google puts it a frame or two inside)

  f.src = window.CLASS_PASS_PROBE_URL ? window.CLASS_PASS_PROBE_URL(CP_APP, location.origin)   // local tests only
        : CP_EXEC + "?probe=1&from=" + encodeURIComponent(location.origin);

  t1 = setTimeout(function () { end(null); }, CP_PROBE_MAX_MS);
  t3 = setTimeout(function () {   // taking a while (a slow start on Google's side): let the student skip ahead to signing in
    var ld = document.getElementById("cpLoad") || document.getElementById("loading"), b = cpBtn("Sign in with Class Pass instead", "secondary", function () { end(null); });
    var box = cpEl("div", "probewait", "Taking a while? ");

function gotAnswer(i, sentPicks, r) {

function showResult(ok, r) {

/* ---------- the end ---------- */

  stat("Points", fmt(S.game.points)); stat("Best streak", String(S.game.bestStreak));

  box.appendChild(stats);

  box.appendChild(btns);

    box.appendChild(c);
  }
  document.body.appendChild(box);
  setTimeout(function () { box.remove(); }, 6000);
}

/* ---------- the leaderboard ---------- */
function myPlace() {
  if (!BOARD) return null;
  var v = BOARD.period ? BOARD.mine : BOARD.all, me = null;
  v.rows.forEach(function (r) { if (r.me) me = r; });
  return me || v.mine || null;
}
function loadBoard(force, then) {
  if (!force && BOARD && Date.now() - boardAt < 30000) { if (then) then(); return; }
  api.board(function (b) { BOARD = b; boardAt = Date.now(); if (S && !$("play").hidden) paintTop(); if (then) then(); }, function () { if (then) then(); });
}
function drawBoard(box, inPopup) {
  box.innerHTML = "";
  if (inPopup) { var x = el("button", "closeX", "×"); x.type = "button"; x.setAttribute("aria-label", "Close"); x.onclick = closeBoard; box.appendChild(x); }
  box.appendChild(el("h2", null, "Leaderboard"));
  if (!BOARD) { box.appendChild(el("p", null, "Loading the leaderboard…")); return; }
  var hasP = !!BOARD.period;
  if (hasP) {
    var tabs = el("div", "tabs");
    [["mine", "Period " + BOARD.period], ["all", "All periods"]].forEach(function (t) {
      var b = el("button", null, t[1]); b.type = "button"; b.setAttribute("aria-pressed", boardTab === t[0] ? "true" : "false");
      b.onclick = function () { boardTab = t[0]; drawBoard(box, inPopup); };
      tabs.appendChild(b);
    });
    box.appendChild(tabs);
  }
  var v = hasP && boardTab === "mine" ? BOARD.mine : BOARD.all;
  if (!v.rows.length) { box.appendChild(el("p", null, "No points yet. Answer a question to get on the board!")); }
  else {
    var ol = el("ol", "rows");
    function row(r) {
      var li = el("li", r.me ? "me" : "");
      li.appendChild(el("span", "place", String(r.place)));
      li.appendChild(el("span", "nm", r.name + (r.me ? " (you)" : "") + (!hasP || boardTab === "all" ? (r.period ? "  P" + r.period : "") : "")));
      li.appendChild(el("span", "pv", fmt(r.points)));
      return li;
    }
    v.rows.forEach(function (r) { ol.appendChild(row(r)); });
    box.appendChild(ol);
    if (v.mine) { box.appendChild(el("div", "gap", "⋯")); var ol2 = el("ol", "rows"); ol2.appendChild(row(v.mine)); box.appendChild(ol2); }
  }
  box.appendChild(el("div", "boardNote", "Points come from your best try. Right answers in a row and power-ups earn more." + (S.game.website ? " Your points also go on the Leaderboard on the class website." : "")));
}
function openBoard() {
  var box = $("boardBox"), card = $("boardCard");
  box.hidden = false;
  drawBoard(card, true);
  loadBoard(true, function () { if (!box.hidden) drawBoard(card, true); });
}
function closeBoard() { $("boardBox").hidden = true; }

/* ---------- pictures ---------- */
function zoom(img) {
  if (!img.src) return;
  $("zoomImg").src = img.src; $("zoomImg").alt = img.alt;
  $("zoomBox").hidden = false;
  $("zoomClose").focus();
}

/* ---------- keys ---------- */
document.addEventListener("keydown", function (e) {
  if (e.key === "Escape") { $("zoomBox").hidden = true; closeBoard(); if (!$("confirmBox").hidden) $("confirmNo").click(); return; }
  if (!$("confirmBox").hidden || !$("boardBox").hidden || !$("zoomBox").hidden || e.ctrlKey || e.metaKey || e.altKey) return;
  if (!$("result").hidden && (e.key === "Enter" || e.key === " ")) { if (document.activeElement && document.activeElement.id === "nextBtn") return; e.preventDefault(); afterResult(); return; }
  if ($("play").hidden || answering || !$("result").hidden) return;
  if (/^[1-6]$/.test(e.key)) {
    var t = document.querySelectorAll("#tiles .tile")[Number(e.key) - 1];
    if (t && !t.disabled) { e.preventDefault(); t.click(); }
  } else if (e.key === "Enter" && S && cur >= 0 && S.questions[cur].multi && picked.length && document.activeElement && !document.activeElement.classList.contains("tile")) { e.preventDefault(); send(); }
});

/* ---------- wiring ---------- */
$("startBtn").onclick = startPressed;
$("overBtn").onclick = confirmStartOver;
$("submitBtn").onclick = send;
$("lobbyBoardBtn").onclick = openBoard;
$("playBoardBtn").onclick = openBoard;
$("soundBtn").onclick = function () { prefs.sound = !prefs.sound; savePrefs(); paintSoundBtn(); if (prefs.sound) sfx("tick"); };
$("exitBtn").onclick = function () { if (answering) return; stopSpeaking(); showLobby(); };
$("zoomClose").onclick = function () { $("zoomBox").hidden = true; };
$("zoomBox").onclick = function (e) { if (e.target === this) this.hidden = true; };
$("boardBox").onclick = function (e) { if (e.target === this) closeBoard(); };

/* ---------- signing in (Class Pass) ---------- */
function signInInfo(s) { return { title: s.title, domain: s.domain, googleClient: s.googleClient, code: s.code, minutes: s.minutes, passLink: s.passLink }; }
/** The Class Pass card: before the game is on the page (a whole-page card), or midway (a sign-in ran out while playing). */
function showSignIn(info, midway) {
  var box;
  if (midway) { box = el("div", "modal-card light"); var wrap = el("div", "modal"); wrap.id = "midSignIn"; wrap.appendChild(box); document.body.appendChild(wrap); }
  else box = CP_HOST.clear(info.title);
  cpCard(box, info, { midway: midway, done: function (r) {
    if (!midway) { $("signin").hidden = true; start(); return; }
    var w = $("midSignIn"); if (w) w.remove();
    if (S && r.email === S.email) { toast(null, "You're signed in again. Pick your answer again.", 3000); return; }
    location.reload();   // someone else signed in: start over with their game
  } });
}
function signedOutMidway() {
  if (cpCardOpen || !S) return;
  showSignIn(signInInfo(S), true);
}
function signOutHere() {
  if (answering) return;
  askConfirm(CP_SITE ? "Sign out of Class Pass on this device?" : "Sign out of this game on this browser?", function () {
    var title = S ? S.title : document.title;
    S = null;
    var box = CP_HOST.clear(title);
    var msg = el("p", null, "Signing out…");
    box.appendChild(msg);
    cpSignOut(function () {
      if (CP_SITE) return cpGo(cpPassUrl("&signin=1"), true);   // the next student can sign in right away
      msg.textContent = "You're signed out on this browser. Reload the page to sign in again.";
    });
  }, "Sign out");
}
window.addEventListener("beforeunload", function (e) { if (answering) { e.preventDefault(); e.returnValue = ""; } });

function start() {
  if (CP_SITE) cpStep(3, "Opening your review game…"); else cpStep(0, "Loading your review game…");
  var handed = cpTakeState();   // the Class Pass page already asked for it while signing in
  if (handed) return gotState(handed);
  withRetry(function (ok, fail) { api.getState(ok, fail); }, gotState, function (err) {
    if (CP_SITE && /^NETWORK/.test(String(err && err.message))) err = new Error(err.message + " If it still won't open, please tell your teacher.");
    cpFail(err);
  }, 0, function () { cpStepNote("Lots of students are opening this, so hang on."); });
}
function gotState(state) {
  if (state && state.needSignIn) { S = null; if (!cpNeedSignIn(state)) showSignIn(state, false); return; }
  S = state; render();
}
if (window.MOCK_API) start();
else if (CP_SITE) cpAppBoot(start);   // on the class website: signed in to this game on this device? else Class Pass
else start();
</script>
