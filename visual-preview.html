<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visual Review · Physical Science 8</title>
<link rel="stylesheet" href="./assets/style.css">
<style>
  body{background:#f6f7fb}.preview-wrap{max-width:1100px;margin:0 auto;padding:36px 20px 70px}.preview-head{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px 26px;margin-bottom:24px;box-shadow:var(--shadow-sm)}.preview-head h1{margin:0 0 8px}.preview-head p{margin:0;color:var(--ink-soft)}.preview-card{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;margin:24px 0;box-shadow:var(--shadow)}.preview-card img{display:block;width:100%;height:auto;background:#fff}.preview-card figcaption{padding:16px 18px 18px;color:var(--ink-soft);line-height:1.6;border-top:1px solid var(--line)}.preview-card figcaption strong{color:var(--ink)}
</style>
</head>
<body>
<div class="preview-wrap">
  <div class="preview-head">
    <h1>Chapter Illustration Review</h1>
    <p>These are standalone chapter images, not the generic homepage graphic. This page is only for reviewing the visual direction before the rest of the illustrations are finalized.</p>
  </div>
  <figure class="preview-card">
    <img src="./assets/illustrations/u1-t1-frames-of-reference.svg" alt="Two perspectives of the same moving car: from inside the car and from the sidewalk">
    <figcaption><strong>Frames of Reference:</strong> Inside the moving car, the passenger and dashboard stay in the same positions relative to one another. From the sidewalk, the car and passenger move together past the observer. The description of motion changes because the reference point changes.</figcaption>
  </figure>
  <figure class="preview-card">
    <img src="./assets/illustrations/u1-t3-inertia-net-forces.svg" alt="Person pushing a box with applied force, friction, normal force, and gravity vectors">
    <figcaption><strong>Inertia and Net Forces:</strong> The applied force is larger than friction, so the horizontal forces are unbalanced and the box accelerates to the right. The upward normal force and downward gravity balance vertically.</figcaption>
  </figure>
</div>
</body>
</html>
